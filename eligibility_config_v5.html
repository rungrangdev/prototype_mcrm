<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.prod.min.js"></script>
<script src="store.js"></script>
<style>
@font-face {
  font-family: "Krungsri-med";
  font-style: normal;
  font-weight: normal;
  src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Krungsri-med',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  font-size:13.5px;background:#F7F5F2;color:#3D3835;
}
input,textarea,select{font-family:inherit}

/* ============ buttons (warm palette) ============ */
.btn-run{
  background:#5B4F4B;color:#FFFFFF;border:none;border-radius:7px;
  padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;box-shadow:0 1px 3px rgba(60,50,45,.18);
}
.btn-run:hover{background:#6F5F5E}
.btn-ghost{
  background:#FFFFFF;color:#5B4F4B;border:1px solid #E0D9D2;border-radius:7px;
  padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn-ghost:hover{background:#F3EEE9}
.btn-tan{
  background:#F3EDE7;color:#6F5F5E;border:1px solid #E0D6CB;border-radius:7px;
  padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-tan:hover{background:#EBE2D9}

/* ============ list page ============ */
.page_all{padding:0}
.page-header{
  background:#FFFFFF;border-bottom:1px solid #ECE7E1;
  padding:22px 32px;display:flex;align-items:center;justify-content:space-between;
}
.page-header h3{font-size:20px;font-weight:700;color:#2E2A27;letter-spacing:.2px}
.list-body{padding:22px 32px;max-width:1200px}
.list-sub{font-size:13px;color:#8A8480;margin-bottom:14px}

#el_table{
  width:100%;border-collapse:collapse;
  background:#FFFFFF;border:1px solid #E4DED7;
}
#el_table th{
  font-size:13.5px;font-weight:600;color:#FFFFFF;background:#6F5F5E;
  text-align:left;padding:14px 16px;border-right:1px solid rgba(255,255,255,.14);white-space:nowrap;
}
#el_table th:last-child{border-right:none}
#el_table td{
  padding:14px 16px;border:1px solid #ECE7E1;font-size:13.5px;color:#3D3835;background:#fff;vertical-align:middle;
}
#el_table tbody tr:hover td{background:#FBF9F7}
.cell-name{font-size:14px;font-weight:600;color:#2E2A27;margin-bottom:3px}
.cell-desc{font-size:12.5px;color:#8A8480}
.muted-dash{color:#B4ACA5}

.status-pill{
  display:inline-block;font-size:12.5px;font-weight:600;padding:5px 15px;border-radius:999px;
}
.sp-active{background:#E4F5EA;color:#2F9E5F}
.sp-draft{background:#FDEAEA;color:#D64C4C}

/* ⋮ dropdown */
.dropdown-container{position:relative;display:inline-block}
.btn-dots{
  border:none;background:none;cursor:pointer;font-size:19px;color:#8A8480;
  padding:2px 9px;border-radius:8px;line-height:1;font-family:inherit;
}
.btn-dots:hover{background:#F3EEE9;color:#3D3835}
.dropdown-menu{
  position:absolute;background:#fff;border:1px solid #E4DED7;border-radius:10px;
  box-shadow:0 6px 20px rgba(60,50,45,.14);min-width:110px;padding:4px;display:none;z-index:50;right:0;
}
.dropdown-menu.show{display:block}
.dropdown-menu button{
  display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:8px 13px;font-size:14px;color:#3D3835;border-radius:7px;font-family:inherit;
}
.dropdown-menu button:hover{background:#F3EEE9}

/* ============ editor canvas ============ */
.editor-canvas{
  padding:20px 24px;display:flex;flex-direction:column;gap:12px;
  background-image:radial-gradient(circle,#E3DCD4 1px,transparent 1px);
  background-size:11px 11px;min-height:520px;
}

/* meta card */
.meta-card{
  background:#FFFFFF;border:1px solid #E4DED7;border-radius:10px;
  box-shadow:0 1px 3px rgba(60,50,45,.07);
  padding:18px 22px 18px 26px;position:relative;
  display:flex;flex-direction:column;gap:18px;
}
.meta-card::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3.5px;
  border-radius:0 3px 3px 0;background:#5B4F4B;}
.meta-row{display:grid;gap:22px;align-items:top}
.meta-row-top{grid-template-columns:auto 1.6fr 1.6fr;padding-left:2px}
.meta-row-bottom{grid-template-columns:1.6fr 1fr 1fr;padding-left:2px}
.meta-row .btn-ghost{height:38px;padding:0 16px;font-size:13px}
.flabel{font-size:11px;font-weight:700;color:#8A8480;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;line-height:1}
.finput{
  border:1px solid #E4DED7 !important;border-radius:7px;padding:0 12px;font-size:13px;
  color:#3D3835;background:#FFFFFF;width:100%;height:38px;
}
.finput:focus{outline:none;border-color:#8A6F5C !important}
.field-with-add{display:flex;gap:6px;align-items:center}
.field-with-add .finput{flex:1}
.btn-icon-sm{width:38px;height:38px;flex-shrink:0;border-radius:7px;border:1px solid #E4DED7;background:#fff;color:#8A6F5C;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.btn-icon-sm:hover{background:#F3EEE9}
.code-big{font-size:17px;font-weight:700;color:#2E2A27;height:38px;display:flex;align-items:center;gap:8px}
.new-tag{font-size:11px;font-weight:700;color:#D64C4C;background:#FDEAEA;border-radius:999px;padding:2px 10px}
.status-wrap{display:flex;flex-direction:column}
.st-toggle{display:flex;border:1px solid #E0D9D2;border-radius:7px;overflow:hidden;width:fit-content;height:38px}
.st-btn{padding:0 20px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;background:#fff;color:#8A8480;font-family:inherit;height:100%}
.st-btn.on{background:#5B4F4B;color:#fff}
.last-mod{font-size:13px;color:#6B625C;white-space:nowrap;height:38px;display:flex;align-items:center}

/* ============ group card ============ */
.group-card{
  background:#FFFFFF;border:1px solid #E4DED7;border-radius:10px;overflow:visible;
  box-shadow:0 1px 3px rgba(60,50,45,.07);position:relative;
  transition:box-shadow .15s;
}
.group-card:hover{box-shadow:0 4px 12px rgba(60,50,45,.12)}
.group-card::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3.5px;
  border-radius:0 3px 3px 0;background:#B4ACA5;z-index:1}
.group-card.acc-d::before{background:#8A6F5C}
.group-card.acc-r::before{background:#2F9E5F}
.group-card.acc-k::before{background:#D64C4C}

.group-head{padding:12px 16px 12px 22px;background:#F7F5F2;border-bottom:1px solid #ECE7E1;
  display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
.group-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:#2E2A27}
.gbadge{font-size:11px;padding:2.5px 10px;border-radius:999px;font-weight:700}
.gb-d{background:#EFE9E3;color:#8A6F5C}
.gb-r{background:#E4F5EA;color:#2F9E5F}
.gb-k{background:#FDEAEA;color:#D64C4C}
.gcnt{font-size:11px;color:#8A8480;margin-left:2px}

.head-btn{
  background:#FFFFFF;border:1px solid #E4DED7;border-radius:6px;padding:5px 12px;
  font-size:11px;font-weight:600;color:#5B4F4B;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:4px;
}
.head-btn:hover{background:#F3EEE9}

.group-empty{padding:16px 22px;font-size:12.5px;color:#B4ACA5;font-style:italic}

/* condition rows */
.cond-wrap{border-bottom:1px solid #F1ECE6}
.cond-wrap:last-child{border-bottom:none}
.cond-row{display:flex;align-items:center;padding:10px 14px 10px 22px;gap:9px}
.cond-row.off{opacity:.38}
.drag-handle{color:#D6CFC7;font-size:14px;cursor:grab;flex-shrink:0;margin-right:2px}

/* switch — green */
.sw{position:relative;width:30px;height:17px;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;position:absolute;width:0;height:0}
.sw-track{position:absolute;inset:0;border-radius:9px;background:#E0D9D2;transition:background .18s}
.sw input:checked~.sw-track{background:#2F9E5F}
.sw-knob{position:absolute;top:2.5px;left:2.5px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .18s;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw input:checked~.sw-knob{left:15.5px}

.cond-field-sel,.cond-op-sel,.val-select{
  border:1px solid #E4DED7 !important;border-radius:7px;padding:7px 9px;font-size:12.5px;
  background:#FFFFFF;color:#3D3835;cursor:pointer;font-family:inherit;
}
.cond-field-sel{min-width:160px;font-weight:600}
.cond-op-sel{min-width:96px;font-family:Consolas,'Courier New',monospace;font-size:12px}
.val-select{min-width:150px;max-width:230px}
.cond-field-sel:focus,.cond-op-sel:focus,.val-select:focus{outline:none;border-color:#8A6F5C !important}

/* dataType chip */
.type-chip{
  font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;
  flex-shrink:0;line-height:1.4;border:1px solid transparent;
}
.tc-num{background:#EAF0F6;color:#4A6C8F;border-color:#DCE6EF}
.tc-txt{background:#EFE9E3;color:#8A6F5C;border-color:#E3DCD4}

/* tag value area */
.val-wrap{position:relative;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:170px;
  border:1px solid #E4DED7;border-radius:7px;padding:6px 9px;background:#FFFFFF;cursor:pointer;flex:1}
.vtag{display:inline-flex;align-items:center;gap:4px;background:#EFE9E3;border:1px solid #E3DCD4;
  border-radius:6px;padding:2px 8px;font-size:12px;color:#5B4F4B;font-weight:600;max-width:190px}
.vtag span.vtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtag-x{cursor:pointer;color:#B4ACA5;font-size:11px;line-height:1;flex-shrink:0}
.vtag-x:hover{color:#D64C4C}
.add-trig{font-size:12px;color:#8A6F5C;cursor:pointer;padding:2px 8px;border:1px dashed #D6C6B6;
  border-radius:6px;background:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-family:inherit}
.add-trig:hover{background:#F3EDE7}
.between-wrap{display:flex;align-items:center;gap:6px}
.between-input{border:1px solid #E4DED7 !important;border-radius:7px;padding:7px 9px;font-size:12.5px;width:78px;background:#fff;color:#3D3835}
.between-input:focus{outline:none;border-color:#8A6F5C !important}
.free-input{border:1px solid #E4DED7 !important;border-radius:7px;padding:7px 9px;font-size:12.5px;background:#fff;color:#3D3835;min-width:150px;flex:1}
.free-input:focus{outline:none;border-color:#8A6F5C !important}
.val-hint{font-size:11px;color:#B4ACA5;padding:0 4px;white-space:nowrap}

.cond-del{border:none;background:none;cursor:pointer;color:#B4ACA5;font-size:13px;padding:3px 5px;border-radius:6px;line-height:1;flex-shrink:0}
.cond-del:hover{background:#FDEAEA;color:#D64C4C}
.code-btn{border:1px solid #E4DED7;background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;color:#8A8480;cursor:pointer;font-family:Consolas,'Courier New',monospace;flex-shrink:0}
.code-btn:hover{background:#F3EEE9}

/* dropdown panel (multi-select values) */
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #E4DED7;border-radius:10px;
  box-shadow:0 6px 24px rgba(60,50,45,.16);z-index:200;min-width:210px;padding:0;
  max-height:280px;overflow:hidden;display:flex;flex-direction:column}
.dd-search-wrap{padding:7px 8px;border-bottom:1px solid #F1ECE6;flex-shrink:0}
.dd-search{width:100%;border:1px solid #E4DED7 !important;border-radius:6px;padding:5px 8px;font-size:12px;color:#3D3835;background:#FBF9F7}
.dd-search:focus{outline:none;border-color:#8A6F5C !important;background:#fff}
.dd-list{overflow-y:auto;padding:4px 0}
.dd-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;color:#3D3835;cursor:pointer}
.dd-opt:hover{background:#F7F5F2}
.dd-opt input[type=checkbox]{accent-color:#5B4F4B;width:13px;height:13px;flex-shrink:0}
.dd-opt.checked{color:#8A6F5C;font-weight:600}
.dd-empty{padding:10px 12px;font-size:12px;color:#B4ACA5;font-style:italic}
.dd-foot{padding:6px 8px;border-top:1px solid #F1ECE6;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#FBF9F7}
.dd-count{font-size:11px;color:#8A8480}
.dd-clear{border:none;background:none;font-size:11px;color:#8A6F5C;cursor:pointer;font-family:inherit;font-weight:600}

/* and/or connector */
.connector{display:flex;align-items:center;padding:0 20px;background:#F7F5F2;border-top:1px solid #F1ECE6}
.conn-btn{padding:4px 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;cursor:pointer;
  border:1px solid #E4DED7;background:#fff;color:#8A8480;font-family:inherit}
.conn-btn:first-child{border-radius:7px 0 0 7px}
.conn-btn:last-child{border-radius:0 7px 7px 0;border-left:none}
.conn-btn.active{background:#5B4F4B;color:#fff;border-color:#5B4F4B}

/* ============ NESTED GROUP ============ */
.nested-group-wrap{border-bottom:1px solid #F1ECE6}
.nested-group-wrap:last-child{border-bottom:none}
.nested-group{margin:8px 14px 8px 20px;border:1.5px solid #E4DED7;border-radius:10px;overflow:hidden;background:#FBF9F7}
.nested-group-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#F3EEE9;border-bottom:1px solid #ECE7E1}
.nested-group-label{font-size:11.5px;font-weight:700;color:#8A8480;display:flex;align-items:center;gap:6px}
.nested-badge{font-size:10px;padding:1px 7px;border-radius:999px;background:#fff;border:1px solid #E4DED7;color:#8A8480;font-weight:700}
.nested-cond-wrap{border-bottom:1px solid #F1ECE6}
.nested-cond-wrap:last-child{border-bottom:none}
.nested-cond-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#FBF9F7}
.nested-cond-row.off{opacity:.38}
.nested-connector{display:flex;align-items:center;padding:0 10px;background:#F3EEE9;border-top:1px solid #F1ECE6}
.nested-add-btn{display:flex;align-items:center;gap:4px;padding:7px 11px;font-size:12px;font-weight:600;color:#8A6F5C;cursor:pointer;border:none;background:none;width:100%;border-top:1px solid #F1ECE6;font-family:inherit}
.nested-add-btn:hover{background:#F3EDE7}
.nested-del-btn{border:none;background:none;cursor:pointer;color:#D6CFC7;font-size:12px;padding:2px 4px;border-radius:4px;flex-shrink:0}
.nested-del-btn:hover{background:#FDEAEA;color:#D64C4C}
.nested-group.accent-d{border-left:3px solid #8A6F5C}
.nested-group.accent-r{border-left:3px solid #2F9E5F}
.nested-group.accent-k{border-left:3px solid #D64C4C}

/* footer */
.editor-footer{background:#FFFFFF;border-top:1px solid #ECE7E1;padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between}

/* ============ MODALS ============ */
.fmodal-bg{position:fixed;inset:0;background:rgba(46,42,39,0.55);display:none;align-items:center;justify-content:center;z-index:1000}
.fmodal-bg.open{display:flex}
.fmodal{background:#fff;border-radius:10px;border:1px solid #E4DED7;width:680px;max-width:96%;max-height:88%;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(46,42,39,.22)}
.fmodal-head{padding:14px 18px;border-bottom:1px solid #ECE7E1;display:flex;align-items:center;justify-content:space-between;background:#fff;flex-shrink:0}
.fmodal-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;color:#2E2A27}
.fmodal-close{border:none;background:none;cursor:pointer;font-size:22px;color:#8A8480;padding:0 4px;border-radius:6px;line-height:1}
.fmodal-close:hover{background:#F3EEE9;color:#2E2A27}
.fmodal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;background:#fff}
.ftbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ftbl th{font-size:11.5px;font-weight:600;color:#fff;background:#6F5F5E;
  padding:9px 10px;border-right:1px solid rgba(255,255,255,.14);text-align:right}
.ftbl th:last-child{border-right:none}
.ftbl th:nth-child(1),.ftbl th:nth-child(2){text-align:left}
.ftbl td{padding:9px 10px;border-bottom:1px solid #F1ECE6;text-align:right;color:#3D3835;background:#fff}
.ftbl td:nth-child(1){text-align:center;color:#8A8480;font-size:11px}
.ftbl td:nth-child(2){text-align:left;font-weight:600}
.ftbl tr:last-child td{border-bottom:none}
.ftbl tr.skipped td{color:#D6CFC7}
.ftbl tr.skipped td:nth-child(2){text-decoration:line-through}
.neg{color:#D64C4C}
.bar-cell{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.mbar{width:50px;height:5px;border-radius:3px;background:#F1ECE6;overflow:hidden;flex-shrink:0}
.mbar-fill{height:100%;border-radius:3px;background:#D64C4C}
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum-card{background:#F7F5F2;border-radius:10px;padding:11px 13px;border:1px solid #ECE7E1}
.sum-lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8A8480;margin-bottom:4px}
.sum-val{font-size:18px;font-weight:700;color:#2E2A27}
.fmodal-foot{padding:11px 18px;border-top:1px solid #ECE7E1;display:flex;align-items:center;justify-content:space-between;background:#fff;flex-shrink:0}
.gen-note{font-size:11.5px;color:#8A8480}
.sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

/* SQL preview modal */
.sql-box{background:#F7F5F2;border:1px solid #E4DED7;border-radius:8px;padding:14px 16px;
  font-family:Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.75;color:#3D3835;white-space:pre-wrap;word-break:break-word}
.vld-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 0;border-bottom:1px solid #F1ECE6}
.vld-item:last-child{border-bottom:none}
.vld-dot{width:7px;height:7px;border-radius:50%;background:#D64C4C;margin-top:5px;flex-shrink:0}
.vld-ok{color:#2F9E5F;font-size:13px;font-weight:600}

/* small confirm / quick-add modal (same pattern as other master pages) */
.modal-overlay{position:fixed;inset:0;background:rgba(46,42,39,.42);display:flex;align-items:center;justify-content:center;z-index:1100}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:400px;max-width:92vw;box-shadow:0 12px 40px rgba(46,42,39,.22)}
.modal-box h3{margin:0 0 8px;font-size:16px;color:#2E2A27}
.modal-box p{margin:0 0 18px;color:#8A8480;font-size:13.5px;line-height:1.6}
.modal-box .field-group{margin-bottom:14px}
.modal-box label{display:block;font-size:12.5px;font-weight:600;color:#5B4F4B;margin-bottom:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.btn-danger{background:#D64C4C;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-danger:hover{background:#c33e3e}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  background:#5B4F4B;color:#fff;font-size:12.5px;font-weight:600;padding:9px 22px;border-radius:999px;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:9998;
  box-shadow:0 4px 14px rgba(46,42,39,.25)}
.toast.show{opacity:1}
</style>

<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

function toggleDropdown(event, button){
  event.stopPropagation();
  const currentMenu = button.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(menu => { if (menu !== currentMenu) menu.classList.remove('show'); });
  currentMenu.classList.toggle('show');
}
document.addEventListener('click', function(){
  document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
});

const TXT = MCRM.TXT, NUM = MCRM.NUM;
const S = str => str.split(',').map(v => v.trim()).filter(v => v !== '');
const OPS_NUMBER = ['=','!=','<','>','<=','>=','in','not in','between'];
const OPS_TEXT   = ['=','!=','in','not in'];
const opsFor = dt => dt === NUM ? OPS_NUMBER.slice() : OPS_TEXT.slice();
const isMulti = op => op === 'in' || op === 'not in';

let uidSeq = 0;
const uid = () => 'c' + (++uidSeq) + '_' + Date.now().toString(36);

function C(fieldId, op, vals, enabled, findField){
  const f = findField(fieldId);
  return { type:'cond', uid:uid(), fieldId, label: f ? f.label : fieldId, dataType: f ? f.dataType : TXT, op, vals: vals || [], enabled: enabled !== false };
}
function NC(fieldId, op, vals, enabled, findField){
  const c = C(fieldId, op, vals, enabled, findField);
  delete c.type;
  return c;
}

createApp({
  setup(){
    const nowStr = () => new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

    /* ---- base-key dictionary: shared with Parameter Master Setup via store.js.
       A parameter added there (and left active) automatically becomes a
       selectable condition field here. ---- */
    const rows = MCRM.db.rows;
    const activeParamCodes = computed(() => rows.filter(r => r.TYPE === 'PARAMETER' && r.ACTIVE === 'Y').map(r => r.CODE));
    const activeEntityCodes = computed(() => rows.filter(r => r.TYPE === 'ENTITY' && r.ACTIVE === 'Y').map(r => r.CODE));
    function fieldLabel(id){
      const meta = MCRM.FIELD_META[id];
      if (meta && meta.label) return meta.label;
      const r = rows.find(x => x.TYPE === 'PARAMETER' && x.CODE === id);
      return r ? r.NAME : id;
    }
    /* Every field known to the shared FIELD_META dictionary is available here (matches the
       original page's full condition list). A PARAMETER also added to the Parameter Master
       Setup catalog just picks up its display NAME from there; new parameters added elsewhere
       that aren't part of the fixed group layout show up under "Other". */
    const FIELD_GROUPS = computed(() => {
      const covered = new Set();
      const groups = MCRM.FIELD_GROUP_LAYOUT.map(g => {
        const fields = g.fields.map(id => {
          covered.add(id);
          const meta = MCRM.FIELD_META[id] || {};
          const values = id === 'entity' ? activeEntityCodes.value : (meta.values || []);
          return { id, label: fieldLabel(id), dataType: meta.dataType ?? TXT, values, hint: meta.hint, note: meta.note };
        });
        return { group: g.group, fields };
      });
      const other = activeParamCodes.value.filter(id => !covered.has(id)).map(id => {
        const meta = MCRM.FIELD_META[id] || {};
        return { id, label: fieldLabel(id), dataType: meta.dataType ?? TXT, values: meta.values || [] };
      });
      if (other.length) groups.push({ group:'Other', fields: other });
      return groups;
    });
    function findField(id){
      for (const g of FIELD_GROUPS.value){ const f = g.fields.find(x => x.id === id); if (f) return f; }
      return null;
    }
    /* Every condition row's field picker shows the full list regardless of which
       top-level group (Demographic/Retention/Risk) it lives in. */
    const allFields = computed(() => FIELD_GROUPS.value.flatMap(g => g.fields));

    function baseGroups(){
      return [
        { id:'demo', label:'Demographic Criteria', badge:'gb-d', dot:'#8A6F5C', accent:'accent-d', cardAcc:'acc-d',
          items:[
            C('product_id','in',['HP','AL'],true,findField),
            C('product_base','in',['New','Refin Topup'],true,findField),
            C('age','between',['20','64'],true,findField),
            C('nationality','=',['TH'],true,findField),
            C('region','in',['BKK'],true,findField),
            C('branch_code','not in',['16','42'],true,findField),
            C('customer_type','=',['individual'],true,findField),
            C('car_age','<=',['12'],true,findField),
            C('specialty_flag','!=',['Y'],false,findField),
          ] },
        { id:'ret', label:'Retention Criteria', badge:'gb-r', dot:'#2F9E5F', accent:'accent-r', cardAcc:'acc-r',
          items:[
            { type:'group', uid:uid(), label:'Occupation & Income Group', connector:'AND', enabled:true,
              conds:[
                NC('occupations','not in',['เจ้าของกิจการ-ไม่มีทะเบียนการค้า'],true,findField),
                NC('total_income','>=',['15000'],true,findField),
              ] },
            C('account_type','=',['ACTIVE'],true,findField),
            C('remaining_term','>=',['6'],true,findField),
            C('paid_term','>=',['6'],true,findField),
          ] },
        { id:'risk', label:'Risk Criteria', badge:'gb-k', dot:'#D64C4C', accent:'accent-k', cardAcc:'acc-k',
          items:[
            C('delinquency_status','=',['CURRENT'],true,findField),
            C('max_dq','not in',['90 DAYS','120 DAYS','150 DAYS','180 DAYS','365+ DAYS'],true,findField),
            C('gbi_customer','=',['G'],true,findField),
            C('b_score_customer','in',['A','B','C'],true,findField),
            C('collection_code','not in',['21700','21205'],true,findField),
            C('consignment_flag','!=',['Y'],true,findField),
            C('account_status','=',['NORMAL'],true,findField),
            C('write_off_criteria','=',['N'],true,findField),
            C('blacklist_customer','=',['N'],true,findField),
            C('debt_re_status','not in',['RE','RCL'],false,findField),
            C('reject_from_product','>=',['195'],true,findField),
            C('recently_apply','>=',['105'],true,findField),
          ] },
      ];
    }
    function emptyGroups(){ const gs = baseGroups(); gs.forEach(g => g.items = []); return gs; }

    /* ---- persisted list of Lead Eligible Config profiles ---- */
    const eligibles = MCRM.db.eligibility;
    function nextCode(){ return 'EL' + String(eligibles.length + 1).padStart(5,'0'); }

    /* option lists for the Lead Data Set / Lead Repository pickers — persisted so
       a name/profile added on one profile is available on every other profile.
       Both these and `eligibles` above are seeded centrally in store.js so they're
       populated even if this page isn't the first one loaded in a fresh session. */
    const eligibleNames = MCRM.db.eligibleNames;
    const eligibleProfiles = MCRM.db.eligibleProfiles;

    const showAddOption = reactive({ show:false, target:'', label:'', value:'' });
    function openAddOption(target, label){ Object.assign(showAddOption, { show:true, target, label, value:'' }); }
    function saveAddOption(){
      const v = showAddOption.value.trim();
      if (!v){ showToast('กรุณากรอกชื่อ'); return; }
      const list = showAddOption.target === 'name' ? eligibleNames : eligibleProfiles;
      if (list.includes(v)){ showToast('มีรายการนี้อยู่แล้ว'); return; }
      list.push(v);
      if (currentRec.value){ if (showAddOption.target === 'name') currentRec.value.name = v; else currentRec.value.profile = v; }
      showAddOption.show = false;
      showToast('เพิ่มรายการเรียบร้อย');
    }

    /* ---- navigation ---- */
    const pageView = ref('list');   // 'list' | 'editor'
    const currentRec = ref(null);
    const groups = computed(() => currentRec.value ? currentRec.value.groups : []);
    const collapsedGroups = reactive({});
    const topConnectors = reactive({});   // cosmetic-only AND/OR toggle between top-level items (matches original prototype behaviour)

    function addEligible(){
      openEditorRec({ isNew:true, code:'', name:'', profile:'', desc:'', status:'Draft', updated:'-', groups:emptyGroups() });
    }
    function openEditor(code){
      const rec = eligibles.find(r => r.code === code);
      if (rec) openEditorRec(rec);
    }
    function openEditorRec(rec){
      currentRec.value = rec;
      pageView.value = 'editor';
    }
    function backToList(){
      if (currentRec.value && currentRec.value.isNew) currentRec.value = null;
      pageView.value = 'list';
    }

    function setStatus(st){ if (currentRec.value) currentRec.value.status = st; }

    function saveProfile(asNew){
      const rec = currentRec.value;
      if (!rec) return;
      if (!rec.name || !rec.profile){ showToast('Select Lead Data Set and Lead Repository before saving'); return; }
      const issues = collectIssues(rec.groups);
      if (issues.length){ openValidate(issues, 'Fix these before saving'); return; }

      if (rec.isNew){
        rec.code = nextCode();
        delete rec.isNew;
        eligibles.push(rec);
      } else if (asNew){
        const copy = JSON.parse(JSON.stringify(rec));
        copy.code = nextCode();
        copy.status = 'Draft';
        eligibles.push(copy);
        currentRec.value = copy;
      }

      currentRec.value.updated = nowStr();
      showToast(asNew ? currentRec.value.code + ' saved as new profile' : currentRec.value.code + ' saved');
    }

    /* ---- delete profile (list page) ---- */
    const confirmDeleteRec = ref(null);
    function askDeleteEligible(rec){ confirmDeleteRec.value = rec; }
    function confirmDeleteEligible(){
      const rec = confirmDeleteRec.value;
      eligibles.splice(eligibles.findIndex(r => r === rec), 1);
      showToast(`ลบ "${rec.code}" ออกจากระบบแล้ว`);
      confirmDeleteRec.value = null;
    }

    /* ---- group / condition editing ---- */
    function toggleGroupCollapse(gid){ collapsedGroups[gid] = !collapsedGroups[gid]; }
    function newBlankCond(){ return { uid:uid(), fieldId:'', label:'Select condition', dataType:TXT, op:'=', vals:[], enabled:true }; }

    function addCond(g){ const c = newBlankCond(); c.type = 'cond'; g.items.push(c); showToast('Condition added'); }
    function addNestedGroup(g){ g.items.push({ type:'group', uid:uid(), label:'Nested Group', connector:'AND', enabled:true, conds:[newBlankCond()] }); showToast('Group added'); }
    function deleteItem(g, i){ g.items.splice(i,1); }
    function addCondToNestedGroup(grp){ grp.conds.push(newBlankCond()); showToast('Condition added'); }
    function deleteNestedCond(grp, ci){ grp.conds.splice(ci,1); }
    function setNestedConn(grp, val){ grp.connector = val; }

    function toggleTopConnector(key, val){ topConnectors[key] = val; }
    function topConnectorFor(key){ return topConnectors[key] || 'AND'; }

    function onFieldChange(g, c, fieldId){
      const f = findField(fieldId);
      if (!f) return;
      c.fieldId = f.id; c.label = f.label; c.dataType = f.dataType; c.op = '='; c.vals = [];
    }
    function onOpChange(c, newOp){
      const prev = c.op;
      c.op = newOp;
      if (c.op === 'between') c.vals = [c.vals[0]||'', c.vals[1]||''];
      else if (!isMulti(c.op)) c.vals = c.vals.slice(0,1);
      else if (prev === 'between') c.vals = c.vals.filter(v => v !== '');
      closePicker();
    }

    function condField(c){ return c.fieldId ? findField(c.fieldId) : null; }
    function condOpts(c){ const f = condField(c); return f ? (f.values || []) : []; }

    /* ---- multi-select value picker (like master-parameter's kv picker) ---- */
    const pickerCond = ref(null);
    const pickerSearch = ref('');
    function togglePicker(c){ pickerCond.value = pickerCond.value === c ? null : c; pickerSearch.value = ''; }
    function closePicker(){ pickerCond.value = null; pickerSearch.value = ''; }
    function pickerOptions(c){
      const opts = condOpts(c);
      const t = pickerSearch.value.trim().toLowerCase();
      return t ? opts.filter(o => o.toLowerCase().includes(t)) : opts;
    }
    function toggleVal(c, v){
      const i = c.vals.indexOf(v);
      if (i >= 0) c.vals.splice(i,1); else c.vals.push(v);
    }
    function removeVal(c, i){ c.vals.splice(i,1); }
    onMounted(() => document.addEventListener('click', closePicker));

    function freeMultiInput(c, text){ c.vals = S(text); }

    /* ---- SQL preview ---- */
    function q(c, v){ return c.dataType === NUM ? v : `'${String(v).replace(/'/g,"''")}'`; }
    function sqlOf(c){
      if (!c.fieldId) return '-- incomplete condition';
      const col = c.fieldId;
      if (c.op === 'between') return `${col} BETWEEN ${q(c,c.vals[0]||'?')} AND ${q(c,c.vals[1]||'?')}`;
      if (isMulti(c.op)){ const list = c.vals.length ? c.vals.map(v=>q(c,v)).join(', ') : '?'; return `${col} ${c.op.toUpperCase()} (${list})`; }
      return `${col} ${c.op} ${q(c, c.vals[0] || '?')}`;
    }
    function buildFullSql(){
      const blocks = [];
      groups.value.forEach(g => {
        const parts = [];
        g.items.forEach(item => {
          if (item.type === 'group'){
            const inner = item.conds.filter(c=>c.enabled && c.fieldId).map(sqlOf);
            if (inner.length) parts.push('( ' + inner.join(` ${item.connector} `) + ' )');
          } else if (item.enabled && item.fieldId){
            parts.push(sqlOf(item));
          }
        });
        if (parts.length) blocks.push(`  /* ${g.label} */\n  ` + parts.join('\n  AND '));
      });
      if (!blocks.length) return 'SELECT * FROM lead_pool;';
      return 'SELECT *\nFROM lead_pool\nWHERE\n' + blocks.join('\n  AND\n') + ';';
    }

    const sqlModal = reactive({ open:false, title:'', mode:'sql', sql:'', issues:[], note:'' });
    function showSql(){ Object.assign(sqlModal, { open:true, title:'SQL Preview', mode:'sql', sql:buildFullSql(), note:'Preview only — generated from enabled conditions' }); }
    function closeSql(){ sqlModal.open = false; }

    function eachCond(groupsArr, fn){
      groupsArr.forEach(g => g.items.forEach(item => {
        if (item.type === 'group') item.conds.forEach(c => fn(c, g));
        else fn(item, g);
      }));
    }
    function collectIssues(groupsArr){
      const issues = [];
      eachCond(groupsArr, (c, g) => {
        if (!c.enabled) return;
        const where = g.label;
        if (!c.fieldId){ issues.push(`${where}: a condition has no field selected`); return; }
        if (c.op === 'between'){
          const [a,b] = c.vals;
          if (a === undefined || a === '' || b === undefined || b === '') issues.push(`${where} › ${c.label}: between needs both min and max`);
          else if (Number(a) > Number(b)) issues.push(`${where} › ${c.label}: min (${a}) is greater than max (${b})`);
        } else if (!c.vals.length || c.vals.every(v => v === '' || v === undefined)){
          issues.push(`${where} › ${c.label}: no value set`);
        }
      });
      return issues;
    }
    function openValidate(issues, title){ Object.assign(sqlModal, { open:true, title, mode:'validate', issues, note: issues.length ? issues.length+' issue'+(issues.length>1?'s':'')+' found' : 'No issues found' }); }
    function validateLogic(){ openValidate(collectIssues(groups.value), 'Validate Logic'); }

    /* ---- toast ---- */
    const toast = reactive({ show:false, msg:'' });
    let toastTimer = null;
    function showToast(msg){ toast.msg = msg; toast.show = true; clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.show = false, 2400); }

    return {
      eligibles, currentRec, pageView, groups, collapsedGroups,
      addEligible, openEditor, backToList, setStatus, saveProfile,
      confirmDeleteRec, askDeleteEligible, confirmDeleteEligible,
      eligibleNames, eligibleProfiles, showAddOption, openAddOption, saveAddOption,
      FIELD_GROUPS, allFields, findField,
      toggleGroupCollapse, addCond, addNestedGroup, deleteItem, addCondToNestedGroup, deleteNestedCond, setNestedConn,
      toggleTopConnector, topConnectorFor,
      onFieldChange, onOpChange, condField, condOpts,
      pickerCond, pickerSearch, togglePicker, closePicker, pickerOptions, toggleVal, removeVal, freeMultiInput,
      isMulti, NUM,
      sqlOf, sqlModal, showSql, closeSql, validateLogic,
      toast, showToast, nextCode, opsFor,
    };
  },
  template: `
  <div id="app">

    <!-- ============ LIST PAGE ============ -->
    <div id="table_e" class="page_all" style="padding:24px 32px;background:#fff;min-height:100vh" v-if="pageView==='list'">
      <h3 style="font-size:21px;font-weight:700;color:#2E2A27;margin-bottom:14px">Lead Eligible Config</h3>
      <div align="right" style="margin-bottom:12px;">
        <button class="btn-run" @click="addEligible">+ Add</button>
      </div>
      <div class="list-body" style="padding:0;max-width:none">
        <table id="el_table" width="100%">
          <thead>
            <tr>
              <th>Eligible Code</th><th>Lead Data Set</th><th>Lead Repository</th><th>Profile description</th>
              <th>Status</th><th>Update Date</th><th style="width:44px"></th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="rec in eligibles" :key="rec.code">
              <td align="center" style="font-weight:600;color:#3D3835">{{ rec.code }}</td>
              <td><div class="cell-name"><span v-if="rec.name">{{ rec.name }}</span><span v-else class="muted-dash">—</span></div></td>
              <td><span v-if="rec.profile">{{ rec.profile }}</span><span v-else class="muted-dash">—</span></td>
              <td><span class="cell-desc" v-if="rec.desc">{{ rec.desc }}</span><span v-else class="muted-dash">—</span></td>
              <td align="center"><span class="status-pill" :class="rec.status==='Active' ? 'sp-active' : 'sp-draft'">{{ rec.status }}</span></td>
              <td align="center">{{ rec.updated }}</td>
              <td align="center">
                <div class="dropdown-container">
                  <button class="btn-dots" onclick="toggleDropdown(event, this)">⋮</button>
                  <div class="dropdown-menu">
                    <button @click="openEditor(rec.code)">Edit</button>
                    <button @click="askDeleteEligible(rec)">Delete</button>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ============ EDITOR PAGE ============ -->
    <div class="page" id="root" v-if="pageView==='editor' && currentRec">
      <div class="editor-canvas">
        <div class="meta-card">
          <div class="meta-row meta-row-top">
            <div>
              <div class="flabel">Eligible Code</div>
              <div class="code-big"><span>{{ currentRec.isNew ? nextCode() : currentRec.code }}</span><span class="new-tag" v-if="currentRec.isNew">Unsaved</span></div>
            </div>
            <div>
              <div class="flabel">Lead Data Set (Source)</div>
              <div class="field-with-add">
                <select class="finput" v-model="currentRec.name">
                  <option value="">— Select —</option>
                  <option v-for="n in eligibleNames" :key="n" :value="n">{{ n }}</option>
                </select>
                <button type="button" style="display:none;" class="btn-icon-sm" title="Add new name" @click="openAddOption('name','Lead Data Set')">+</button>
              </div>
            </div>
            <div>
              <div class="flabel">Lead Repository (Target)</div>
              <div class="field-with-add">
                <select class="finput" v-model="currentRec.profile">
                  <option value="">— Select —</option>
                  <option v-for="p in eligibleProfiles" :key="p" :value="p">{{ p }}</option>
                </select>
                <button type="button" style="display:none;" class="btn-icon-sm" title="Add new profile" @click="openAddOption('profile','Lead Repository')">+</button>
              </div>
            </div>
          </div>
          <div class="meta-row meta-row-bottom">
            <div>
              <div class="flabel">Profile description</div>
              <input class="finput" v-model="currentRec.desc" placeholder="Add description…">
            </div>
            <div class="status-wrap">
              <div class="flabel">Status</div>
              <div class="st-toggle">
                <button class="st-btn" :class="{on: currentRec.status==='Draft'}" @click="setStatus('Draft')">Draft</button>
                <button class="st-btn" :class="{on: currentRec.status==='Active'}" @click="setStatus('Active')">Active</button>
              </div>
            </div>
            <div>
              <div class="flabel">Last modified</div>
              <span class="last-mod">{{ currentRec.updated || '-' }}</span>
            </div>
          </div>
        </div>

        <div id="groups-container" style="display:flex;flex-direction:column;gap:12px">
          <div class="group-card" :class="g.cardAcc" v-for="g in groups" :key="g.id">
            <div class="group-head">
              <span class="group-title">
                <span :style="{width:'9px',height:'9px','border-radius':'50%',background:g.dot,display:'inline-block'}"></span>
                {{ g.label }}
                <span class="gbadge" :class="g.badge">
                  {{ g.items.reduce((t,it)=> t + (it.type==='group' ? it.conds.length : 1), 0) }} condition{{ g.items.reduce((t,it)=> t + (it.type==='group' ? it.conds.length : 1), 0) !== 1 ? 's' : '' }}
                </span>
                <span class="gcnt" v-if="(function(){var t=0,a=0; g.items.forEach(it=>{ (it.type==='group'?it.conds:[it]).forEach(c=>{t++; if(c.enabled)a++;});}); return a<t;})()">
                  {{ (function(){var a=0; g.items.forEach(it=>{ (it.type==='group'?it.conds:[it]).forEach(c=>{ if(c.enabled)a++; });}); return a;})() }} active
                </span>
              </span>
              <div style="display:flex;gap:6px">
                <button class="head-btn" @click="addCond(g)">+ Add Condition</button>
                <button class="head-btn" @click="addNestedGroup(g)">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 5h3M5 3.5v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                  Add Group
                </button>
                <button class="head-btn" @click="toggleGroupCollapse(g.id)">{{ collapsedGroups[g.id] ? 'Expand' : 'Collapse' }}</button>
              </div>
            </div>

            <div v-show="!collapsedGroups[g.id]">
              <div class="group-empty" v-if="!g.items.length">No conditions yet — use "+ Add Condition" to start.</div>

              <template v-for="(item, i) in g.items" :key="item.uid">

                <!-- nested group -->
                <div class="nested-group-wrap" v-if="item.type==='group'">
                  <div class="nested-group" :class="g.accent">
                    <div class="nested-group-head">
                      <span class="nested-group-label">
                        <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="0.5" y="0.5" width="10" height="10" rx="2.5" stroke="currentColor" stroke-width="1"/></svg>
                        Nested Group
                        <span class="nested-badge">{{ item.conds.length }} condition{{ item.conds.length!==1?'s':'' }}</span>
                      </span>
                      <div style="display:flex;gap:4px;align-items:center">
                        <span style="font-size:10px;color:#8A8480;margin-right:2px">Group connector:</span>
                        <div style="display:flex;border:1px solid #E4DED7;border-radius:6px;overflow:hidden">
                          <button class="conn-btn" :class="{active:item.connector==='AND'}" style="font-size:9px;padding:2px 7px" @click="setNestedConn(item,'AND')">AND</button>
                          <button class="conn-btn" :class="{active:item.connector==='OR'}" style="font-size:9px;padding:2px 7px;border-left:none" @click="setNestedConn(item,'OR')">OR</button>
                        </div>
                        <button class="nested-del-btn" title="Delete group" @click="deleteItem(g,i)">&#128465;</button>
                      </div>
                    </div>

                    <div>
                      <template v-for="(c, ci) in item.conds" :key="c.uid">
                        <div class="nested-cond-wrap">
                          <div class="nested-cond-row" :class="{off: !c.enabled}">
                            <label class="sw">
                              <input type="checkbox" v-model="c.enabled"><div class="sw-track"></div><div class="sw-knob"></div>
                            </label>
                            <select class="cond-field-sel" style="min-width:150px" :value="c.fieldId" @change="onFieldChange(g,c,$event.target.value)">
                              <option value="" disabled :selected="!c.fieldId">Select condition</option>
                              <option v-for="f in allFields" :key="f.id" :value="f.id" :title="f.note||''">{{ f.label }}</option>
                            </select>
                            <span class="type-chip" :class="c.dataType===NUM ? 'tc-num':'tc-txt'" :title="c.dataType===NUM?'dataType: number':'dataType: 0 (text)'">{{ c.dataType===NUM ? '123' : 'ABC' }}</span>
                            <select class="cond-op-sel" :value="c.op" @change="onOpChange(c,$event.target.value)">
                              <option v-for="o in opsFor(c.dataType)" :key="o" :value="o">{{ o }}</option>
                            </select>

                            <span class="val-hint" v-if="!c.fieldId">select a condition first</span>
                            <template v-else>
                              <div class="between-wrap" v-if="c.op==='between'">
                                <input class="between-input" type="number" placeholder="min" v-model="c.vals[0]">
                                <span style="font-size:11px;color:#8A8480">and</span>
                                <input class="between-input" type="number" placeholder="max" v-model="c.vals[1]">
                              </div>
                              <input v-else-if="isMulti(c.op) && !condOpts(c).length" class="free-input" placeholder="comma separated e.g. 10,20,30" :value="c.vals.join(',')" @input="freeMultiInput(c,$event.target.value)">
                              <div class="val-wrap" v-else-if="isMulti(c.op)" @click.stop="togglePicker(c)">
                                <span class="vtag" v-for="(v,vi) in c.vals" :key="v" :title="v"><span class="vtxt">{{ v }}</span><span class="vtag-x" @click.stop="removeVal(c,vi)">&times;</span></span>
                                <button type="button" class="add-trig" @click.stop="togglePicker(c)">+ <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5h6M4.5 1.5v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
                                <div class="dd-panel" v-if="pickerCond===c" @click.stop>
                                  <div class="dd-search-wrap"><input class="dd-search" v-model="pickerSearch" :placeholder="'Search ' + condOpts(c).length + ' values…'"></div>
                                  <div class="dd-list">
                                    <label class="dd-opt" v-for="o in pickerOptions(c)" :key="o" :class="{checked: c.vals.includes(o)}">
                                      <input type="checkbox" :checked="c.vals.includes(o)" @change="toggleVal(c,o)"><span>{{ o }}</span>
                                    </label>
                                    <div class="dd-empty" v-if="!pickerOptions(c).length">No matching value</div>
                                  </div>
                                  <div class="dd-foot"><span class="dd-count">{{ c.vals.length }} / {{ condOpts(c).length }} selected</span><button type="button" class="dd-clear" @click.stop="c.vals=[]">Clear all</button></div>
                                </div>
                              </div>
                              <select v-else-if="condOpts(c).length" class="val-select" v-model="c.vals[0]">
                                <option value="" disabled>— value —</option>
                                <option v-for="v in condOpts(c)" :key="v" :value="v">{{ v }}</option>
                              </select>
                              <input v-else class="free-input" :type="c.dataType===NUM ? 'number' : 'text'" v-model="c.vals[0]" :placeholder="condField(c)?.hint || 'value'">
                            </template>

                            <button class="code-btn" @click="showToast(sqlOf(c))">&lt;/&gt;</button>
                            <button class="nested-del-btn" @click="deleteNestedCond(item,ci)">&#128465;</button>
                          </div>
                        </div>
                        <div class="nested-connector" v-if="ci < item.conds.length - 1">
                          <button class="conn-btn" :class="{active:item.connector==='AND'}" style="margin:3px 0;font-size:9px;padding:2px 8px">AND</button>
                          <button class="conn-btn" :class="{active:item.connector==='OR'}" style="font-size:9px;padding:2px 8px;border-left:none">OR</button>
                        </div>
                      </template>
                    </div>

                    <button class="nested-add-btn" @click="addCondToNestedGroup(item)">
                      <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5h6M4.5 1.5v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Add condition to group
                    </button>
                  </div>
                </div>

                <!-- plain condition -->
                <div class="cond-wrap" v-else>
                  <div class="cond-row" :class="{off: !item.enabled}">
                    <span class="drag-handle">⠿</span>
                    <label class="sw"><input type="checkbox" v-model="item.enabled"><div class="sw-track"></div><div class="sw-knob"></div></label>
                    <select class="cond-field-sel" style="min-width:170px" :value="item.fieldId" @change="onFieldChange(g,item,$event.target.value)">
                      <option value="" disabled :selected="!item.fieldId">Select condition</option>
                      <option v-for="f in allFields" :key="f.id" :value="f.id" :title="f.note||''">{{ f.label }}</option>
                    </select>
                    <span class="type-chip" :class="item.dataType===NUM ? 'tc-num':'tc-txt'" :title="item.dataType===NUM?'dataType: number':'dataType: 0 (text)'">{{ item.dataType===NUM ? '123' : 'ABC' }}</span>
                    <select class="cond-op-sel" :value="item.op" @change="onOpChange(item,$event.target.value)">
                      <option v-for="o in opsFor(item.dataType)" :key="o" :value="o">{{ o }}</option>
                    </select>

                    <span class="val-hint" v-if="!item.fieldId">select a condition first</span>
                    <template v-else>
                      <div class="between-wrap" v-if="item.op==='between'">
                        <input class="between-input" type="number" placeholder="min" v-model="item.vals[0]">
                        <span style="font-size:11px;color:#8A8480">and</span>
                        <input class="between-input" type="number" placeholder="max" v-model="item.vals[1]">
                      </div>
                      <input v-else-if="isMulti(item.op) && !condOpts(item).length" class="free-input" placeholder="comma separated e.g. 10,20,30" :value="item.vals.join(',')" @input="freeMultiInput(item,$event.target.value)">
                      <div class="val-wrap" v-else-if="isMulti(item.op)" @click.stop="togglePicker(item)">
                        <span class="vtag" v-for="(v,vi) in item.vals" :key="v" :title="v"><span class="vtxt">{{ v }}</span><span class="vtag-x" @click.stop="removeVal(item,vi)">&times;</span></span>
                        <button type="button" class="add-trig" @click.stop="togglePicker(item)">+ <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5h6M4.5 1.5v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
                        <div class="dd-panel" v-if="pickerCond===item" @click.stop>
                          <div class="dd-search-wrap"><input class="dd-search" v-model="pickerSearch" :placeholder="'Search ' + condOpts(item).length + ' values…'"></div>
                          <div class="dd-list">
                            <label class="dd-opt" v-for="o in pickerOptions(item)" :key="o" :class="{checked: item.vals.includes(o)}">
                              <input type="checkbox" :checked="item.vals.includes(o)" @change="toggleVal(item,o)"><span>{{ o }}</span>
                            </label>
                            <div class="dd-empty" v-if="!pickerOptions(item).length">No matching value</div>
                          </div>
                          <div class="dd-foot"><span class="dd-count">{{ item.vals.length }} / {{ condOpts(item).length }} selected</span><button type="button" class="dd-clear" @click.stop="item.vals=[]">Clear all</button></div>
                        </div>
                      </div>
                      <select v-else-if="condOpts(item).length" class="val-select" v-model="item.vals[0]">
                        <option value="" disabled>— value —</option>
                        <option v-for="v in condOpts(item)" :key="v" :value="v">{{ v }}</option>
                      </select>
                      <input v-else class="free-input" :type="item.dataType===NUM ? 'number' : 'text'" v-model="item.vals[0]" :placeholder="condField(item)?.hint || 'value'">
                    </template>

                    <button class="code-btn" @click="showToast(sqlOf(item))">&lt;/&gt;</button>
                    <button class="cond-del" @click="deleteItem(g,i)">&#128465;</button>
                  </div>
                </div>

                <div class="connector" v-if="i < g.items.length - 1">
                  <button class="conn-btn" :class="{active: topConnectorFor(g.id+'-'+i)==='AND'}" style="margin:4px 0" @click="toggleTopConnector(g.id+'-'+i,'AND')">AND</button>
                  <button class="conn-btn" :class="{active: topConnectorFor(g.id+'-'+i)==='OR'}" @click="toggleTopConnector(g.id+'-'+i,'OR')">OR</button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <div class="editor-footer">
        <div style="display:flex;gap:8px">
          <button class="btn-ghost" @click="validateLogic">Validate Logic</button>
          <button class="btn-ghost" @click="showSql">View SQL</button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost" @click="backToList">Cancel</button>
          <button class="btn-ghost" v-if="!currentRec.isNew" @click="saveProfile(true)">Save as New Profile</button>
          <button class="btn-run" @click="saveProfile(false)">Save Profile</button>
        </div>
      </div>

      <!-- SQL / VALIDATE MODAL -->
      <div class="fmodal-bg" :class="{open: sqlModal.open}" @click="$event.target===$event.currentTarget && closeSql()">
        <div class="fmodal" style="width:620px">
          <div class="fmodal-head"><span class="fmodal-title">{{ sqlModal.title }}</span><button class="fmodal-close" @click="closeSql">&times;</button></div>
          <div class="fmodal-body">
            <div class="sql-box" v-if="sqlModal.mode==='sql'">{{ sqlModal.sql }}</div>
            <template v-else>
              <div class="vld-ok" v-if="!sqlModal.issues.length">All conditions are complete. Logic is valid.</div>
              <div class="vld-item" v-for="(t,i) in sqlModal.issues" :key="i"><span class="vld-dot"></span><span>{{ t }}</span></div>
            </template>
          </div>
          <div class="fmodal-foot"><span class="gen-note">{{ sqlModal.note }}</span><button class="btn-run" @click="closeSql">Close</button></div>
        </div>
      </div>
    </div>

    <!-- Add name/profile option modal -->
    <div class="modal-overlay" v-if="showAddOption.show" @click.self="showAddOption.show=false">
      <div class="modal-box">
        <h3>Add {{ showAddOption.label }}</h3>
        <p>This will be added to the shared list and reusable on every profile.</p>
        <div class="field-group"><label>{{ showAddOption.label }}</label><input class="finput" v-model="showAddOption.value" style="width:100%"></div>
        <div class="modal-actions"><button class="btn-ghost" @click="showAddOption.show=false">Cancel</button><button class="btn-run" @click="saveAddOption">Add</button></div>
      </div>
    </div>

    <!-- Delete profile confirm -->
    <div class="modal-overlay" v-if="confirmDeleteRec" @click.self="confirmDeleteRec=null">
      <div class="modal-box">
        <h3>Delete this profile?</h3>
        <p>You are about to delete <strong>{{ confirmDeleteRec.code }}</strong> ({{ confirmDeleteRec.name || 'unnamed' }}). This cannot be undone.</p>
        <div class="modal-actions"><button class="btn-ghost" @click="confirmDeleteRec=null">Cancel</button><button class="btn-danger" @click="confirmDeleteEligible">Delete</button></div>
      </div>
    </div>

    <div class="toast" :class="{show: toast.show}">{{ toast.msg }}</div>
  </div>
  `
}).mount('#app');
</script>
