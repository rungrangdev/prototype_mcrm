<style>

@font-face {
    font-family: "Krungsri-med";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

  :root{
    --bg:#F1F3F6;
    --surface:#FFFFFF;
    --surface-alt:#F7F8FA;
    --primary:#6f5f5e;
    --primary-dark:#1B3050;
    --accent:#E6A23D;
    --accent-soft:#FBEEDA;
    --text:#1C2333;
    --text-secondary:#6B7280;
    --border:#E3E6EC;
    --success:#2F9E68;
    --success-soft:#E5F5EC;
    --danger:#D64545;
    --danger-soft:#FBEAEA;
    --violet:#6D5BD0;
    --violet-soft:#EDEAFB;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(20,30,50,.06);
    --shadow-md:0 8px 24px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box;
    font-family: 'Krungsri-med';    
}

  .mono{font-family:'Krungsri-med', monospace;}
  #app{min-height:100vh;display:flex;flex-direction:column;background-color: #FFF;}

  .app-header p{margin:2px 0 0;font-size:12.5px;color:#C9D5E6;}

  .admin-chip .dot{width:8px;height:8px;border-radius:50%;background:#6FE3A6;}

  .tabbar{display:flex;gap:4px;max-width:1360px;margin:0 auto;padding:0;}

  /* .layout{flex:1;display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px 28px 32px;max-width:1360px;width:100%;margin:0 auto;}
  .layout.single{grid-template-columns:1fr;} */
  /* @media (max-width:860px){.layout{grid-template-columns:1fr;}} */

  .cabinet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;height:fit-content;}
  .cabinet h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-secondary);margin:4px 8px 12px;font-weight:600;}
  .drawer{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:4px;font-family:'Krungsri-med';font-size:14px;color:var(--text);position:relative;transition:transform .12s ease, background .12s ease;}
  .drawer:hover{background:var(--surface-alt);}
  .drawer.active{background:var(--primary);color:#fff;transform:translateX(4px);box-shadow:var(--shadow-sm);}
  .drawer.active::before{content:'';position:absolute;left:-4px;top:8px;bottom:8px;width:4px;background:var(--accent);border-radius:2px;}

  .drawer-icon::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:2px;background:currentColor;transform:translate(-50%,-50%);border-radius:2px;}
  .drawer-label{flex:1;min-width:0;}
  .drawer-name{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drawer-code{font-size:11px;opacity:.75;}
  .drawer-count{font-size:11.5px;background:rgba(0,0,0,.08);padding:2px 8px;border-radius:20px;font-weight:600;}

  .drawer-inactive-tag{font-size:10px;background:var(--danger-soft);color:var(--danger);padding:1px 6px;border-radius:10px;margin-left:4px;}

  .search-box input{border:none;background:transparent;outline:none;font-family:'Krungsri-med';font-size:13.5px;width:100%;color:var(--text);}

  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}

  .switch input{opacity:0;width:0;height:0;}

  .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:var(--shadow-sm);}

  .selected-keys-box{margin-top:12px;padding:12px;background:var(--surface-alt);border-radius:8px;min-height:44px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

  .sel-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);padding:5px 6px 5px 10px;border-radius:20px;font-size:12.5px;}
  .sel-chip .idx{background:var(--violet);color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .sel-chip button{border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:13px;line-height:1;padding:2px;}
  .preview-line{margin-top:10px;font-size:12px;color:var(--text-secondary);background:var(--surface-alt);padding:8px 10px;border-radius:6px;}
  .preview-line b{color:var(--text);}

  .overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;justify-content:flex-start;z-index:50;}
  .side-drawer{width:440px;max-width:92vw;background:var(--surface);box-shadow:var(--shadow-md);display:flex;flex-direction:column;animation:slideIn .18s ease;
    top:20px;
    margin-bottom:70px;
    left: 33%;
   position: relative;
}
  @keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .side-drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}

  .close-x{background:none;border:none;font-size:20px;color:var(--text-secondary);cursor:pointer;line-height:1;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}

  .field input[type=text], .field input[type=number], .field textarea, .field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;color:var(--text);background:var(--surface-alt);outline:none;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--primary);background:#fff;}
  .field textarea{resize:vertical;min-height:64px;}
  .active-toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);padding:12px 14px;border-radius:8px;}
  .active-toggle-row .lab strong{display:block;font-size:13.5px;}
  .active-toggle-row .lab span{font-size:12px;color:var(--text-secondary);}
  .meta-box{margin-top:6px;padding:12px 14px;background:var(--surface-alt);border-radius:8px;font-size:12px;color:var(--text-secondary);line-height:1.7;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow-md);z-index:80;display:flex;align-items:center;gap:10px;}
  .toast .tick{color:#6FE3A6;font-weight:700;}

  /* กล่องครอบ */
.dropdown-container {
    position: relative;
    display: inline-block;
  }
  
  /* ปุ่ม 3 จุด */
  .btn-dots {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 0 8px;
    color: #6b7280; /* สีเทา */
    transition: color 0.2s;
  }
  
  .btn-dots:hover {
    color: #000000; /* เปลี่ยนสีเมื่อเอาเมาส์วาง */
  }
  
.dropdown-menu {
    display: none;
    position: absolute;
    
    /*--- จัดตำแหน่งให้อยู่ใต้ปุ่ม 3 จุดและชิดขวาพอดี ---*/
    top: 100%; 
    right: 0; /* เปลี่ยนจาก right: -70px เป็น 0 เพื่อให้ขอบขวาตรงกับปุ่ม 3 จุดพอดี */
    
    /* ลบคำสั่ง transform: translateX(-50%) ออก เพื่อไม่ให้พิกัดเพี้ยน */
    
    /*--- ความกว้างและพื้นที่ภายใน ---*/
    width: max-content; /* ปล่อยให้กล่องกว้างพอดีคำที่ยาวที่สุด (Delete) อัตโนมัติ */
    min-width: 100px;   /* กำหนดขั้นต่ำไว้เล็กน้อยเพื่อความสวยงาม */
    padding: 6px;       /* ปรับพื้นที่รอบๆ ปรับจาก 8px ลงมาหน่อยให้ดูกระชับ */
    
    /*--- หน้าตาและมิติ ---*/
    background-color: #ffffff;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1); /* เพิ่มความฟุ้งของเงาให้ดูโมเดิร์นลอยขึ้น */
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    z-index: 10;

    button {
        display: block;   /* บังคับให้ปุ่มแยกแถวกันชัดเจน */
        width: 100%;      /* ให้ปุ่มขยายกว้างเต็มพื้นที่กล่องแม่ */
        font-size: 16px;  /* แนะนำให้ใช้ px (ประมาณ 10-11pt) จะคุมขนาดบนหน้าเว็บได้นิ่งกว่า pt */
        padding: 6px 12px; /* เพิ่ม padding ซ้าย-ขวา ให้มีช่องไฟหายใจ ไม่ติดขอบกล่อง */
        border: none;
        background-color: transparent;
        cursor: pointer;
        text-align: left; /* ชิดซ้ายตามสไตล์เมนูทั่วไป */
        color: #1f2937;   /* สีตัวอักษรเทาเข้มเกือบดำ ดูพรีเมียมกว่าสีดำสนิท */
        white-space: nowrap; /* ล็อกไว้ไม่ให้ตัวหนังสือตกบรรทัด */
    }
    
    button:hover {
        background-color: #F3F4F6; /* สีเทาอ่อนเวลาชี้แบบในรูปของคุณ */
        border-radius: 4px;
        color: #000000;
    }
}
  
  /* คลาสที่จะถูกเปิดด้วย JavaScript เมื่อคลิก */
  .dropdown-menu.show {
    display: block;
  }

  .modal-overlay{
    z-index:99999;
  }

  input[readonly]{
    background-color: #f5f5f5;
    cursor: not-allowed;
  }
</style>

<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed } = Vue;

function toggleDropdown(event, button) {
    // กันไม่ให้ Event ลามไปยัง Element อื่น
    event.stopPropagation();
    
    // หาเมนูที่อยู่ข้าง ๆ ปุ่มที่คลิก
    const currentMenu = button.nextElementSibling;
    
    // ปิด Dropdown ตัวอื่น ๆ ที่อาจจะเปิดค้างอยู่บนหน้าจอ
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        if (menu !== currentMenu) {
        menu.classList.remove('show');
        }
    });

    // สลับการเปิด/ปิด (Toggle) เมนูปัจจุบัน
    currentMenu.classList.toggle('show');
    }

    // ถ้าคลิกพื้นที่อื่นภายนอกปุ่ม ให้ปิดเมนูทันที
    document.addEventListener('click', function() {
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        menu.classList.remove('show');
    });
    });

    <div class="modal-overlay" v-if="quickAdd.show" @click.self="quickAdd.show=false">
      <div class="modal-box">
        <h3>เพิ่ม{{ quickAdd.typeLabel }}ใหม่</h3>
        <p>รายการนี้จะถูกเพิ่มเข้าแคตตาล็อกกลาง และเลือกใช้ได้ทันทีจากทุกหน้าจอ</p>
        <div class="field"><label>รหัส</label><input type="text" v-model="quickAdd.CODE" placeholder="เช่น TOPUP"></div>
        <div class="field"><label>ชื่อที่แสดงผล</label><input type="text" v-model="quickAdd.NAME"></div>
        <div class="modal-actions"><button class="btn btn-ghost" @click="quickAdd.show=false">ยกเลิก</button><button class="btn btn-primary" @click="saveQuickAdd">เพิ่มรายการ</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteRow" @click.self="cancelDelete">
      <div class="modal-box">
        <h3>ลบรายการนี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ confirmDeleteRow.NAME }}</strong> ({{ confirmDeleteRow.CODE }}) การลบไม่สามารถย้อนกลับได้</p>
        <div class="warn-box" v-if="blockingDependents.length">⚠ มี {{ blockingDependents.length }} รายการที่อ้างอิงถึงรายการนี้อยู่ ({{ blockingDependents.map(r=>r.NAME).join(', ') }})</div>
        <div class="modal-actions"><button class="btn btn-ghost" @click="cancelDelete">ยกเลิก</button><button class="btn btn-danger" @click="confirmDelete">ยืนยันลบ</button></div>
      </div>
    </div>

    <div class="overlay" v-if="showAssignForm" @click.self="closeAssignForm">
      <div class="side-drawer">
        <div class="side-drawer-head"><h3>{{ isEditingAssign ? 'Program' : 'Program' }} · {{ assignEntity }} / {{ assignLeadType }}</h3><button class="close-x" @click="closeAssignForm">✕</button></div>
        <div class="side-drawer-body">
          <div class="field">
            <div class="field-inline">
              <div class="field">
                <label>โปรแกรม</label>
                <select v-model="assignFormModel.PROGRAM_CODE" :disabled="isEditingAssign">
                  <option value="" disabled>— เลือกโปรแกรม —</option>
                  <option v-for="p in assignableProgramOptions" :key="p.CODE" :value="p.CODE">{{ p.NAME }} ({{ p.CODE }})</option>
                </select>
              </div>
              
            </div>
          </div>
          <div class="field"><label>ORDER</label><input type="number" v-model="assignFormModel.ORDER" readonly></div>
          <div class="field"><div class="active-toggle-row"><div class="lab"><strong>Active</strong><span>โปรแกรมที่ปิดใช้งานจะไม่แสดงให้ลูกค้ากลุ่มนี้</span></div><label class="switch"><input type="checkbox" v-model="assignFormModel.STATUS" true-value="Y" false-value="N"><span class="slider"></span></label></div></div>
        </div>
        <div class="side-drawer-foot"><button class="btn btn-ghost" @click="closeAssignForm">ยกเลิก</button><button class="btn btn-primary" @click="saveAssign">บันทึกข้อมูล</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteAssign" @click.self="confirmDeleteAssign=null">
      <div class="modal-box">
        <h3>ลบโปรแกรมนี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ nameOf(programMaster, confirmDeleteAssign.PROGRAM_CODE) }}</strong> ออกจาก {{ assignEntity }} / {{ assignLeadType }}</p>
        <div class="modal-actions"><button class="btn btn-ghost" @click="confirmDeleteAssign=null">ยกเลิก</button><button class="btn btn-danger" @click="confirmDeleteAssignRow">ยืนยันลบ</button></div>
      </div>
    </div>

    <div class="overlay" v-if="showCfgForm" @click.self="closeCfgForm">
      <div class="side-drawer">
        <div class="side-drawer-head"><h3>{{ isEditingCfg ? 'แก้ไขพารามิเตอร์' : 'เพิ่มพารามิเตอร์' }} · {{ cfgProgram }} / {{ cfgEntity }}</h3><button class="close-x" @click="closeCfgForm">✕</button></div>
        <div class="side-drawer-body">
          <div class="field"><label>ชื่อพารามิเตอร์</label><input type="text" v-model="cfgFormModel.PARAMETER_NAME" placeholder="เช่น Topup Option, Flat rate OPTT1"></div>
          <div class="field"><label>ลำดับการแสดงผล (ORDER)</label><input type="number" v-model="cfgFormModel.ORDER"></div>
          <div class="field">
            <div class="field-inline" style="margin-bottom:10px;">
              <label style="margin-bottom:0;">Base Key ที่ใช้ (คลิกเพื่อเลือก/ยกเลิก — ลำดับคลิกมีผล)</label>
              <button class="btn-icon-sm" title="เพิ่ม Base Key ใหม่" @click="openQuickAdd('PARAMETER','พารามิเตอร์พื้นฐาน (Base Key)')">+</button>
            </div>
            <div class="keybuilder">
              <div class="key-option" v-for="p in paramMaster" :key="p.CODE" :class="{selected: cfgFormModel.KEY_BASE.includes(p.CODE)}" @click="toggleCfgKey(p.CODE)">
                {{ p.NAME }} <span class="n">{{ p.CODE }}</span>
              </div>
            </div>
            <div class="selected-keys-box">
              <span v-if="!cfgFormModel.KEY_BASE.length" class="placeholder">ยังไม่ได้เลือก Base Key</span>
              <span class="sel-chip" v-for="(k,i) in cfgFormModel.KEY_BASE" :key="k"><span class="idx">{{ i+1 }}</span>{{ nameOf(paramMaster,k) }}<button @click="removeCfgKeyAt(i)">✕</button></span>
            </div>
            <div class="preview-line" v-if="cfgFormModel.KEY_BASE.length">
              <div><b>key:</b> {{ cfgPreview.key }}</div>
              <div><b>key_base:</b> {{ cfgPreview.keyBase }}</div>
            </div>
          </div>
          <div class="field"><div class="active-toggle-row"><div class="lab"><strong>เปิดใช้งานพารามิเตอร์นี้</strong><span>ตัวที่ปิดใช้งานจะไม่ถูกใช้ในการคำนวณ</span></div><label class="switch"><input type="checkbox" v-model="cfgFormModel.ACTIVE" true-value="Y" false-value="N"><span class="slider"></span></label></div></div>
        </div>
        <div class="side-drawer-foot"><button class="btn btn-ghost" @click="closeCfgForm">ยกเลิก</button><button class="btn btn-primary" @click="saveCfg">บันทึกข้อมูล</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteCfg" @click.self="confirmDeleteCfg=null">
      <div class="modal-box">
        <h3>ลบพารามิเตอร์นี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ confirmDeleteCfg.PARAMETER_NAME }}</strong> ออกจาก {{ cfgProgram }} / {{ cfgEntity }}</p>
        <div class="modal-actions"><button class="btn btn-ghost" @click="confirmDeleteCfg=null">ยกเลิก</button><button class="btn btn-danger" @click="confirmDeleteCfgRow">ยืนยันลบ</button></div>
      </div>
    </div>

    <div class="toast" v-if="toast.show"><span class="tick">{{ toast.ok ? '✓' : '!' }}</span> {{ toast.msg }}</div>
  </div>
  `
}).mount('#app');
</script>
</body>
</html>
