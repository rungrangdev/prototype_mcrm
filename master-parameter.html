<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตู้ข้อมูลหลัก · Master Data Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.prod.min.js"></script>
<style>
  /* @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap'); */

@font-face {
    font-family: "Krungsri-med";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

  :root{
    --bg:#F1F3F6;
    --surface:#FFFFFF;
    --surface-alt:#F7F8FA;
    --primary:#6f5f5e;
    --primary-dark:#1B3050;
    --accent:#E6A23D;
    --accent-soft:#FBEEDA;
    --text:#1C2333;
    --text-secondary:#6B7280;
    --border:#E3E6EC;
    --success:#2F9E68;
    --success-soft:#E5F5EC;
    --danger:#D64545;
    --danger-soft:#FBEAEA;
    --violet:#6D5BD0;
    --violet-soft:#EDEAFB;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(20,30,50,.06);
    --shadow-md:0 8px 24px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box;
    font-family: 'Krungsri-med';    
}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);font-family:'Krungsri-med', sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .mono{font-family:'Krungsri-med', monospace;}
  #app{min-height:100vh;display:flex;flex-direction:column;background-color: #FFF;}

  .app-header{background:var(--primary);color:#fff;padding:16px 28px 0;box-shadow:var(--shadow-sm);}
  .app-header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;}
  .app-header .brand{display:flex;align-items:center;gap:12px;}
  .app-header .brand-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary-dark);font-size:15px;}
  .app-header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  .app-header p{margin:2px 0 0;font-size:12.5px;color:#C9D5E6;}
  .admin-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px;font-size:13px;}
  .admin-chip .dot{width:8px;height:8px;border-radius:50%;background:#6FE3A6;}

  .tabbar{display:flex;gap:4px;max-width:1360px;margin:0 auto;padding:0;}
  .tab-btn{background:transparent;border:none;color:#B8C6DC;font-family:'Krungsri-med';font-size:13.5px;font-weight:600;padding:12px 18px;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;transition:.12s;}
  .tab-btn .num{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.12);font-size:10.5px;display:flex;align-items:center;justify-content:center;}
  .tab-btn:hover{color:#fff;}
  .tab-btn.active{color:#fff;border-bottom-color:var(--accent);}
  .tab-btn.active .num{background:var(--accent);color:var(--primary-dark);}

  /* .layout{flex:1;display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px 28px 32px;max-width:1360px;width:100%;margin:0 auto;}
  .layout.single{grid-template-columns:1fr;} */
  /* @media (max-width:860px){.layout{grid-template-columns:1fr;}} */

  .cabinet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;height:fit-content;}
  .cabinet h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-secondary);margin:4px 8px 12px;font-weight:600;}
  .drawer{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:4px;font-family:'Krungsri-med';font-size:14px;color:var(--text);position:relative;transition:transform .12s ease, background .12s ease;}
  .drawer:hover{background:var(--surface-alt);}
  .drawer.active{background:var(--primary);color:#fff;transform:translateX(4px);box-shadow:var(--shadow-sm);}
  .drawer.active::before{content:'';position:absolute;left:-4px;top:8px;bottom:8px;width:4px;background:var(--accent);border-radius:2px;}
  .drawer-icon{width:26px;height:20px;flex:none;border:1.6px solid currentColor;border-radius:3px;position:relative;opacity:.85;}
  .drawer-icon::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:2px;background:currentColor;transform:translate(-50%,-50%);border-radius:2px;}
  .drawer-label{flex:1;min-width:0;}
  .drawer-name{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drawer-code{font-size:11px;opacity:.75;}
  .drawer-count{font-size:11.5px;background:rgba(0,0,0,.08);padding:2px 8px;border-radius:20px;font-weight:600;}
  .drawer.active .drawer-count{background:rgba(255,255,255,.18);}
  .drawer-inactive-tag{font-size:10px;background:var(--danger-soft);color:var(--danger);padding:1px 6px;border-radius:10px;margin-left:4px;}
  .add-drawer-btn{width:100%;margin-top:8px;padding:11px 12px;border-radius:8px;border:1.5px dashed #C7CEDA;background:transparent;color:var(--text-secondary);font-family:'Krungsri-med';font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;}
  .add-drawer-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--surface-alt);}

  /* .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:520px;} */
  .panel-head{padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .panel-title-row{display:flex;align-items:center;gap:10px;}
  .panel-head h2{margin:0;font-size:19px;font-weight:700;}
  .type-badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--accent-soft);color:#9A6316;padding:3px 9px;border-radius:6px;font-weight:600;}
  .type-badge.violet{background:var(--violet-soft);color:var(--accent);}
  .panel-head .desc{margin:4px 0 0;color:var(--text-secondary);font-size:13.5px;}

  .toolbar{padding:16px 24px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
  .search-box input{border:none;background:transparent;outline:none;font-family:'Krungsri-med';font-size:13.5px;width:100%;color:var(--text);}

  .filter-row{padding:16px 24px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .filter-field{display:flex;flex-direction:column;gap:6px;min-width:200px;}
  .filter-field label{font-size:11.5px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px;}
  .filter-field select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;background:var(--surface-alt);color:var(--text);}
  .filter-field input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;background:var(--surface-alt);color:var(--text);outline:none;}
  .filter-hint{font-size:12px;color:var(--text-secondary);padding:8px 24px 0;}
  .filter-hint a{color:var(--primary);cursor:pointer;font-weight:600;}

  .btn{font-family:'Krungsri-med';font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#B93636;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn-icon-sm{width:36px;height:36px;padding:0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
  .btn-icon-sm:hover{background:var(--surface-alt);color:var(--primary);}

  .table-wrap{padding:16px 24px 24px;flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-secondary);font-weight:600;font-size:11.5px;letter-spacing:.4px;padding:10px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
  td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--surface-alt);}
  .code-pill{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;background:#EEF1F6;padding:3px 9px;border-radius:6px;color:var(--primary-dark);}
  .order-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary);}
  .name-cell strong{display:block;}
  .name-cell span{color:var(--text-secondary);font-size:12.5px;}
  .depend-tag{font-size:11.5px;color:var(--text-secondary);background:var(--surface-alt);padding:2px 8px;border-radius:6px;}

  .switch{position:relative;display:inline-block;width:38px;height:22px;cursor:pointer;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#D8DCE4;border-radius:22px;transition:.15s;}
  .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:var(--shadow-sm);}
  .switch input:checked + .slider{background:var(--success);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:.12s;}
  .icon-btn:hover{background:var(--surface-alt);color:var(--text);}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#F3C6C6;}

  .empty-state{text-align:center;padding:64px 20px;color:var(--text-secondary);}
  .empty-state .glyph{width:56px;height:44px;margin:0 auto 16px;border:2px solid #C7CEDA;border-radius:6px;position:relative;}
  .empty-state .glyph::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:3px;background:#C7CEDA;transform:translate(-50%,-50%);border-radius:2px;}
  .empty-state h3{color:var(--text);margin:0 0 4px;font-size:15px;}

  .key-chip-row{display:flex;flex-wrap:wrap;gap:6px;max-width:340px;}
  .key-chip{display:flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;padding:3px 8px 3px 6px;border-radius:20px;}
  .key-chip .idx{background:var(--accent);color:#fff;width:15px;height:15px;border-radius:50%;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700;}

  .keybuilder{display:flex;flex-wrap:wrap;gap:8px;}
  .key-option{padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-alt);font-size:12.5px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px;}
  .key-option:hover{border-color:var(--accent);}
  .key-option.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .key-option .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.75;}
  .selected-keys-box{margin-top:12px;padding:12px;background:var(--surface-alt);border-radius:8px;min-height:44px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .selected-keys-box .placeholder{color:var(--text-secondary);font-size:12.5px;}
  .sel-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);padding:5px 6px 5px 10px;border-radius:20px;font-size:12.5px;}
  .sel-chip .idx{background:var(--accent);color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .sel-chip button{border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:13px;line-height:1;padding:2px;}
  .preview-line{margin-top:10px;font-size:12px;color:var(--text-secondary);background:var(--surface-alt);padding:8px 10px;border-radius:6px;}
  .preview-line b{color:var(--text);}

  /* ===== Set value (criteria ของแต่ละ parameter) ===== */
  .value-pill{display:inline-block;font-weight:700;background:var(--violet-soft);color:var(--violet);padding:4px 12px;border-radius:8px;font-size:13px;}
  .status-badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:2px 10px;border-radius:14px;font-weight:700;font-size:11.5px;}
  .status-badge.y{background:var(--success-soft);color:var(--success);}
  .status-badge.n{background:var(--danger-soft);color:var(--danger);}
  .cond-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .cond-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid #F0D9B4;color:#9A6316;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .cond-chip .k{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .cond-chip .v{background:#fff;border-radius:10px;padding:1px 7px;color:var(--text);}
  .cond-chip.na{background:var(--surface-alt);border-color:var(--border);color:var(--text-secondary);}
  .cond-chip.na .v{background:transparent;color:var(--text-secondary);}
  .crit-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--surface-alt);}
  .crit-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
  .crit-item-head .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .crit-item-actions{display:flex;gap:6px;}
  .crit-empty{text-align:center;color:var(--text-secondary);font-size:13px;padding:24px 0;}
  .cond-input-row{display:grid;grid-template-columns:150px 96px 1fr;gap:8px;align-items:start;margin-bottom:10px;}
  .cond-input-row .cond-label{padding-top:9px;}
  .cond-input-row .cond-label b{display:block;font-size:12px;}
  .cond-input-row .cond-label span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-secondary);}
  .cond-input-row .op-select{padding:9px 8px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface-alt);color:var(--text);outline:none;}
  .cond-input-row .op-select:focus{border-color:var(--primary);background:#fff;}
  .cond-input-row input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13px;background:var(--surface-alt);outline:none;color:var(--text);}
  .cond-input-row input:focus{border-color:var(--primary);background:#fff;}
  .cond-input-row input:disabled{background:#f5f5f5;color:var(--text-secondary);cursor:not-allowed;}
  .side-drawer.wide{width:560px;}

  /* ===== ตัวเลือกค่าของ base key (multi / single select) ===== */
  .kv-value{position:relative;min-width:0;}
  .kv-type{font-size:10px;font-weight:700;letter-spacing:.3px;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:middle;}
  .kv-type.num{background:#EAF0F6;color:#4A6C8F;}
  .kv-type.txt{background:var(--accent-soft);color:#9A6316;}
  .kv-single{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13px;background:var(--surface-alt);color:var(--text);outline:none;}
  .kv-single:focus{border-color:var(--primary);background:#fff;}
  .tag-field{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:38px;padding:6px 10px;
    border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);cursor:pointer;}
  .tag-field:hover{border-color:var(--primary);}
  .kv-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--border);
    border-radius:20px;padding:2px 6px 2px 10px;font-size:12px;color:var(--text);max-width:200px;}
  .kv-chip.off{background:var(--danger-soft);border-color:#F3C6C6;color:#9A3131;}
  .kv-chip button{border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:12px;line-height:1;padding:2px;}
  .kv-chip button:hover{color:var(--danger);}
  .tag-add{font-size:12px;color:var(--primary);border:1px dashed #C7CEDA;border-radius:20px;padding:2px 10px;}
  .kv-picker{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);
    border-radius:8px;box-shadow:var(--shadow-md);overflow:hidden;}
  .kv-search-wrap{padding:8px;border-bottom:1px solid var(--border);}
  .kv-search{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;
    background:var(--surface-alt);outline:none;color:var(--text);}
  .kv-search:focus{border-color:var(--primary);background:#fff;}
  .kv-picker-list{max-height:190px;overflow-y:auto;padding:4px 0;}
  .kv-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;}
  .kv-opt:hover{background:var(--surface-alt);}
  .kv-opt input{width:14px;height:14px;accent-color:var(--primary);flex:none;}
  .kv-opt.on{color:#9A6316;font-weight:600;}
  .kv-empty{padding:10px 12px;font-size:12px;color:var(--text-secondary);}
  .kv-picker-foot{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
    border-top:1px solid var(--border);background:var(--surface-alt);font-size:11.5px;color:var(--text-secondary);}
  .kv-picker-foot button{border:none;background:none;color:var(--primary);font-size:11.5px;font-weight:600;cursor:pointer;}
  .kv-hint{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .kv-warn{font-size:11px;color:#9A3131;margin-top:4px;}

  .overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;justify-content:flex-start;z-index:50;}
  .side-drawer{width:440px;max-width:92vw;background:var(--surface);box-shadow:var(--shadow-md);display:flex;flex-direction:column;animation:slideIn .18s ease;
    top:20px;
    margin-bottom:70px;
    left: 33%;
   position: relative;
}
  @keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .side-drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .side-drawer-head h3{margin:0;font-size:16px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--text-secondary);cursor:pointer;line-height:1;}
  .side-drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
  .field .hint{font-size:11.5px;color:var(--text-secondary);margin-top:5px;}
  .field-inline{display:flex;gap:8px;align-items:flex-end;}
  .field-inline .field{flex:1;margin-bottom:0;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;color:var(--text);background:var(--surface-alt);outline:none;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--primary);background:#fff;}
  .field textarea{resize:vertical;min-height:64px;}
  .active-toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);padding:12px 14px;border-radius:8px;}
  .active-toggle-row .lab strong{display:block;font-size:13.5px;}
  .active-toggle-row .lab span{font-size:12px;color:var(--text-secondary);}
  .meta-box{margin-top:6px;padding:12px 14px;background:var(--surface-alt);border-radius:8px;font-size:12px;color:var(--text-secondary);line-height:1.7;}
  .side-drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;align-items:center;justify-content:center;z-index:60;}
  .modal-box{background:#fff;border-radius:12px;padding:24px;width:400px;max-width:92vw;box-shadow:var(--shadow-md);animation:pop .15s ease;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-box h3{margin:0 0 8px;font-size:16px;}
  .modal-box p{margin:0 0 20px;color:var(--text-secondary);font-size:13.5px;line-height:1.6;}
  .modal-box .warn-box{background:var(--danger-soft);color:#9A3131;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

    // หาเมนูที่อยู่ข้าง ๆ ปุ่มที่คลิก
    const currentMenu = button.nextElementSibling;
    
    // ปิด Dropdown ตัวอื่น ๆ ที่อาจจะเปิดค้างอยู่บนหน้าจอ
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        if (menu !== currentMenu) {
        menu.classList.remove('show');
        }
    });

    // สลับการเปิด/ปิด (Toggle) เมนูปัจจุบัน
    currentMenu.classList.toggle('show');

    const kvOffList  = (k) => kvOpts(k).length ? kvArr(k).filter(v => !kvOpts(k).includes(v)) : [];

    function kvSet(k, arr){ critFormModel.KEY_VALUES[k].value = arr.join(','); }
    function kvToggle(k, v){
      const arr = kvArr(k);
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i,1); else arr.push(v);
      kvSet(k, arr);
    }
    function kvRemove(k, v){ kvSet(k, kvArr(k).filter(x => x !== v)); }
    function kvClear(k){ kvSet(k, []); }
    function onKvOpChange(k){
      const c = critFormModel.KEY_VALUES[k];
      closePicker();
      if (c.op === 'N/A'){ c.value = ''; return; }
      if (!kvIsMulti(c.op)) c.value = kvArr(k)[0] || '';   // จากหลายค่า -> เหลือค่าแรก
    }

    /* ---- picker (dropdown เลือกหลายค่า) ---- */
    const pickerKey = ref(null);
    const pickerSearch = ref('');
    function togglePicker(k){
      if (pickerKey.value === k){ closePicker(); return; }
      pickerKey.value = k; pickerSearch.value = '';
    }
    function closePicker(){ pickerKey.value = null; pickerSearch.value = ''; }
    const kvFiltered = (k) => {
      const t = pickerSearch.value.trim().toLowerCase();
      return t ? kvOpts(k).filter(o => o.toLowerCase().includes(t)) : kvOpts(k);
    };
    onMounted(() => document.addEventListener('click', closePicker));

    const criteriaRows = reactive([
      { PROGRAM_CODE:'TOPUP', ENTITY:'KA', PARAMETER_CODE:'TOPUP_OPTION', VALUE:'TP_Option 1', ORDER:'1', ACTIVE:'Y',
        KEY_VALUES:{
          b_score_m_customer:{ op:'IN', value:'1_VL,2_L,3_M,4_H,5_VH' },
          cash_offer:{ op:'>=', value:'50000' },
          iir:{ op:'N/A', value:'' },
          product_base:{ op:'N/A', value:'' } },
        CREATE_BY:'SYSTEM', CREATE_DATE:'01/10/2024 09:00', UPDATE_BY:'SYSTEM', UPDATE_DATE:'01/10/2024 09:00' },
      { PROGRAM_CODE:'TOPUP', ENTITY:'KA', PARAMETER_CODE:'TOPUP_OPTION', VALUE:'TP_Option 2', ORDER:'2', ACTIVE:'Y',
        KEY_VALUES:{
          b_score_m_customer:{ op:'IN', value:'1_VL,2_L' },
          cash_offer:{ op:'N/A', value:'' },
          iir:{ op:'N/A', value:'' },
          product_base:{ op:'IN', value:'New,Refin Topup' } },
        CREATE_BY:'SYSTEM', CREATE_DATE:'01/10/2024 09:00', UPDATE_BY:'SYSTEM', UPDATE_DATE:'01/10/2024 09:00' },
      { PROGRAM_CODE:'TOPUP', ENTITY:'KA', PARAMETER_CODE:'TOPUP_OPTION', VALUE:'TP_Option 3', ORDER:'3', ACTIVE:'Y',
        KEY_VALUES:{
          b_score_m_customer:{ op:'IN', value:'1_VL,2_L' },
          cash_offer:{ op:'>=', value:'50000' },
          iir:{ op:'>=', value:'2.40' },
          product_base:{ op:'=', value:'Used' } },
        CREATE_BY:'SYSTEM', CREATE_DATE:'01/10/2024 09:00', UPDATE_BY:'SYSTEM', UPDATE_DATE:'01/10/2024 09:00' },
      { PROGRAM_CODE:'TOPUP', ENTITY:'KA', PARAMETER_CODE:'MAX_LTV', VALUE:'LTV150', ORDER:'1', ACTIVE:'Y',
        KEY_VALUES:{
          b_score_m_customer:{ op:'IN', value:'1_VL,2_L' },
          product_base:{ op:'N/A', value:'' } },
        CREATE_BY:'SYSTEM', CREATE_DATE:'01/10/2024 09:00', UPDATE_BY:'SYSTEM', UPDATE_DATE:'01/10/2024 09:00' },
    ]);

    const valueCount = (row) => criteriaRows.filter(r => r.PROGRAM_CODE===cfgProgram.value && r.ENTITY===cfgEntity.value && r.PARAMETER_CODE===row.PARAMETER_CODE).length;

    const showCritPanel = ref(false);
    const critMode = ref('list');        // 'list' | 'form'
    const critParamRow = ref(null);      // แถวพารามิเตอร์ที่กำลัง Set value
    const critBaseKeys = computed(() => critParamRow.value ? critParamRow.value.KEY_BASE : []);
    const critList = computed(() => !critParamRow.value ? [] : criteriaRows
      .filter(r => r.PROGRAM_CODE===cfgProgram.value && r.ENTITY===cfgEntity.value && r.PARAMETER_CODE===critParamRow.value.PARAMETER_CODE)

    function openSetValue(row){ critParamRow.value = row; critMode.value = 'list'; showCritPanel.value = true; }
    function closeCritPanel(){ showCritPanel.value = false; closePicker(); }

    const isEditingCrit = ref(false);
    const editingCritRow = ref(null);
    const critFormModel = reactive({ VALUE:'', ORDER:'1', ACTIVE:'Y', KEY_VALUES:{} });

    function openAddCritForm(){
      isEditingCrit.value = false; editingCritRow.value = null;

      critBaseKeys.value.forEach(k => kv[k] = { op:'N/A', value:'' });
      Object.assign(critFormModel, { VALUE:'', ORDER:String(critList.value.length+1), ACTIVE:'Y', KEY_VALUES:kv });
      closePicker();
      critMode.value = 'form';
    }
    function openEditCritForm(row){
      isEditingCrit.value = true; editingCritRow.value = row;
      const kv = {};
      critBaseKeys.value.forEach(k => kv[k] = row.KEY_VALUES[k] ? { ...row.KEY_VALUES[k] } : { op:'N/A', value:'' });
      Object.assign(critFormModel, { VALUE:row.VALUE, ORDER:row.ORDER, ACTIVE:row.ACTIVE, KEY_VALUES:kv });
      closePicker();
      critMode.value = 'form';
    }
    function backToCritList(){ closePicker(); critMode.value = 'list'; }
    function saveCritValue(){
      const val = critFormModel.VALUE.trim();
      if (!val){ showToast('กรุณากรอก value', false); return; }
      const dup = criteriaRows.some(r => r !== editingCritRow.value &&
        r.PROGRAM_CODE===cfgProgram.value && r.ENTITY===cfgEntity.value &&
        r.PARAMETER_CODE===critParamRow.value.PARAMETER_CODE && r.VALUE===val);
      if (dup){ showToast('มี value นี้อยู่แล้วในพารามิเตอร์นี้', false); return; }
      /* ตรวจว่า op ที่ไม่ใช่ N/A ต้องมีค่า */
      const missing = critBaseKeys.value.filter(k => {
        const c = critFormModel.KEY_VALUES[k];
        return c.op !== 'N/A' && !String(c.value).trim();
      });
      if (missing.length){ showToast(`ยังไม่ได้ใส่ค่าให้ ${missing.map(k=>nameOf(paramMaster.value,k)).join(', ')}`, false); return; }

      if (isEditingCrit.value){
        Object.assign(editingCritRow.value, {
          VALUE:val, ORDER:critFormModel.ORDER, ACTIVE:critFormModel.ACTIVE,
          KEY_VALUES:JSON.parse(JSON.stringify(critFormModel.KEY_VALUES)),
          UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
        showToast(`บันทึก "${val}" เรียบร้อย`);
      } else {
        criteriaRows.push({
          PROGRAM_CODE:cfgProgram.value, ENTITY:cfgEntity.value, PARAMETER_CODE:critParamRow.value.PARAMETER_CODE,
          VALUE:val, ORDER:critFormModel.ORDER, ACTIVE:critFormModel.ACTIVE,
          KEY_VALUES:JSON.parse(JSON.stringify(critFormModel.KEY_VALUES)),
          CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
        showToast(`เพิ่ม "${val}" เรียบร้อย`);
      }
      closePicker();
      critMode.value = 'list';
    }
    const confirmDeleteCritVal = ref(null);
    function askDeleteCritVal(row){ confirmDeleteCritVal.value = row; }
    function confirmDeleteCritValRow(){
      criteriaRows.splice(criteriaRows.findIndex(r=>r===confirmDeleteCritVal.value),1);
      showToast('ลบ value แล้ว');
      confirmDeleteCritVal.value = null;
    }

    const toast = reactive({ show:false, msg:'', ok:true });
    let toastTimer = null;
    function showToast(msg, ok=true){ toast.msg=msg; toast.ok=ok; toast.show=true; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.show=false,2600); }

    function selectDrawer(code){ selectedTypeCode.value = code; search.value=''; }




    const activeTab = ref('cfg');

    return {

      search, records, dependOptions,
      showForm, isEditing, formModel, openAddRecord, openEditRecord, closeForm, saveRecord, toggleActive,

      KV_OPS, isNAkv, kvText, valueCount,
      kvOpts, kvOps, kvIsNum, kvIsMulti, kvArr, kvHas, kvOffList, kvToggle, kvRemove, kvClear, onKvOpChange,
      pickerKey, pickerSearch, togglePicker, closePicker, kvFiltered,
      showCritPanel, critMode, critParamRow, critBaseKeys, critList,
      openSetValue, closeCritPanel, isEditingCrit, critFormModel,
      openAddCritForm, openEditCritForm, backToCritList, saveCritValue,
      confirmDeleteCritVal, askDeleteCritVal, confirmDeleteCritValRow,
      toast
    };

      <div class="modal-box">
        <h3>เพิ่มหมวดหมู่ใหม่</h3>
        <p>หมวดหมู่ใหม่จะกลายเป็น "ลิ้นชัก" ใหม่ในตู้ข้อมูล และสามารถเพิ่มรายการย่อยภายในได้ทันที</p>
        <div class="field"><label>รหัสหมวดหมู่ (TYPE)</label><input type="text" v-model="typeForm.CODE" placeholder="เช่น LEAD_TYPE"></div>
        <div class="field"><label>ชื่อที่แสดงผล</label><input type="text" v-model="typeForm.NAME"></div>
        <div class="field"><label>คำอธิบาย</label><textarea v-model="typeForm.DESCRIPTION"></textarea></div>
        <div class="modal-actions"><button class="btn btn-ghost" @click="showAddType=false">ยกเลิก</button><button class="btn btn-primary" @click="saveType">สร้างหมวดหมู่</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="quickAdd.show" @click.self="quickAdd.show=false">
      <div class="modal-box">
        <h3>เพิ่ม{{ quickAdd.typeLabel }}ใหม่</h3>
        <p>รายการนี้จะถูกเพิ่มเข้าแคตตาล็อกกลาง และเลือกใช้ได้ทันทีจากทุกหน้าจอ</p>
        <div class="field"><label>รหัส</label><input type="text" v-model="quickAdd.CODE" placeholder="เช่น TOPUP"></div>
        <div class="field"><label>ชื่อที่แสดงผล</label><input type="text" v-model="quickAdd.NAME"></div>
        <div class="modal-actions"><button class="btn btn-ghost" @click="quickAdd.show=false">ยกเลิก</button><button class="btn btn-primary" @click="saveQuickAdd">เพิ่มรายการ</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteRow" @click.self="cancelDelete">
      <div class="modal-box">
        <h3>ลบรายการนี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ confirmDeleteRow.NAME }}</strong> ({{ confirmDeleteRow.CODE }}) การลบไม่สามารถย้อนกลับได้</p>
        <div class="warn-box" v-if="blockingDependents.length">⚠ มี {{ blockingDependents.length }} รายการที่อ้างอิงถึงรายการนี้อยู่ ({{ blockingDependents.map(r=>r.NAME).join(', ') }})</div>
        <div class="modal-actions"><button class="btn btn-ghost" @click="cancelDelete">ยกเลิก</button><button class="btn btn-danger" @click="confirmDelete">ยืนยันลบ</button></div>
      </div>
    </div>

    <div class="overlay" v-if="showAssignForm" @click.self="closeAssignForm">
      <div class="side-drawer">
        <div class="side-drawer-head"><h3>{{ isEditingAssign ? 'แก้ไขโปรแกรม' : 'เพิ่มโปรแกรม' }} · {{ assignEntity }} / {{ assignLeadType }}</h3><button class="close-x" @click="closeAssignForm">✕</button></div>
        <div class="side-drawer-body">
          <div class="field">
            <div class="field-inline">
              <div class="field">
                <label>โปรแกรม</label>
                <select v-model="assignFormModel.PROGRAM_CODE" :disabled="isEditingAssign">
                  <option value="" disabled>— เลือกโปรแกรม —</option>
                  <option v-for="p in assignableProgramOptions" :key="p.CODE" :value="p.CODE">{{ p.NAME }} ({{ p.CODE }})</option>
                </select>
              </div>
              <button class="btn-icon-sm" title="เพิ่มโปรแกรมใหม่ในแคตตาล็อก" @click="openQuickAdd('PROGRAM','โปรแกรม (Program)')">+</button>
            </div>
          </div>
          <div class="field"><label>ลำดับการแสดงผล (ORDER)</label><input type="number" v-model="assignFormModel.ORDER"></div>
          <div class="field"><div class="active-toggle-row"><div class="lab"><strong>เปิดใช้งานโปรแกรมนี้</strong><span>โปรแกรมที่ปิดใช้งานจะไม่แสดงให้ลูกค้ากลุ่มนี้</span></div><label class="switch"><input type="checkbox" v-model="assignFormModel.STATUS" true-value="Y" false-value="N"><span class="slider"></span></label></div></div>
        </div>
        <div class="side-drawer-foot"><button class="btn btn-ghost" @click="closeAssignForm">ยกเลิก</button><button class="btn btn-primary" @click="saveAssign">บันทึกข้อมูล</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteAssign" @click.self="confirmDeleteAssign=null">
      <div class="modal-box">
        <h3>ลบโปรแกรมนี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ nameOf(programMaster, confirmDeleteAssign.PROGRAM_CODE) }}</strong> ออกจาก {{ assignEntity }} / {{ assignLeadType }}</p>
        <div class="modal-actions"><button class="btn btn-ghost" @click="confirmDeleteAssign=null">ยกเลิก</button><button class="btn btn-danger" @click="confirmDeleteAssignRow">ยืนยันลบ</button></div>
      </div>
    </div>

    <div class="overlay" v-if="showCfgForm" @click.self="closeCfgForm">
      <div class="side-drawer">
        <div class="side-drawer-head"><h3>{{ isEditingCfg ? 'Parameter' : 'Parameter' }} · {{ cfgProgram }} / {{ cfgEntity }}</h3><button class="close-x" @click="closeCfgForm">✕</button></div>
        <div class="side-drawer-body">
          <div class="field"><label>ชื่อพารามิเตอร์</label><input type="text" v-model="cfgFormModel.PARAMETER_NAME" placeholder="เช่น Topup Option, Flat rate OPTT1"></div>
          <div class="field"><label>ลำดับการแสดงผล (ORDER)</label><input type="number" v-model="cfgFormModel.ORDER" readonly></div>
          <div class="field">
            <div class="field-inline" style="margin-bottom:10px;">
              <label style="margin-bottom:0;">Base Key ที่ใช้ (คลิกเพื่อเลือก/ยกเลิก — ลำดับคลิกมีผล)</label>
              <button class="btn-icon-sm" title="เพิ่ม Base Key ใหม่" @click="openQuickAdd('PARAMETER','พารามิเตอร์พื้นฐาน (Base Key)')">+</button>
            </div>
            <div class="keybuilder">
              <div class="key-option" v-for="p in paramMaster" :key="p.CODE" :class="{selected: cfgFormModel.KEY_BASE.includes(p.CODE)}" @click="toggleCfgKey(p.CODE)">
                {{ p.NAME }} <span class="n" style="display:none;">{{ p.CODE }}</span>
              </div>
            </div>
            <div class="selected-keys-box">
              <span v-if="!cfgFormModel.KEY_BASE.length" class="placeholder">ยังไม่ได้เลือก Base Key</span>
              <span class="sel-chip" v-for="(k,i) in cfgFormModel.KEY_BASE" :key="k"><span class="idx">{{ i+1 }}</span>{{ nameOf(paramMaster,k) }}<button @click="removeCfgKeyAt(i)">✕</button></span>
            </div>
            <div class="preview-line" v-if="cfgFormModel.KEY_BASE.length">
              <div><b>key:</b> {{ cfgPreview.key }}</div>
              <div><b>key_base:</b> {{ cfgPreview.keyBase }}</div>
            </div>
          </div>
          <div class="field"><div class="active-toggle-row"><div class="lab"><strong>เปิดใช้งานพารามิเตอร์นี้</strong><span>ตัวที่ปิดใช้งานจะไม่ถูกใช้ในการคำนวณ</span></div><label class="switch"><input type="checkbox" v-model="cfgFormModel.ACTIVE" true-value="Y" false-value="N"><span class="slider"></span></label></div></div>
        </div>
        <div class="side-drawer-foot"><button class="btn btn-ghost" @click="closeCfgForm">ยกเลิก</button><button class="btn btn-primary" @click="saveCfg">บันทึกข้อมูล</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteCfg" @click.self="confirmDeleteCfg=null">
      <div class="modal-box">
        <h3>ลบพารามิเตอร์นี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ confirmDeleteCfg.PARAMETER_NAME }}</strong> ออกจาก {{ cfgProgram }} / {{ cfgEntity }}</p>
        <div class="modal-actions"><button class="btn btn-ghost" @click="confirmDeleteCfg=null">ยกเลิก</button><button class="btn btn-danger" @click="confirmDeleteCfgRow">ยืนยันลบ</button></div>
      </div>
    </div>

    <!-- ============ Set value panel ============ -->
    <div class="overlay" v-if="showCritPanel" @click.self="closeCritPanel">
      <div class="side-drawer wide">
        <div class="side-drawer-head">
          <h3 v-if="critMode==='list'">Set value · {{ critParamRow?.PARAMETER_NAME }} ({{ cfgProgram }} / {{ cfgEntity }})</h3>
          <h3 v-else>{{ isEditingCrit ? 'แก้ไข value' : 'เพิ่ม value' }} · {{ critParamRow?.PARAMETER_NAME }}</h3>
          <button class="close-x" @click="closeCritPanel">✕</button>
        </div>

        <!-- โหมดรายการ -->
        <div class="side-drawer-body" v-if="critMode==='list'">
          <div class="field" style="margin-bottom:14px;">
            <label>Base Key ของพารามิเตอร์นี้</label>
            <div class="key-chip-row">
              <span class="key-chip" v-for="(k,i) in critBaseKeys" :key="k"><span class="idx">{{ i+1 }}</span>{{ nameOf(paramMaster,k) }}</span>
            </div>
          </div>

          <div v-if="critList.length">
            <div class="crit-item" v-for="r in critList" :key="r.VALUE">
              <div class="crit-item-head">
                <div class="left">
                  <span class="order-pill">{{ r.ORDER }}</span>
                  <span class="value-pill">{{ r.VALUE }}</span>
                  <span class="status-badge" :class="r.ACTIVE==='Y' ? 'y' : 'n'">{{ r.ACTIVE==='Y' ? 'Active' : 'Inactive' }}</span>
                </div>
                <div class="crit-item-actions">
                  <button class="icon-btn" title="แก้ไข" @click="openEditCritForm(r)">✎</button>
                  <button class="icon-btn danger" title="ลบ" @click="askDeleteCritVal(r)">🗑</button>
                </div>
              </div>
              <div class="cond-chip-row">
                <span class="cond-chip" v-for="k in critBaseKeys" :key="k" :class="{na: isNAkv(r.KEY_VALUES[k])}">
                  <span class="k">{{ nameOf(paramMaster,k) }}</span>
                  <span class="v">{{ isNAkv(r.KEY_VALUES[k]) ? 'N/A' : kvText(r.KEY_VALUES[k]) }}</span>
                </span>
              </div>
            </div>
          </div>
          <div v-else class="crit-empty">ยังไม่มี value ของพารามิเตอร์นี้ — กด "+ เพิ่ม value" เพื่อเริ่มต้น</div>
        </div>

        <!-- โหมดฟอร์ม -->
        <div class="side-drawer-body" v-else>
          <div class="field-inline" style="margin-bottom:18px;">
            <div class="field">
              <label>value</label>
              <input type="text" v-model="critFormModel.VALUE" placeholder="เช่น TP_Option 1, LTV150 หรือตัวเลข">
            </div>
            <div class="field" style="max-width:110px;">
              <label>ลำดับ</label>
              <input type="number" v-model="critFormModel.ORDER">
            </div>
          </div>

          <div class="field">
            <label>key_value ของแต่ละ base key <span style="font-weight:400;">(เลือก operator เป็น N/A หากไม่ใช้ · IN / NOT IN เลือกได้หลายค่า)</span></label>

            <div class="cond-input-row" v-for="k in critBaseKeys" :key="k">
              <div class="cond-label">
                <b>{{ nameOf(paramMaster,k) }}<span class="kv-type" :class="kvIsNum(k) ? 'num' : 'txt'">{{ kvIsNum(k) ? '123' : 'ABC' }}</span></b>
                <span>{{ k }}</span>
              </div>

              <select class="op-select" v-model="critFormModel.KEY_VALUES[k].op" @change="onKvOpChange(k)">
                <option v-for="o in kvOps(k)" :key="o" :value="o">{{ o }}</option>
              </select>

              <div class="kv-value">
                <!-- 1) ไม่ใช้เงื่อนไขนี้ -->
                <input v-if="critFormModel.KEY_VALUES[k].op==='N/A'" type="text" disabled placeholder="ไม่ใช้ base key นี้">

                <!-- 2) IN / NOT IN + มีชุดค่า -> เลือกได้หลายค่า -->
                <template v-else-if="kvIsMulti(critFormModel.KEY_VALUES[k].op) && kvOpts(k).length">
                  <div class="tag-field" @click.stop="togglePicker(k)">
                    <span class="kv-chip" v-for="v in kvArr(k)" :key="v"
                          :class="{off: !kvOpts(k).includes(v)}"
                          :title="kvOpts(k).includes(v) ? '' : 'ค่านี้ไม่อยู่ในรายการของ base key'">
                      {{ v }}<button type="button" @click.stop="kvRemove(k,v)">✕</button>
                    </span>
                    <span class="tag-add">+ เลือกค่า</span>
                  </div>

                  <div class="kv-picker" v-if="pickerKey===k" @click.stop>
                    <div class="kv-search-wrap">
                      <input class="kv-search" v-model="pickerSearch" :placeholder="'ค้นหาใน ' + kvOpts(k).length + ' ค่า...'">
                    </div>
                    <div class="kv-picker-list">
                      <label class="kv-opt" v-for="o in kvFiltered(k)" :key="o" :class="{on: kvHas(k,o)}">
                        <input type="checkbox" :checked="kvHas(k,o)" @change="kvToggle(k,o)">
                        <span>{{ o }}</span>
                      </label>
                      <div class="kv-empty" v-if="!kvFiltered(k).length">ไม่พบค่าที่ค้นหา</div>
                    </div>
                    <div class="kv-picker-foot">
                      <span>เลือกแล้ว {{ kvArr(k).length }} / {{ kvOpts(k).length }}</span>
                      <button type="button" @click.stop="kvClear(k)">ล้างทั้งหมด</button>
                    </div>
                  </div>
                  <div class="kv-warn" v-if="kvOffList(k).length">
                    ⚠ ค่าที่ไม่อยู่ในรายการ: {{ kvOffList(k).join(', ') }}
                  </div>
                </template>

                <!-- 3) operator ค่าเดียว + มีชุดค่า -> dropdown -->
                <select v-else-if="kvOpts(k).length" class="kv-single" v-model="critFormModel.KEY_VALUES[k].value">
                  <option value="" disabled>— เลือกค่า —</option>
                  <option v-for="o in kvOpts(k)" :key="o" :value="o">{{ o }}</option>
                  <option v-if="critFormModel.KEY_VALUES[k].value && !kvOpts(k).includes(critFormModel.KEY_VALUES[k].value)"
                          :value="critFormModel.KEY_VALUES[k].value">
                    {{ critFormModel.KEY_VALUES[k].value }} (นอกรายการ)
                  </option>
                </select>

                <!-- 4) ไม่มีชุดค่า -> พิมพ์เอง -->
                <template v-else>
                  <input :type="kvIsNum(k) && !kvIsMulti(critFormModel.KEY_VALUES[k].op) ? 'number' : 'text'"
                         v-model="critFormModel.KEY_VALUES[k].value"
                         :placeholder="kvIsMulti(critFormModel.KEY_VALUES[k].op) ? 'คั่นด้วย , เช่น 10,20,30' : (kvIsNum(k) ? 'เช่น 50000' : 'พิมพ์ค่า')">
                  <div class="kv-hint">base key นี้ยังไม่มีชุดค่าให้เลือก</div>
                </template>
              </div>
            </div>
          </div>

          <div class="field"><div class="active-toggle-row"><div class="lab"><strong>เปิดใช้งาน value นี้</strong><span>รายการที่ปิดใช้งานจะไม่ถูกใช้ในการคำนวณ</span></div><label class="switch"><input type="checkbox" v-model="critFormModel.ACTIVE" true-value="Y" false-value="N"><span class="slider"></span></label></div></div>
        </div>

        <div class="side-drawer-foot" v-if="critMode==='list'">
          <button class="btn btn-ghost" @click="closeCritPanel">ปิด</button>
          <button class="btn btn-primary" @click="openAddCritForm">+ เพิ่ม value</button>
        </div>
        <div class="side-drawer-foot" v-else>
          <button class="btn btn-ghost" @click="backToCritList">ยกเลิก</button>
          <button class="btn btn-primary" @click="saveCritValue">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteCritVal" @click.self="confirmDeleteCritVal=null">
      <div class="modal-box">
        <h3>ลบ value นี้ใช่หรือไม่?</h3>
        <p>คุณกำลังจะลบ <strong>{{ confirmDeleteCritVal.VALUE }}</strong> ออกจาก {{ critParamRow?.PARAMETER_NAME }} ({{ cfgProgram }} / {{ cfgEntity }})</p>
        <div class="modal-actions"><button class="btn btn-ghost" @click="confirmDeleteCritVal=null">ยกเลิก</button><button class="btn btn-danger" @click="confirmDeleteCritValRow">ยืนยันลบ</button></div>
      </div>
    </div>

    <div class="toast" v-if="toast.show"><span class="tick">{{ toast.ok ? '✓' : '!' }}</span> {{ toast.msg }}</div>
  </div>
  `
}).mount('#app');

</script>
</body>
</html>
