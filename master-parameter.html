<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parameter Master Setup</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.prod.min.js"></script>
<script src="store.js"></script>
<style>
  /* @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap'); */

@font-face {
    font-family: "Krungsri-med";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

  :root{
    --bg:#F1F3F6;
    --surface:#FFFFFF;
    --surface-alt:#F7F8FA;
    --primary:#6f5f5e;
    --primary-dark:#1B3050;
    --accent:#E6A23D;
    --accent-soft:#FBEEDA;
    --text:#1C2333;
    --text-secondary:#6B7280;
    --border:#E3E6EC;
    --success:#2F9E68;
    --success-soft:#E5F5EC;
    --danger:#D64545;
    --danger-soft:#FBEAEA;
    --violet:#6D5BD0;
    --violet-soft:#EDEAFB;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(20,30,50,.06);
    --shadow-md:0 8px 24px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box;
    font-family: 'Krungsri-med';
}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);font-family:'Krungsri-med', sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .mono{font-family:'Krungsri-med', monospace;}
  #app{min-height:100vh;display:flex;flex-direction:column;background-color: #FFF;}

  .app-header{background:var(--primary);color:#fff;padding:16px 28px 0;box-shadow:var(--shadow-sm);}
  .app-header-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;}
  .app-header .brand{display:flex;align-items:center;gap:12px;}
  .app-header .brand-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary-dark);font-size:15px;}
  .app-header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  .app-header p{margin:2px 0 0;font-size:12.5px;color:#C9D5E6;}
  .admin-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px;font-size:13px;}
  .admin-chip .dot{width:8px;height:8px;border-radius:50%;background:#6FE3A6;}

  .tabbar{display:flex;gap:4px;max-width:1360px;margin:0 auto;padding:0;}
  .tab-btn{background:transparent;border:none;color:#B8C6DC;font-family:'Krungsri-med';font-size:13.5px;font-weight:600;padding:12px 18px;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;transition:.12s;}
  .tab-btn .num{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.12);font-size:10.5px;display:flex;align-items:center;justify-content:center;}
  .tab-btn:hover{color:#fff;}
  .tab-btn.active{color:#fff;border-bottom-color:var(--accent);}
  .tab-btn.active .num{background:var(--accent);color:var(--primary-dark);}

  .cabinet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;height:fit-content;}
  .cabinet h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-secondary);margin:4px 8px 12px;font-weight:600;}
  .drawer{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:4px;font-family:'Krungsri-med';font-size:14px;color:var(--text);position:relative;transition:transform .12s ease, background .12s ease;}
  .drawer:hover{background:var(--surface-alt);}
  .drawer.active{background:var(--primary);color:#fff;transform:translateX(4px);box-shadow:var(--shadow-sm);}
  .drawer.active::before{content:'';position:absolute;left:-4px;top:8px;bottom:8px;width:4px;background:var(--accent);border-radius:2px;}
  .drawer-icon{width:26px;height:20px;flex:none;border:1.6px solid currentColor;border-radius:3px;position:relative;opacity:.85;}
  .drawer-icon::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:2px;background:currentColor;transform:translate(-50%,-50%);border-radius:2px;}
  .drawer-label{flex:1;min-width:0;}
  .drawer-name{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drawer-code{font-size:11px;opacity:.75;}
  .drawer-count{font-size:11.5px;background:rgba(0,0,0,.08);padding:2px 8px;border-radius:20px;font-weight:600;}
  .drawer.active .drawer-count{background:rgba(255,255,255,.18);}
  .drawer-inactive-tag{font-size:10px;background:var(--danger-soft);color:var(--danger);padding:1px 6px;border-radius:10px;margin-left:4px;}
  .add-drawer-btn{width:100%;margin-top:8px;padding:11px 12px;border-radius:8px;border:1.5px dashed #C7CEDA;background:transparent;color:var(--text-secondary);font-family:'Krungsri-med';font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;}
  .add-drawer-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--surface-alt);}

  .panel-head{padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .panel-title-row{display:flex;align-items:center;gap:10px;}
  .panel-head h2{margin:0;font-size:19px;font-weight:700;}
  .type-badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--accent-soft);color:#9A6316;padding:3px 9px;border-radius:6px;font-weight:600;}
  .type-badge.violet{background:var(--violet-soft);color:var(--accent);}
  .panel-head .desc{margin:4px 0 0;color:var(--text-secondary);font-size:13.5px;}

  .toolbar{padding:16px 24px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
  .search-box input{border:none;background:transparent;outline:none;font-family:'Krungsri-med';font-size:13.5px;width:100%;color:var(--text);}

  .filter-row{padding:16px 24px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .filter-field{display:flex;flex-direction:column;gap:6px;min-width:200px;}
  .filter-field label{font-size:11.5px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px;}
  .filter-field select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;background:var(--surface-alt);color:var(--text);}
  .filter-field input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;background:var(--surface-alt);color:var(--text);outline:none;}
  .filter-hint{font-size:12px;color:var(--text-secondary);padding:8px 24px 0;}
  .filter-hint a{color:var(--primary);cursor:pointer;font-weight:600;}

  .btn{font-family:'Krungsri-med';font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#B93636;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn-icon-sm{width:36px;height:36px;padding:0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
  .btn-icon-sm:hover{background:var(--surface-alt);color:var(--primary);}

  .table-wrap{padding:16px 24px 24px;flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-secondary);font-weight:600;font-size:11.5px;letter-spacing:.4px;padding:10px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
  td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--surface-alt);}
  .code-pill{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;background:#EEF1F6;padding:3px 9px;border-radius:6px;color:var(--primary-dark);}
  .status-text{font-size:13px;font-weight:600;}
  .status-text.is-active{color:var(--success);}
  .status-text.is-inactive{color:var(--text-secondary);}
  .order-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary);}
  .name-cell strong{display:block;}
  .name-cell span{color:var(--text-secondary);font-size:12.5px;}
  .depend-tag{font-size:11.5px;color:var(--text-secondary);background:var(--surface-alt);padding:2px 8px;border-radius:6px;}

  .switch{position:relative;display:inline-block;width:38px;height:22px;cursor:pointer;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#D8DCE4;border-radius:22px;transition:.15s;}
  .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:var(--shadow-sm);}
  .switch input:checked + .slider{background:var(--success);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:.12s;}
  .icon-btn:hover{background:var(--surface-alt);color:var(--text);}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#F3C6C6;}

  .empty-state{text-align:center;padding:64px 20px;color:var(--text-secondary);}
  .empty-state .glyph{width:56px;height:44px;margin:0 auto 16px;border:2px solid #C7CEDA;border-radius:6px;position:relative;}
  .empty-state .glyph::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:3px;background:#C7CEDA;transform:translate(-50%,-50%);border-radius:2px;}
  .empty-state h3{color:var(--text);margin:0 0 4px;font-size:15px;}

  .key-chip-row{display:flex;flex-wrap:wrap;gap:6px;max-width:340px;}
  .key-chip{display:flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;padding:3px 8px 3px 6px;border-radius:20px;}
  .key-chip .idx{background:var(--accent);color:#fff;width:15px;height:15px;border-radius:50%;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700;}

  .keybuilder{display:flex;flex-wrap:wrap;gap:8px;}
  .key-option{padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-alt);font-size:12.5px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:6px;}
  .key-option:hover{border-color:var(--accent);}
  .key-option.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .key-option .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.75;}
  .selected-keys-box{margin-top:12px;padding:12px;background:var(--surface-alt);border-radius:8px;min-height:44px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .selected-keys-box .placeholder{color:var(--text-secondary);font-size:12.5px;}
  .sel-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);padding:5px 6px 5px 10px;border-radius:20px;font-size:12.5px;}
  .sel-chip .idx{background:var(--accent);color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .sel-chip button{border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:13px;line-height:1;padding:2px;}
  .preview-line{margin-top:10px;font-size:12px;color:var(--text-secondary);background:var(--surface-alt);padding:8px 10px;border-radius:6px;}
  .preview-line b{color:var(--text);}

  /* ===== Set value (criteria ของแต่ละ parameter) ===== */
  .value-pill{display:inline-block;font-weight:700;background:var(--violet-soft);color:var(--violet);padding:4px 12px;border-radius:8px;font-size:13px;}
  .status-badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:2px 10px;border-radius:14px;font-weight:700;font-size:11.5px;}
  .status-badge.y{background:var(--success-soft);color:var(--success);}
  .status-badge.n{background:var(--danger-soft);color:var(--danger);}
  .cond-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .cond-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid #F0D9B4;color:#9A6316;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .cond-chip .k{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .cond-chip .v{background:#fff;border-radius:10px;padding:1px 7px;color:var(--text);}
  .cond-chip.na{background:var(--surface-alt);border-color:var(--border);color:var(--text-secondary);}
  .cond-chip.na .v{background:transparent;color:var(--text-secondary);}
  .crit-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--surface-alt);}
  .crit-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
  .crit-item-head .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .crit-item-actions{display:flex;gap:6px;}
  .crit-empty{text-align:center;color:var(--text-secondary);font-size:13px;padding:24px 0;}
  .cond-input-row{display:grid;grid-template-columns:150px 96px 1fr;gap:8px;align-items:start;margin-bottom:10px;}
  .cond-input-row .cond-label{padding-top:9px;}
  .cond-input-row .cond-label b{display:block;font-size:12px;}
  .cond-input-row .cond-label span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-secondary);}
  .cond-input-row .op-select{padding:9px 8px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface-alt);color:var(--text);outline:none;}
  .cond-input-row .op-select:focus{border-color:var(--primary);background:#fff;}
  .cond-input-row input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13px;background:var(--surface-alt);outline:none;color:var(--text);}
  .cond-input-row input:focus{border-color:var(--primary);background:#fff;}
  .cond-input-row input:disabled{background:#f5f5f5;color:var(--text-secondary);cursor:not-allowed;}
  .side-drawer.wide{width:560px;}

  /* ===== ตัวเลือกค่าของ base key (multi / single select) ===== */
  .kv-value{position:relative;min-width:0;}
  .kv-type{font-size:10px;font-weight:700;letter-spacing:.3px;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:middle;}
  .kv-type.num{background:#EAF0F6;color:#4A6C8F;}
  .kv-type.txt{background:var(--accent-soft);color:#9A6316;}
  .kv-single{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13px;background:var(--surface-alt);color:var(--text);outline:none;}
  .kv-single:focus{border-color:var(--primary);background:#fff;}
  .tag-field{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:38px;padding:6px 10px;
    border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);cursor:pointer;}
  .tag-field:hover{border-color:var(--primary);}
  .kv-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--border);
    border-radius:20px;padding:2px 6px 2px 10px;font-size:12px;color:var(--text);max-width:200px;}
  .kv-chip.off{background:var(--danger-soft);border-color:#F3C6C6;color:#9A3131;}
  .kv-chip button{border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:12px;line-height:1;padding:2px;}
  .kv-chip button:hover{color:var(--danger);}
  .tag-add{font-size:12px;color:var(--primary);border:1px dashed #C7CEDA;border-radius:20px;padding:2px 10px;}
  .kv-picker{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);
    border-radius:8px;box-shadow:var(--shadow-md);overflow:hidden;}
  .kv-search-wrap{padding:8px;border-bottom:1px solid var(--border);}
  .kv-search{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;
    background:var(--surface-alt);outline:none;color:var(--text);}
  .kv-search:focus{border-color:var(--primary);background:#fff;}
  .kv-picker-list{max-height:190px;overflow-y:auto;padding:4px 0;}
  .kv-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;}
  .kv-opt:hover{background:var(--surface-alt);}
  .kv-opt input{width:14px;height:14px;accent-color:var(--primary);flex:none;}
  .kv-opt.on{color:#9A6316;font-weight:600;}
  .kv-empty{padding:10px 12px;font-size:12px;color:var(--text-secondary);}
  .kv-picker-foot{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
    border-top:1px solid var(--border);background:var(--surface-alt);font-size:11.5px;color:var(--text-secondary);}
  .kv-picker-foot button{border:none;background:none;color:var(--primary);font-size:11.5px;font-weight:600;cursor:pointer;}
  .kv-hint{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .kv-warn{font-size:11px;color:#9A3131;margin-top:4px;}

  .overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;justify-content:flex-start;z-index:50;}
  .side-drawer{width:440px;max-width:92vw;background:var(--surface);box-shadow:var(--shadow-md);display:flex;flex-direction:column;animation:slideIn .18s ease;
    top:20px;
    margin-bottom:70px;
    left: 33%;
   position: relative;
}
  @keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .side-drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .side-drawer-head h3{margin:0;font-size:16px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--text-secondary);cursor:pointer;line-height:1;}
  .side-drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
  .field .hint{font-size:11.5px;color:var(--text-secondary);margin-top:5px;}
  .field-inline{display:flex;gap:8px;align-items:flex-end;}
  .field-inline .field{flex:1;margin-bottom:0;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Krungsri-med';font-size:13.5px;color:var(--text);background:var(--surface-alt);outline:none;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--primary);background:#fff;}
  .field textarea{resize:vertical;min-height:64px;}
  .active-toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);padding:12px 14px;border-radius:8px;}
  .active-toggle-row .lab strong{display:block;font-size:13.5px;}
  .active-toggle-row .lab span{font-size:12px;color:var(--text-secondary);}
  .meta-box{margin-top:6px;padding:12px 14px;background:var(--surface-alt);border-radius:8px;font-size:12px;color:var(--text-secondary);line-height:1.7;}
  .side-drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  /* ---- สถานะของ version ---- */
  .ver-status{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap;}
  .vs-open{background:#EEF1F6;color:#4B5563;}
  .vs-waiting-for-approve{background:var(--accent-soft);color:#9A6316;}
  .vs-approve{background:#E8F0FB;color:#2B5FA8;}
  .vs-reject{background:var(--danger-soft);color:var(--danger);}
  .vs-active{background:var(--success-soft);color:var(--success);}
  .vs-inactive{background:#F1F2F5;color:#9AA2B1;}
  .view-only-tag{font-size:11px;font-weight:600;color:var(--text-secondary);
    background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;padding:2px 8px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;align-items:center;justify-content:center;z-index:60;}
  .modal-box{background:#fff;border-radius:12px;padding:24px;width:400px;max-width:92vw;box-shadow:var(--shadow-md);animation:pop .15s ease;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-box h3{margin:0 0 8px;font-size:16px;}
  .modal-box p{margin:0 0 20px;color:var(--text-secondary);font-size:13.5px;line-height:1.6;}
  .modal-box .warn-box{background:var(--danger-soft);color:#9A3131;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  table.data-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin-bottom: 0;
  }
  table.data-table thead th{
    text-align: left;
    font-size: 14.5px;
    font-weight: 700;
    color: #FFF;
    letter-spacing: .02em;
    background: #6f5f5e;
    padding: 13px 18px;
    border : 1px solid #dedede;
  }
  table.data-table tbody td{
    padding: 14px 18px;
    border : 1px solid #dedede;
    vertical-align: middle;
    color: var(--text);
  }
  table.data-table tbody tr:hover{ background: var(--brown-lighter); }

  /* program name list ในตาราง version */

  /* กล่องครอบ */
.dropdown-container {
    position: relative;
    display: inline-block;
  }

  /* ปุ่ม 3 จุด */
  .btn-dots {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 0 8px;
    color: #6b7280; /* สีเทา */
    transition: color 0.2s;
  }

  .btn-dots:hover {
    color: #000000; /* เปลี่ยนสีเมื่อเอาเมาส์วาง */
  }

.dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    width: max-content;
    min-width: 100px;
    padding: 6px;
    background-color: #ffffff;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    z-index: 10;

    button {
        display: block;
        width: 100%;
        font-size: 16px;
        padding: 6px 12px;
        border: none;
        background-color: transparent;
        cursor: pointer;
        text-align: left;
        color: #1f2937;
        white-space: nowrap;
    }

    button:hover {
        background-color: #F3F4F6;
        border-radius: 4px;
        color: #000000;
    }
}

  .dropdown-menu.show {
    display: block;
  }

  .modal-overlay{
    z-index:99999;
  }

  input[readonly]{
    background-color: #f5f5f5;
    cursor: not-allowed;
  }

  /* ---- confirm dialog : หน้าตาเดียวกันทุกหน้า ---- */
  .confirm-box{background:#fff;border-radius:14px;padding:28px 32px;width:380px;max-width:92vw;
    box-shadow:0 12px 40px rgba(46,42,39,.22);text-align:center;}
  .confirm-box p{margin:0 0 22px;font-size:15px;line-height:1.6;color:#333;}
  .confirm-actions{display:flex;justify-content:center;gap:12px;}
  .confirm-actions button{min-width:120px;padding:11px 18px;border-radius:8px;font-family:inherit;
    font-size:15px;font-weight:600;cursor:pointer;border:2px solid #FFD400;transition:.12s;}
  .confirm-actions .cancel{background:#fff;color:#1A1A1A;}
  .confirm-actions .cancel:hover{background:#FFFBEA;}
  .confirm-actions .ok{background:#FFD400;color:#1A1A1A;}
  .confirm-actions .ok:hover{background:#EFC400;}

  /* ---- popup แจ้งผล : Done = สำเร็จ, Alert = ผิดเงื่อนไข ---- */
  .notice-box{background:#fff;border-radius:14px;padding:32px 36px;width:340px;max-width:92vw;
    box-shadow:0 12px 40px rgba(46,42,39,.22);text-align:center;}
  .notice-box .notice-icon{width:56px;height:56px;border-radius:50%;background:#22A55B;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;}
  .notice-box.alert .notice-icon{background:#D64545;}
  .notice-box h3{margin:0 0 8px;font-size:20px;font-weight:700;color:#1A1A1A;}
  .notice-box p{margin:0 0 24px;font-size:14px;color:#6B7280;line-height:1.6;word-break:break-word;}
  .notice-box button{width:100%;padding:13px 18px;border:none;border-radius:8px;background:#FFD400;
    color:#1A1A1A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
  .notice-box button:hover{background:#EFC400;}
  /* ---- ช่องที่กรอกไม่ครบ : กรอบแดง + ข้อความใต้ช่อง ---- */
  .has-error, .has-error input, .has-error select, .has-error textarea{border-color:#D64545 !important;}
  .field-error{margin-top:6px;font-size:12px;color:#D64545;line-height:1.5;}
  .req{color:#D64545;}
  /* ---- ปุ่มยืนยันใน modal / drawer : สีเหลืองชุดเดียวกับ popup ---- */
  .btn-yellow{background:#FFD400 !important;color:#1A1A1A !important;border:none;}
  .btn-yellow:hover{background:#EFC400 !important;}
  /* ---- หน้าที่ไม่มีข้อมูล ---- */
  .empty-state .empty-art{display:block;margin:0 auto 10px;}
  .empty-state h3{color:#4B4B4B;font-size:15px;font-weight:700;margin:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

/* Base-key dictionary (dataType / example values) is shared with Lead
   Eligible Config via store.js so a parameter added here is usable there too. */
const FIELD_DICT = MCRM.FIELD_META;
const TXT = MCRM.TXT, NUM = MCRM.NUM;

const OPS_ALL    = ['N/A','=','!=','>','>=','<','<=','IN','NOT IN'];
const OPS_NUMBER = ['N/A','=','!=','>','>=','<','<=','IN','NOT IN'];
const OPS_TEXT   = ['N/A','=','!=','IN','NOT IN'];

function toggleDropdown(event, button) {
    // กันไม่ให้ Event ลามไปยัง Element อื่น
    event.stopPropagation();

    // หาเมนูที่อยู่ข้าง ๆ ปุ่มที่คลิก
    const currentMenu = button.nextElementSibling;

    // ปิด Dropdown ตัวอื่น ๆ ที่อาจจะเปิดค้างอยู่บนหน้าจอ
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        if (menu !== currentMenu) {
        menu.classList.remove('show');
        }
    });

    // สลับการเปิด/ปิด (Toggle) เมนูปัจจุบัน
    currentMenu.classList.toggle('show');
    }

    // ถ้าคลิกพื้นที่อื่นภายนอกปุ่ม ให้ปิดเมนูทันที
    document.addEventListener('click', function() {
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        menu.classList.remove('show');
    });
    });

createApp({
  setup(){
    const now = MCRM.nowStr;

    /* ---- shared master data catalog (Entity / Lead Type / Program / Parameter) ----
       Lives in store.js so Master Data Manager, Program Setup and this page all
       read/write the exact same records. */
    const rows = MCRM.db.rows;

    const entityMaster = computed(() => rows.filter(r=>r.TYPE==='ENTITY' && r.ACTIVE==='Y').sort((a,b)=>Number(a.ORDER)-Number(b.ORDER)));
    const leadTypeMaster = computed(() => rows.filter(r=>r.TYPE==='LEAD_TYPE' && r.ACTIVE==='Y').sort((a,b)=>Number(a.ORDER)-Number(b.ORDER)));
    const programMaster = computed(() => rows.filter(r=>r.TYPE==='PROGRAM' && r.ACTIVE==='Y').sort((a,b)=>Number(a.ORDER)-Number(b.ORDER)));
    const paramMaster = computed(() => rows.filter(r=>r.TYPE==='PARAMETER' && r.ACTIVE==='Y').sort((a,b)=>Number(a.ORDER)-Number(b.ORDER)));
    const nameOf = MCRM.nameOf;

    /* Base Key ใหม่เพิ่มได้ที่หน้า Master Data Manager ที่เดียว หน้านี้เลือกได้
       เฉพาะที่มีอยู่แล้วในแคตตาล็อก */
    /* =========================================================
       Parameter Master Setup
       ========================================================= */
    const paramConfigs = MCRM.db.paramConfigs;

    const cfgProgram = ref('TOPUP');
    const cfgEntity = ref('KA');
    const cfgLeadType = ref('CRM_X_SELL_POOL');
    /* Program ID มาจาก Program Setup (1 รหัส ต่อ 1 Entity + Lead Type + Program) */
    const programIdOf = (code) => MCRM.programIdOf(cfgEntity.value, cfgLeadType.value, code);
    const cfgProgramId = computed(() => programIdOf(cfgProgram.value));
    const programLabel = (p) => { const id = programIdOf(p.CODE); return (id ? id + ' · ' : '') + p.NAME + ' (' + p.CODE + ')'; };

    /* Program ที่เลือกได้ = เฉพาะที่หน้า Program Setup กำหนดไว้ให้ Entity + Lead Type นี้
       เช่น CRM_X_SELL_POOL + KA ได้ PG0001-PG0005, CRM_X_SELL_POOL + AY ได้ PG0006-PG0009 */
    const assignments = MCRM.db.assignments;
    const cfgProgramOptions = computed(() =>
      assignments
        .filter(a => a.ENTITY === cfgEntity.value && a.LEAD_TYPE === cfgLeadType.value)
        .sort((a,b) => Number(a.ORDER) - Number(b.ORDER))
        .map(a => programMaster.value.find(p => p.CODE === a.PROGRAM_CODE)
                  || { CODE:a.PROGRAM_CODE, NAME:a.PROGRAM_CODE }));
    /* เปลี่ยน Entity / Lead Type แล้ว Program เดิมอาจไม่อยู่ในชุดนี้ — เลื่อนไปตัวแรกให้ */
    watch(cfgProgramOptions, (opts) => {
      if (opts.some(p => p.CODE === cfgProgram.value)) return;
      cfgProgram.value = opts.length ? opts[0].CODE : '';
    }, { immediate:true });
    const cfgRecords = computed(() => paramConfigs.filter(c=>c.VERSION_ID===cfgVersionId.value && c.PROGRAM_CODE===cfgProgram.value && c.ENTITY===cfgEntity.value).sort((a,b)=>Number(a.ORDER)-Number(b.ORDER)));

    /* =========================================================
       Version list — ตารางก่อนเข้าหน้า Parameter Master Setup
       ========================================================= */
    const cfgView = ref('list');   // 'list' = ตาราง version, 'setup' = หน้า Parameter Master Setup
    const cfgVersionId = ref('');
    const cfgVersions = MCRM.db.cfgVersions;
    /* ---- วงจรสถานะของ version ----
         Open                -> แก้ไขได้ (Edit / Delete / Submit)
         Waiting for approve -> ล็อกแล้ว (View / Approve)
         Active              -> ชุดที่ใช้งานจริง (View / Clone)
         Inactive            -> ของเก่าที่ถูกแทนที่ไปแล้ว (View)             */
    const cfgVersionStatus = ref('');      // สถานะของ version ที่เปิดอยู่
    /* แก้ไขได้เฉพาะตอน Open เท่านั้น — ใช้คุมปุ่ม Add/Edit/Delete/Set value ทั้งหน้า */
    const EDITABLE_STATUSES = ['Open','Reject'];
    const cfgEditable = computed(() => EDITABLE_STATUSES.includes(cfgVersionStatus.value) && pagePerm.value.edit);

    function openCfgSetup(v){
      cfgVersionId.value = v.VERSION_ID;
      cfgVersionStatus.value = verStatusText(v.STATUS);
      cfgLeadType.value = v.LEAD_TYPE || '';   // 1 version = 1 lead type จึงแก้ในหน้า setup ไม่ได้
      cfgView.value = 'setup';
    }
    function backToCfgList(){
      cfgView.value = 'list';
    }

    function nextVersionId(){
      const nums = cfgVersions.map(v => parseInt(String(v.VERSION_ID).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
      return 'V' + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4,'0');
    }

    /* Clone : ถามชื่อ version ก่อน แล้วค่อยคัดลอกทั้งชุด
       clone ซ้ำได้ไม่จำกัด — ตอน Set Active จะ Inactive ทุก version
       ของ lead type นั้นอยู่แล้ว จึงไม่มีทางมี Active พร้อมกันหลายแถว */
    /* ช่องที่ยังกรอกไม่ครบ : เก็บข้อความไว้แสดงใต้ช่องนั้น ๆ */
    const cloneErr  = reactive({ name:'' });
    const rejectErr = reactive({ reason:'' });
    const cfgErr    = reactive({ PARAMETER_NAME:'', KEY_BASE:'' });
    const critErr   = reactive({ VALUE:'', keys:{} });
    const cloneForm = reactive({ show:false, source:null, name:'' });
    function askCloneVersion(v){
      cloneErr.name = '';
      Object.assign(cloneForm, { show:true, source:v, name:'' });
    }
    function confirmCloneVersion(){
      if (!cloneForm.name.trim()){ cloneErr.name = 'Please enter Version Name.'; return; }
      cloneVersion(cloneForm.source, cloneForm.name.trim());
      cloneForm.show = false;
    }

    function cloneVersion(v, versionName){
      const id = nextVersionId();
      const deep = x => JSON.parse(JSON.stringify(x));
      paramConfigs
        .filter(c => c.VERSION_ID === v.VERSION_ID)
        .forEach(c => paramConfigs.push({ ...deep(c), VERSION_ID:id, CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() }));
      criteriaRows
        .filter(r => r.VERSION_ID === v.VERSION_ID)
        .forEach(r => criteriaRows.push({ ...deep(r), VERSION_ID:id, CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() }));
      cfgVersions.push({
        VERSION_ID:id, VERSION_NAME: versionName || id, LEAD_TYPE:v.LEAD_TYPE, STATUS:'Open',
        CLONED_FROM:v.VERSION_ID, REJECT_REASON:'',
        CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now(),
      });
      showDone('Version cloned successfully');
    }

    /* Submit : ล็อกไม่ให้แก้ไขต่อ รอการอนุมัติ */
    const confirmSubmitVersion = ref(null);
    function askSubmitVersion(v){ confirmSubmitVersion.value = v; }
    function confirmSubmitVersionYes(){
      const v = confirmSubmitVersion.value;
      v.STATUS = 'Waiting for approve';
      v.REJECT_REASON = '';
      v.UPDATE_BY = 'ADMIN'; v.UPDATE_DATE = now();
      confirmSubmitVersion.value = null;
      showDone('Version submitted successfully');
    }

    /* Approve : แค่ผ่านการอนุมัติ ยังไม่เริ่มใช้งานและยังไม่แตะ version ต้นทาง */
    const confirmApproveVersion = ref(null);
    function askApproveVersion(v){ confirmApproveVersion.value = v; }
    function confirmApproveVersionYes(){
      const v = confirmApproveVersion.value;
      v.STATUS = 'Approve';
      v.UPDATE_BY = 'ADMIN'; v.UPDATE_DATE = now();
      confirmApproveVersion.value = null;
      showDone('Version approved successfully');
    }

    /* Reject : ตีกลับให้แก้ พร้อมเหตุผล — กลับไปแก้แล้ว Submit ใหม่ได้ */
    const rejectForm = reactive({ show:false, target:null, reason:'' });
    function askRejectVersion(v){ rejectErr.reason = ''; Object.assign(rejectForm, { show:true, target:v, reason:'' }); }
    function confirmRejectVersion(){
      if (!rejectForm.reason.trim()){ rejectErr.reason = 'Please enter Reason.'; return; }
      const v = rejectForm.target;
      v.STATUS = 'Reject';
      v.REJECT_REASON = rejectForm.reason.trim();
      v.UPDATE_BY = 'ADMIN'; v.UPDATE_DATE = now();
      rejectForm.show = false;
      showDone('Version rejected successfully');
    }

    /* Active : เริ่มใช้งานจริง ตอนนี้ค่อยดัน version ต้นทางที่ถูก clone มาเป็น Inactive */
    const confirmActivateVersion = ref(null);
    function askActivateVersion(v){ confirmActivateVersion.value = v; }
    function confirmActivateVersionYes(){
      const v = confirmActivateVersion.value;
      /* ปิดทุก version ของ lead type เดียวกัน เหลือไว้เฉพาะตัวที่กำลังเปิดใช้งาน
         — จึงมี Active ได้แค่แถวเดียวต่อ lead type แม้จะ clone ไว้หลายชุด */
      const replaced = cfgVersions.filter(x => x !== v
        && (x.LEAD_TYPE||'') === (v.LEAD_TYPE||'')
        && verStatusText(x.STATUS) !== 'Inactive');
      replaced.forEach(x => { x.STATUS = 'Inactive'; x.UPDATE_BY = 'ADMIN'; x.UPDATE_DATE = now(); });
      v.STATUS = 'Active';
      v.UPDATE_BY = 'ADMIN'; v.UPDATE_DATE = now();
      confirmActivateVersion.value = null;
      showDone('Version activated successfully');
    }

    /* Delete : ลบได้เฉพาะ version ที่ยัง Open พร้อมข้อมูลที่ผูกอยู่ */
    const confirmDeleteVersion = ref(null);
    function askDeleteVersion(v){
      if (verStatusText(v.STATUS) !== 'Open') { showAlert('Only a version with status Open can be deleted'); return; }
      confirmDeleteVersion.value = v;
    }
    function confirmDeleteVersionYes(){
      const v = confirmDeleteVersion.value;
      for (let i = paramConfigs.length-1; i >= 0; i--) if (paramConfigs[i].VERSION_ID === v.VERSION_ID) paramConfigs.splice(i,1);
      for (let i = criteriaRows.length-1; i >= 0; i--) if (criteriaRows[i].VERSION_ID === v.VERSION_ID) criteriaRows.splice(i,1);
      cfgVersions.splice(cfgVersions.findIndex(x => x === v), 1);
      confirmDeleteVersion.value = null;
      showDone('Version deleted successfully');
    }


    /* ---- ตัวกรองเหนือตาราง version ---- */
    const VERSION_STATUSES = ['Open','Waiting for approve','Approve','Reject','Active','Inactive'];
    const verFilterLeadType = ref('');   // '' = ทั้งหมด
    const verFilterStatus = ref('');
    const filteredVersions = computed(() => cfgVersions.filter(v =>
      (!verFilterLeadType.value || (v.LEAD_TYPE || '') === verFilterLeadType.value) &&
      (!verFilterStatus.value   || verStatusText(v.STATUS) === verFilterStatus.value)
    ));
    /* ---- สิทธิ์ในหน้านี้ตาม role ที่เลือกอยู่ ----
       เปิดไฟล์นี้ตรง ๆ โดยไม่ผ่านหน้า index (ไม่มี role) ให้สิทธิ์เต็มไว้ก่อน
       เพื่อให้ยังทดสอบหน้าได้ */
    const FULL_ACCESS = { view:true, clone:true, edit:true, delete:true, submit:true, approve:true, activate:true };
    const pagePerm = computed(() => {
      const list = MCRM.db.roles || [];
      const role = list.find(r => r.ROLE_NAME === MCRM.db.currentRole);
      if (!role) return FULL_ACCESS;
      const p = (role.PERMISSIONS || {}).parameter_master_setup || {};
      return { view:!!p.view, clone:!!p.clone, edit:!!p.edit, delete:!!p.delete, submit:!!p.submit, approve:!!p.approve, activate:!!p.activate };
    });

    const verStatusText  = (st) => st || 'Active';
    const verStatusClass = (st) => 'vs-' + verStatusText(st).toLowerCase().replace(/ /g,'-');

    const showCfgForm = ref(false);
    const isEditingCfg = ref(false);
    /* พารามิเตอร์และ value ในเวอร์ชันถือว่าใช้งานอยู่เสมอ (ACTIVE:'Y') — ถ้าไม่ใช้แล้วให้ลบทิ้ง
       สถานะที่เหลือในหน้านี้มีแค่สถานะของ version เท่านั้น */
    const cfgFormModel = reactive({ PARAMETER_ID:'', PARAMETER_CODE:'', PARAMETER_NAME:'', ORDER:'1', ACTIVE:'Y', KEY_BASE:[] });
    function slugify(s){ return s.trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,''); }
    function openAddCfg(){
      isEditingCfg.value = false;
      Object.assign(cfgFormModel, { PARAMETER_ID:'', PARAMETER_CODE:'', PARAMETER_NAME:'', ORDER:String((cfgRecords.value.length+1)), ACTIVE:'Y', KEY_BASE:[] });
      cfgErr.PARAMETER_NAME = ''; cfgErr.KEY_BASE = '';
      showCfgForm.value = true;
    }
    function openEditCfg(row){ isEditingCfg.value = true; Object.assign(cfgFormModel, { ...row, ACTIVE:'Y', KEY_BASE:[...row.KEY_BASE] }); cfgErr.PARAMETER_NAME = ''; cfgErr.KEY_BASE = ''; showCfgForm.value = true; }
    function closeCfgForm(){ showCfgForm.value = false; }
    function toggleCfgKey(code){
      cfgErr.KEY_BASE = '';
      const i = cfgFormModel.KEY_BASE.indexOf(code);
      if (i>=0) cfgFormModel.KEY_BASE.splice(i,1); else cfgFormModel.KEY_BASE.push(code);
    }
    function removeCfgKeyAt(i){ cfgFormModel.KEY_BASE.splice(i,1); }
    function saveCfg(){
      cfgErr.PARAMETER_NAME = ''; cfgErr.KEY_BASE = '';
      if (!cfgFormModel.PARAMETER_NAME.trim()){ cfgErr.PARAMETER_NAME = 'Please enter Parameter Name.'; return; }
      if (!cfgFormModel.KEY_BASE.length){ cfgErr.KEY_BASE = 'At least one Base Key is required'; return; }
      const code = isEditingCfg.value ? cfgFormModel.PARAMETER_CODE : slugify(cfgFormModel.PARAMETER_NAME);
      if (isEditingCfg.value){
        const idx = paramConfigs.findIndex(c=>c.VERSION_ID===cfgVersionId.value && c.PROGRAM_CODE===cfgProgram.value && c.ENTITY===cfgEntity.value && c.PARAMETER_CODE===code);
        paramConfigs[idx] = { ...paramConfigs[idx], ...cfgFormModel, PARAMETER_CODE:code, UPDATE_BY:'ADMIN', UPDATE_DATE:now() };
      } else {
        if (paramConfigs.some(c=>c.VERSION_ID===cfgVersionId.value && c.PROGRAM_CODE===cfgProgram.value && c.ENTITY===cfgEntity.value && c.PARAMETER_CODE===code)){ showAlert('That parameter already exists'); return; }
        paramConfigs.push({ VERSION_ID:cfgVersionId.value, PROGRAM_CODE:cfgProgram.value, ENTITY:cfgEntity.value, ...cfgFormModel,
          PARAMETER_CODE:code, PARAMETER_ID:MCRM.parameterIdFor(cfgEntity.value, cfgProgram.value, code),
          CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
      }
      showDone(isEditingCfg.value ? 'Parameter updated successfully' : 'Parameter created successfully');
      showCfgForm.value = false;
    }
    const confirmDeleteCfg = ref(null);
    function askDeleteCfg(row){ confirmDeleteCfg.value = row; }
    function confirmDeleteCfgRow(){
      paramConfigs.splice(paramConfigs.findIndex(c=>c===confirmDeleteCfg.value),1);
      showDone('Parameter deleted successfully');
      confirmDeleteCfg.value = null;
    }
    const cfgPreview = computed(() => ({
      key: cfgFormModel.KEY_BASE.map(c=>nameOf(paramMaster.value,c)).join(' | '),
      keyBase: cfgFormModel.KEY_BASE.join('|')
    }));

    /* =========================================================
       Set value — กำหนด value + key_value (operator) ของแต่ละ base key
       ต่อพารามิเตอร์แต่ละตัว (อยู่ในหน้า Parameter Master Setup)
       ========================================================= */
    const KV_OPS = OPS_ALL;
    const isNAkv = c => !c || c.op==='N/A' || String(c.value ?? '').trim()==='';
    const kvText = c => {
      const vals = String(c.value).split(',').map(v=>v.trim()).filter(Boolean);
      return (c.op==='IN' || c.op==='NOT IN') ? `${c.op} (${vals.join(', ')})` : `${c.op} ${vals.join(', ')}`;
    };

    /* ---- helper ของชุดค่า base key ---- */
    const kvDict     = (k) => FIELD_DICT[k] || null;
    const kvOpts     = (k) => kvDict(k)?.values || [];
    const kvIsNum    = (k) => kvDict(k)?.dataType === NUM;
    const kvIsMulti  = (op) => op === 'IN' || op === 'NOT IN';
    const kvOps      = (k) => { const d = kvDict(k); if(!d) return OPS_ALL; return d.dataType===NUM ? OPS_NUMBER : OPS_TEXT; };
    const kvArr      = (k) => String(critFormModel.KEY_VALUES[k]?.value ?? '').split(',').map(v=>v.trim()).filter(Boolean);
    const kvHas      = (k,v) => kvArr(k).includes(v);
    const kvOffList  = (k) => kvOpts(k).length ? kvArr(k).filter(v => !kvOpts(k).includes(v)) : [];

    function kvSet(k, arr){ critFormModel.KEY_VALUES[k].value = arr.join(','); }
    function kvToggle(k, v){
      const arr = kvArr(k);
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i,1); else arr.push(v);
      kvSet(k, arr);
    }
    function kvRemove(k, v){ kvSet(k, kvArr(k).filter(x => x !== v)); }
    function kvClear(k){ kvSet(k, []); }
    function onKvOpChange(k){
      critErr.keys[k] = '';
      const c = critFormModel.KEY_VALUES[k];
      closePicker();
      if (c.op === 'N/A'){ c.value = ''; return; }
      if (!kvIsMulti(c.op)) c.value = kvArr(k)[0] || '';   // จากหลายค่า -> เหลือค่าแรก
    }

    /* ---- picker (dropdown เลือกหลายค่า) ---- */
    const pickerKey = ref(null);
    const pickerSearch = ref('');
    function togglePicker(k){
      if (pickerKey.value === k){ closePicker(); return; }
      pickerKey.value = k; pickerSearch.value = '';
    }
    function closePicker(){ pickerKey.value = null; pickerSearch.value = ''; }
    const kvFiltered = (k) => {
      const t = pickerSearch.value.trim().toLowerCase();
      return t ? kvOpts(k).filter(o => o.toLowerCase().includes(t)) : kvOpts(k);
    };
    onMounted(() => document.addEventListener('click', closePicker));

    const criteriaRows = MCRM.db.criteriaRows;


    const showCritPanel = ref(false);
    const critMode = ref('list');        // 'list' | 'form'
    const critParamRow = ref(null);      // แถวพารามิเตอร์ที่กำลัง Set value
    const critBaseKeys = computed(() => critParamRow.value ? critParamRow.value.KEY_BASE : []);
    const critList = computed(() => !critParamRow.value ? [] : criteriaRows
      .filter(r => r.VERSION_ID===cfgVersionId.value && r.PROGRAM_CODE===cfgProgram.value && r.ENTITY===cfgEntity.value && r.PARAMETER_CODE===critParamRow.value.PARAMETER_CODE)
      .sort((a,b)=>Number(a.ORDER)-Number(b.ORDER)));

    function openSetValue(row){ critParamRow.value = row; critMode.value = 'list'; showCritPanel.value = true; }
    function closeCritPanel(){ showCritPanel.value = false; closePicker(); }

    const isEditingCrit = ref(false);
    const editingCritRow = ref(null);
    const critFormModel = reactive({ VALUE:'', ORDER:'1', ACTIVE:'Y', KEY_VALUES:{} });

    function openAddCritForm(){
      isEditingCrit.value = false; editingCritRow.value = null;
      const kv = {};
      critBaseKeys.value.forEach(k => kv[k] = { op:'N/A', value:'' });
      Object.assign(critFormModel, { VALUE:'', ORDER:String(critList.value.length+1), ACTIVE:'Y', KEY_VALUES:kv });
      critErr.VALUE = ''; critErr.keys = {};
      closePicker();
      critMode.value = 'form';
    }
    function openEditCritForm(row){
      isEditingCrit.value = true; editingCritRow.value = row;
      const kv = {};
      critBaseKeys.value.forEach(k => kv[k] = row.KEY_VALUES[k] ? { ...row.KEY_VALUES[k] } : { op:'N/A', value:'' });
      Object.assign(critFormModel, { VALUE:row.VALUE, ORDER:row.ORDER, ACTIVE:'Y', KEY_VALUES:kv });
      critErr.VALUE = ''; critErr.keys = {};
      closePicker();
      critMode.value = 'form';
    }
    function backToCritList(){ closePicker(); critMode.value = 'list'; }
    function saveCritValue(){
      const val = critFormModel.VALUE.trim();
      critErr.VALUE = ''; critErr.keys = {};
      if (!val){ critErr.VALUE = 'Please enter Value.'; return; }
      const dup = criteriaRows.some(r => r !== editingCritRow.value && r.VERSION_ID===cfgVersionId.value &&
        r.PROGRAM_CODE===cfgProgram.value && r.ENTITY===cfgEntity.value &&
        r.PARAMETER_CODE===critParamRow.value.PARAMETER_CODE && r.VALUE===val);
      if (dup){ showAlert('That value already exists for this parameter'); return; }
      /* ตรวจว่า op ที่ไม่ใช่ N/A ต้องมีค่า */
      const missing = critBaseKeys.value.filter(k => {
        const c = critFormModel.KEY_VALUES[k];
        return c.op !== 'N/A' && !String(c.value).trim();
      });
      if (missing.length){ missing.forEach(k => critErr.keys[k] = `Please enter ${nameOf(paramMaster.value, k)}.`); return; }

      if (isEditingCrit.value){
        Object.assign(editingCritRow.value, {
          VALUE:val, ORDER:critFormModel.ORDER, ACTIVE:'Y',
          KEY_VALUES:JSON.parse(JSON.stringify(critFormModel.KEY_VALUES)),
          UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
        showDone('Value updated successfully');
      } else {
        criteriaRows.push({
          VERSION_ID: cfgVersionId.value,
          PROGRAM_CODE:cfgProgram.value, ENTITY:cfgEntity.value, PARAMETER_CODE:critParamRow.value.PARAMETER_CODE,
          VALUE:val, ORDER:critFormModel.ORDER, ACTIVE:'Y',
          KEY_VALUES:JSON.parse(JSON.stringify(critFormModel.KEY_VALUES)),
          CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
        showDone('Value created successfully');
      }
      closePicker();
      critMode.value = 'list';
    }
    const confirmDeleteCritVal = ref(null);
    function askDeleteCritVal(row){ confirmDeleteCritVal.value = row; }
    function confirmDeleteCritValRow(){
      criteriaRows.splice(criteriaRows.findIndex(r=>r===confirmDeleteCritVal.value),1);
      showDone('Value deleted successfully');
      confirmDeleteCritVal.value = null;
    }

    /* popup แจ้งผล : showDone = ทำรายการสำเร็จ, showAlert = ผิดเงื่อนไข
       ส่วนช่องที่กรอกไม่ครบจะขึ้นกรอบแดงใต้ช่องแทน ไม่ใช้ popup */
    const notice = reactive({ show:false, kind:'done', title:'Done', msg:'' });
    function showDone(msg){ Object.assign(notice, { show:true, kind:'done',  title:'Done',  msg }); }
    function showAlert(msg){ Object.assign(notice, { show:true, kind:'alert', title:'Alert', msg }); }

    return {
      entityMaster, leadTypeMaster, programMaster, paramMaster, nameOf,
      cfgProgram, cfgEntity, cfgLeadType, cfgProgramId, cfgProgramOptions, programLabel, cfgRecords, showCfgForm, isEditingCfg, cfgFormModel,
      openAddCfg, openEditCfg, closeCfgForm, toggleCfgKey, removeCfgKeyAt, saveCfg,
      confirmDeleteCfg, askDeleteCfg, confirmDeleteCfgRow, cfgPreview,
      cfgView, cfgVersionId, cfgVersions, openCfgSetup, backToCfgList,
      cfgVersionStatus, cfgEditable, pagePerm, verStatusText, verStatusClass,
      cloneForm, cloneErr, rejectErr, cfgErr, critErr, askCloneVersion, confirmCloneVersion,
      rejectForm, askRejectVersion, confirmRejectVersion,
      VERSION_STATUSES, verFilterLeadType, verFilterStatus, filteredVersions,
      confirmSubmitVersion, askSubmitVersion, confirmSubmitVersionYes,
      confirmApproveVersion, askApproveVersion, confirmApproveVersionYes,
      confirmActivateVersion, askActivateVersion, confirmActivateVersionYes,
      confirmDeleteVersion, askDeleteVersion, confirmDeleteVersionYes,
      KV_OPS, isNAkv, kvText,
      kvOpts, kvOps, kvIsNum, kvIsMulti, kvArr, kvHas, kvOffList, kvToggle, kvRemove, kvClear, onKvOpChange,
      pickerKey, pickerSearch, togglePicker, closePicker, kvFiltered,
      showCritPanel, critMode, critParamRow, critBaseKeys, critList,
      openSetValue, closeCritPanel, isEditingCrit, critFormModel,
      openAddCritForm, openEditCritForm, backToCritList, saveCritValue,
      confirmDeleteCritVal, askDeleteCritVal, confirmDeleteCritValRow,
      notice, showDone, showAlert,
    };
  },

    <div class="overlay" v-if="showCfgForm" @click.self="closeCfgForm">
      <div class="side-drawer">
        <div class="side-drawer-head"><h3>{{ isEditingCfg ? 'Parameter' : 'Parameter' }} · {{ cfgProgram }} / {{ cfgEntity }}</h3><button class="close-x" @click="closeCfgForm">✕</button></div>
        <div class="side-drawer-body">
          <div class="field"><label>Parameter ID</label><input type="text" :value="cfgFormModel.PARAMETER_ID" placeholder="Auto generates by system." readonly></div>
          <div class="field"><label>Parameter Name <span class="req">*</span></label>
            <input type="text" v-model="cfgFormModel.PARAMETER_NAME" placeholder="e.g. Topup Option, Flat rate OPTT1"
                   :class="{'has-error': cfgErr.PARAMETER_NAME}" @input="cfgErr.PARAMETER_NAME=''">
            <div class="field-error" v-if="cfgErr.PARAMETER_NAME">{{ cfgErr.PARAMETER_NAME }}</div>
          </div>
          <div class="field"><label>Order</label><input type="number" v-model="cfgFormModel.ORDER" readonly></div>
          <div class="field">
            <label>Base Key <span class="req">*</span></label>
            <div class="keybuilder" :class="{'has-error': cfgErr.KEY_BASE}">
              <div class="key-option" v-for="p in paramMaster" :key="p.CODE" :class="{selected: cfgFormModel.KEY_BASE.includes(p.CODE)}" @click="toggleCfgKey(p.CODE)">
                {{ p.NAME }} <span class="n" style="display:none;">{{ p.CODE }}</span>
              </div>
            </div>
            <div class="field-error" v-if="cfgErr.KEY_BASE">{{ cfgErr.KEY_BASE }}</div>
            <div class="selected-keys-box">
              <span v-if="!cfgFormModel.KEY_BASE.length" class="placeholder">No base key selected</span>
              <span class="sel-chip" v-for="(k,i) in cfgFormModel.KEY_BASE" :key="k"><span class="idx">{{ i+1 }}</span>{{ nameOf(paramMaster,k) }}<button @click="removeCfgKeyAt(i)">✕</button></span>
            </div>
            <div class="preview-line" v-if="cfgFormModel.KEY_BASE.length">
              <div><b>key:</b> {{ cfgPreview.key }}</div>
              <div><b>key_base:</b> {{ cfgPreview.keyBase }}</div>
            </div>
          </div>
        </div>
        <div class="side-drawer-foot"><button class="btn btn-ghost" @click="closeCfgForm">Cancel</button><button class="btn btn-yellow" @click="saveCfg">Save</button></div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteCfg" @click.self="confirmDeleteCfg=null">
      <div class="confirm-box">
        <p>Are you sure you want to delete this parameter?</p>
        <div class="confirm-actions"><button class="cancel" @click="confirmDeleteCfg=null">Cancel</button><button class="ok" @click="confirmDeleteCfgRow">Confirm</button></div>
      </div>
    </div>

    <!-- ============ Set value panel ============ -->
    <div class="overlay" v-if="showCritPanel" @click.self="closeCritPanel">
      <div class="side-drawer wide">
        <div class="side-drawer-head">
          <h3 v-if="critMode==='list'">Set value · {{ critParamRow?.PARAMETER_NAME }} ({{ cfgProgram }} / {{ cfgEntity }})</h3>
          <h3 v-else>{{ isEditingCrit ? 'Edit value' : 'Add value' }} · {{ critParamRow?.PARAMETER_NAME }}</h3>
          <button class="close-x" @click="closeCritPanel">✕</button>
        </div>

        <!-- โหมดรายการ -->
        <div class="side-drawer-body" v-if="critMode==='list'">
          <div class="field" style="margin-bottom:14px;">
            <label>Base Key</label>
            <div class="key-chip-row">
              <span class="key-chip" v-for="(k,i) in critBaseKeys" :key="k"><span class="idx">{{ i+1 }}</span>{{ nameOf(paramMaster,k) }}</span>
            </div>
          </div>

          <div v-if="critList.length">
            <div class="crit-item" v-for="r in critList" :key="r.VALUE">
              <div class="crit-item-head">
                <div class="left">
                  <span class="order-pill">{{ r.ORDER }}</span>
                  <span class="value-pill">{{ r.VALUE }}</span>
                </div>
                <div class="crit-item-actions" v-if="cfgEditable">
                  <button class="icon-btn" title="Edit" @click="openEditCritForm(r)">✎</button>
                  <button class="icon-btn danger" title="Delete" @click="askDeleteCritVal(r)">🗑</button>
                </div>
              </div>
              <div class="cond-chip-row">
                <span class="cond-chip" v-for="k in critBaseKeys" :key="k" :class="{na: isNAkv(r.KEY_VALUES[k])}">
                  <span class="k">{{ nameOf(paramMaster,k) }}</span>
                  <span class="v">{{ isNAkv(r.KEY_VALUES[k]) ? 'N/A' : kvText(r.KEY_VALUES[k]) }}</span>
                </span>
              </div>
            </div>
          </div>
          <div v-else class="empty-state" style="padding:28px 20px">
            <svg class="empty-art" viewBox="0 0 160 150" width="150" height="140" aria-hidden="true">
              <rect x="38" y="22" width="78" height="86" rx="8" fill="#FFF3C4"/>
              <rect x="50" y="36" width="54" height="7" rx="3.5" fill="#FFD95C"/>
              <rect x="50" y="50" width="42" height="7" rx="3.5" fill="#FFE68A"/>
              <rect x="50" y="64" width="50" height="7" rx="3.5" fill="#FFE68A"/>
              <rect x="18" y="52" width="40" height="56" rx="6" fill="#fff" stroke="#FFE08A" stroke-width="2"/>
              <rect x="26" y="64" width="16" height="6" rx="3" fill="#FFD95C"/>
              <rect x="26" y="76" width="24" height="5" rx="2.5" fill="#FFECA8"/>
              <rect x="26" y="86" width="20" height="5" rx="2.5" fill="#FFECA8"/>
              <rect x="96" y="14" width="36" height="19" rx="9.5" fill="#FFF3C4"/>
              <circle cx="107" cy="23.5" r="2.4" fill="#FFC93C"/><circle cx="114" cy="23.5" r="2.4" fill="#FFC93C"/><circle cx="121" cy="23.5" r="2.4" fill="#FFC93C"/>
              <circle cx="92" cy="82" r="26" fill="#FFFBEA" stroke="#FFC93C" stroke-width="6"/>
              <line x1="111" y1="101" x2="126" y2="118" stroke="#FFC93C" stroke-width="9" stroke-linecap="round"/>
              <line x1="83" y1="73" x2="101" y2="91" stroke="#F0474B" stroke-width="7" stroke-linecap="round"/>
              <line x1="101" y1="73" x2="83" y2="91" stroke="#F0474B" stroke-width="7" stroke-linecap="round"/>
              <circle cx="30" cy="40" r="2" fill="#FFE08A"/>
              <circle cx="128" cy="62" r="2.5" fill="#FFE08A"/>
              <circle cx="70" cy="120" r="2" fill="#FFE08A"/>
            </svg>
            <h3>Data not found</h3>
          </div>
        </div>

        <!-- โหมดฟอร์ม -->
        <div class="side-drawer-body" v-else>
          <div class="field-inline" style="margin-bottom:18px;">
            <div class="field">
              <label>value <span class="req">*</span></label>
              <input type="text" v-model="critFormModel.VALUE" placeholder="e.g. TP_Option 1, LTV150"
                     :class="{'has-error': critErr.VALUE}" @input="critErr.VALUE=''">
              <div class="field-error" v-if="critErr.VALUE">{{ critErr.VALUE }}</div>
            </div>
            <div class="field" style="max-width:110px;">
              <label>Order</label>
              <input type="number" v-model="critFormModel.ORDER">
            </div>
          </div>

          <div class="field">
            <label>key_value</label>

            <div class="cond-input-row" v-for="k in critBaseKeys" :key="k">
              <div class="cond-label">
                <b>{{ nameOf(paramMaster,k) }}<span class="kv-type" :class="kvIsNum(k) ? 'num' : 'txt'">{{ kvIsNum(k) ? '123' : 'ABC' }}</span></b>
                <span>{{ k }}</span>
              </div>

              <select class="op-select" v-model="critFormModel.KEY_VALUES[k].op" @change="onKvOpChange(k)">
                <option v-for="o in kvOps(k)" :key="o" :value="o">{{ o }}</option>
              </select>

              <div class="kv-value" :class="{'has-error': critErr.keys[k]}">
                <!-- 1) ไม่ใช้เงื่อนไขนี้ -->
                <input v-if="critFormModel.KEY_VALUES[k].op==='N/A'" type="text" disabled placeholder="Not used">

                <!-- 2) IN / NOT IN + มีชุดค่า -> เลือกได้หลายค่า -->
                <template v-else-if="kvIsMulti(critFormModel.KEY_VALUES[k].op) && kvOpts(k).length">
                  <div class="tag-field" @click.stop="togglePicker(k)">
                    <span class="kv-chip" v-for="v in kvArr(k)" :key="v"
                          :class="{off: !kvOpts(k).includes(v)}"
                          :title="kvOpts(k).includes(v) ? '' : 'Value is not in the base key list'">
                      {{ v }}<button type="button" @click.stop="kvRemove(k,v)">✕</button>
                    </span>
                    <span class="tag-add">+ Select</span>
                  </div>

                  <div class="kv-picker" v-if="pickerKey===k" @click.stop>
                    <div class="kv-search-wrap">
                      <input class="kv-search" v-model="pickerSearch" :placeholder="'Search ' + kvOpts(k).length + ' values...'">
                    </div>
                    <div class="kv-picker-list">
                      <label class="kv-opt" v-for="o in kvFiltered(k)" :key="o" :class="{on: kvHas(k,o)}">
                        <input type="checkbox" :checked="kvHas(k,o)" @change="kvToggle(k,o)">
                        <span>{{ o }}</span>
                      </label>
                      <div class="kv-empty" v-if="!kvFiltered(k).length">No match</div>
                    </div>
                    <div class="kv-picker-foot">
                      <span>{{ kvArr(k).length }} / {{ kvOpts(k).length }} selected</span>
                      <button type="button" @click.stop="kvClear(k)">Clear all</button>
                    </div>
                  </div>
                  <div class="kv-warn" v-if="kvOffList(k).length">
                    ⚠ Not in list: {{ kvOffList(k).join(', ') }}
                  </div>
                </template>

                <!-- 3) operator ค่าเดียว + มีชุดค่า -> dropdown -->
                <select v-else-if="kvOpts(k).length" class="kv-single" v-model="critFormModel.KEY_VALUES[k].value">
                  <option value="" disabled>— Select value —</option>
                  <option v-for="o in kvOpts(k)" :key="o" :value="o">{{ o }}</option>
                  <option v-if="critFormModel.KEY_VALUES[k].value && !kvOpts(k).includes(critFormModel.KEY_VALUES[k].value)"
                          :value="critFormModel.KEY_VALUES[k].value">
                    {{ critFormModel.KEY_VALUES[k].value }} (not in list)
                  </option>
                </select>

                <!-- 4) ไม่มีชุดค่า -> พิมพ์เอง -->
                <template v-else>
                  <input :type="kvIsNum(k) && !kvIsMulti(critFormModel.KEY_VALUES[k].op) ? 'number' : 'text'"
                         v-model="critFormModel.KEY_VALUES[k].value"
                         :placeholder="kvIsMulti(critFormModel.KEY_VALUES[k].op) ? 'Comma separated, e.g. 10,20,30' : (kvIsNum(k) ? 'e.g. 50000' : 'Type a value')">
                  <div class="kv-hint">No preset values for this base key</div>
                </template>
                <div class="field-error" v-if="critErr.keys[k]">{{ critErr.keys[k] }}</div>
              </div>
            </div>
          </div>

        </div>

        <div class="side-drawer-foot" v-if="critMode==='list'">
          <button class="btn btn-ghost" @click="closeCritPanel">Close</button>
          <button class="btn btn-yellow" v-if="cfgEditable" @click="openAddCritForm">+ Add value</button>
        </div>
        <div class="side-drawer-foot" v-else>
          <button class="btn btn-ghost" @click="backToCritList">Cancel</button>
          <button class="btn btn-yellow" @click="saveCritValue">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" v-if="confirmDeleteCritVal" @click.self="confirmDeleteCritVal=null">
      <div class="confirm-box">
        <p>Are you sure you want to delete this value?</p>
        <div class="confirm-actions"><button class="cancel" @click="confirmDeleteCritVal=null">Cancel</button><button class="ok" @click="confirmDeleteCritValRow">Confirm</button></div>
      </div>
    </div>


    <!-- popup แจ้งผล (Done / Alert) -->
    <div class="modal-overlay" v-if="notice.show" @click.self="notice.show=false">
      <div class="notice-box" :class="notice.kind">
        <div class="notice-icon">
          <svg v-if="notice.kind==='done'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 7"/></svg>
          <svg v-else width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="14"/><line x1="12" y1="18.5" x2="12" y2="18.6"/></svg>
        </div>
        <h3>{{ notice.title }}</h3>
        <p>{{ notice.msg }}</p>
        <button @click="notice.show=false">Close</button>
      </div>
    </div>
  </div>
  `
}).mount('#app');

</script>
</body>
</html>
