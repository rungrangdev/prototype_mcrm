<style>
@font-face {
    font-family: "Krungsri-med";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

input, textarea, select { border: none !important; }

/* ============ page ============ */
.wl-page{
  padding:20px;
  font-family:'Krungsri-med',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  color:#1E2433;
}
.wl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.wl-head h3{margin:0;}
.wl-count{font-size:12px;color:#9AA2B1;font-weight:600;}

/* ============ table ============ */
#worklist_table{width:100%;border-collapse:collapse;background:#FFFFFF;border:1px solid #E4E7EF;}
#worklist_table th{
  font-size:16px;font-weight:600;color:#FFFFFF;background:#6F5F5E;
  text-align:left;padding:11px 12px;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.14);
}
#worklist_table th:last-child{border-right:none;}
#worklist_table td{
  padding:11px 12px;border:1px solid #dedede;font-size:14.5px;
  color:#1E2433;background:#fff;vertical-align:middle;
}
#worklist_table tbody tr:last-child td{border-bottom:none;}
#worklist_table tbody tr:hover td{background:#FBFCFE;}
.cell-id{font-weight:700;letter-spacing:.3px;white-space:nowrap;}
.cell-name{font-weight:600;color:#1E2433;}
.cell-sub{font-size:11px;color:#9AA2B1;margin-top:2px;}
.cell-date{white-space:nowrap;color:#4B5563;}
.muted-dash{color:#C6CBD6;}

/* chip แบบเดียวกับหน้า workflow */
.wl-chip{
  display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.3px;
  padding:2px 8px;border-radius:999px;white-space:nowrap;
  background:#FFFFFF;border:1px solid #E4E7EF;color:#6B7280;
}
.wl-chip.lead{background:#F4F5F7;border-color:#DDE1EA;color:#4B5563;}
.wl-chip.sup{background:#FDF3D3;border-color:#EFD98F;color:#8A6A03;}

/* status pill — โทนเดียวกับ note-pill ของหน้า workflow */
.wl-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap;
}
.wl-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.wp-wait{background:#EEF1F6;color:#64748B;}
.wp-inprogress{background:#FEF4E2;color:#B45309;}
.wp-completed{background:#E4F7EF;color:#0E9F6E;}
.wp-incomplete{background:#FDE8E8;color:#DC2626;}

/* dropdown ⋮ (ปิดใช้งาน) */
.dropdown-container{position:relative;display:inline-block;}
.btn-dots{
  border:none;background:white;font-size:17px;color:#6B7280;
  padding:2px 8px;border-radius:7px;line-height:1;font-family:inherit;cursor:pointer;
}
.btn-dots:hover:not(:disabled){background:white;color:#1E2433;}
/* .btn-dots:disabled{color:#D5DAE5;cursor:not-allowed;} */
.dropdown-menu{
  position:absolute;right:0;background:#fff;border:1px solid #E4E7EF;border-radius:9px;
  box-shadow:0 6px 20px rgba(20,30,60,.14);min-width:120px;padding:4px;display:none;z-index:50;
}
.dropdown-menu.show{display:block;}
.dropdown-menu button{
  display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:8px 12px;font-size:12.5px;color:#1E2433;border-radius:6px;font-family:inherit;
}
.dropdown-menu button:hover{background:#F0F2F8;}

.wl-empty{padding:26px 12px;text-align:center;font-size:12.5px;color:#9AA2B1;}
</style>

/* เปิดใช้งานเมนู ⋮ ภายหลังได้โดยเอา disabled ออก แล้วใช้ toggleDropdown */
function toggleDropdown(event, button){
  event.stopPropagation();
  const menu = button.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(m => { if(m !== menu) m.classList.remove('show'); });
  menu.classList.toggle('show');
}
document.addEventListener('click', function(){
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
});
