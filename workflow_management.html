<style>
    input, textarea, select { border: none !important; }

    /* ============ Workflow canvas & node styles ============ */

      padding: 75px 28px 28px 28px;

<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

function toggleDropdown(event, button) {
  event.stopPropagation();
  const currentMenu = button.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(menu => { if (menu !== currentMenu) menu.classList.remove('show'); });
  currentMenu.classList.toggle('show');
}
document.addEventListener('click', function() {
  document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
});

const CATEGORIES = {
  ELIGIBLE:  { label:'Eligible',  css:'cat-eligible',  codeLabel:'Eligible Code', color:'#8B5E3C' },
  PARAMETER: { label:'Parameter', css:'cat-parameter', codeLabel:'Parameter ID',  color:'#D9A404' },
  PROFILE:   { label:'Profile',   css:'cat-profile',   codeLabel:'Workflow ID',   color:'#6B7280' }
};
const DEFAULT_CATEGORY = 'ELIGIBLE';
const MAX_COLS=5, BOX_W=260, BOX_H=238, GAP_X=50, GAP_Y=50, PAD=8, TERM_W=128, TERM_H=46;
const STROKE='#B9C0D0', STROKE_W=1.7;
const SF_INITIAL = 15847;
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
function numberWithCommas(x){ return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function randomMin(){ return Math.floor(Math.random()*15)+4; }

createApp({
  setup(){
    /* ---- shared master data ---- */
    const flows = MCRM.db.workflows;                 // flow templates, shared with Workflow Config
    const eligibleList = MCRM.db.eligibility;         // real profiles, shared with Lead Eligible Config
    const paramConfigs = MCRM.db.paramConfigs;         // shared with Parameter Master Setup
    const executionLogs = MCRM.db.executionLogs;       // persisted transactions (this page's own data)
    function paramNameOf(program, entity, code){
      const f = paramConfigs.find(c=>c.PROGRAM_CODE===program && c.ENTITY===entity && c.PARAMETER_CODE===code);
      return f ? f.PARAMETER_NAME : code;
    }

    function normalizeStep(s, i){
      let category = s.category || (s.eligible_code ? 'ELIGIBLE' : DEFAULT_CATEGORY);
      if (!CATEGORIES[category]) category = DEFAULT_CATEGORY;
      return {
        id: i+1, name: s.name || `Step${i+1}`, type: s.type || 'AUTO', status: s.status || 'Wait',
        detail: s.detail || '', category, code: s.code || s.eligible_code || '',
        leadType: s.leadType || '', entity: s.entity || '', program: s.program || '',
        params: Array.isArray(s.params) ? s.params.slice() : [],
      };
    }

    /* ---- list / editor navigation ---- */
    const pageView = ref('list');
    const currentTrans = ref(null);
    function openTransaction(trans_id){
      const t = executionLogs.find(e => e.trans_id === trans_id);
      if (!t) return;
      currentTrans.value = t;
      pageView.value = 'editor';
    }
    function backToList(){ pageView.value = 'list'; }

    function nextTransId(){ return 'T' + String(executionLogs.length+1).padStart(5,'0'); }
    const showCreateTrans = ref(false);
    const createFlowId = ref('');
    function openCreateTrans(){ createFlowId.value = flows[0]?.flow_id || ''; showCreateTrans.value = true; }
    function createTransaction(){
      const flow = flows.find(f => f.flow_id === createFlowId.value);
      if (!flow){ showToast('กรุณาเลือก Flow', false); return; }
      const now = MCRM.nowStr();
      const entry = { trans_id: nextTransId(), flow_id: flow.flow_id, flow_name: flow.flow_name, create_date: now, start_date: now, end_date: '', steps: flow.steps.map(normalizeStep) };
      executionLogs.push(entry);
      showCreateTrans.value = false;
      showToast(`สร้าง Transaction "${entry.trans_id}" เรียบร้อย`);
    }
    const confirmDeleteTrans = ref(null);
    function askDeleteTrans(t){ confirmDeleteTrans.value = t; }
    function confirmDeleteTransYes(){
      const t = confirmDeleteTrans.value;
      executionLogs.splice(executionLogs.findIndex(e => e === t), 1);
      confirmDeleteTrans.value = null;
      showToast(`ลบ Transaction "${t.trans_id}" แล้ว`);
    }

    /* ---- register a completed/running transaction as a worklist lead ---- */
    const confirmRegister = ref(null);
    function registerLead(trans_id){
      const t = executionLogs.find(e => e.trans_id === trans_id);
      if (t) confirmRegister.value = t;
    }
    function confirmRegisterYes(){
      const t = confirmRegister.value;
      confirmRegister.value = null;
      const worklist = MCRM.db.worklist;
      const leadId = 'L' + String(2026000000 + worklist.length + 1);
      worklist.push({
        lead_id: leadId, lead_name: t.flow_name, lead_sub: t.flow_name, lead_type: '', entity: '',
        flow_id: t.flow_id, flow_name: t.flow_name, tran_id: t.trans_id, suppression: '',
        submit_date: MCRM.nowStr(), complete_date: '', status: 'Wait',
      });
      showToast(`Registered lead for "${t.flow_name}"`);
      setTimeout(() => { window.location.href = 'worklist.html'; }, 600);
    }

    /* ---- canvas layout (fixed box height, no measuring needed) ---- */
    const canvasEl = ref(null);
    const cols = ref(5);
    function computeCols(){
      let avail = canvasEl.value && canvasEl.value.clientWidth > 0 ? canvasEl.value.clientWidth : window.innerWidth;
      avail -= 56;
      const n = Math.floor((avail - PAD*2 + GAP_X) / (BOX_W + GAP_X));
      cols.value = Math.min(MAX_COLS, Math.max(1, n));
    }
    onMounted(() => {
      computeCols();
      let resizeTimer = null;
      window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(computeCols, 150); });
    });

    const steps = computed(() => currentTrans.value ? currentTrans.value.steps : []);
    function nodeCount(){ return steps.value.length + 2; }
    function isTerm(i){ return i===0 || i===steps.value.length+1; }
    function getPos(idx){
      const row = Math.floor(idx/cols.value), col = idx%cols.value;
      const rev = row % 2 === 1;
      const c = rev ? (cols.value-1-col) : col;
      return { x: PAD+c*(BOX_W+GAP_X), y: PAD+row*(BOX_H+GAP_Y), row, rev };
    }
    function rectAt(i){
      const p = getPos(i);
      if (isTerm(i)) return { x:p.x+(BOX_W-TERM_W)/2, y:p.y+(BOX_H-TERM_H)/2, w:TERM_W, h:TERM_H, rev:p.rev, row:p.row };
      return { x:p.x, y:p.y, w:BOX_W, h:BOX_H, rev:p.rev, row:p.row };
    }
    function makePath(){
      const n = nodeCount();
      if (n<2) return '';
      const parts = [];
      for (let i=0; i<n-1; i++){
        const a=rectAt(i), b=rectAt(i+1);
        const ax=a.rev?a.x:(a.x+a.w), ay=a.y+a.h/2;
        const bx=b.rev?(b.x+b.w):b.x, by=b.y+b.h/2;
        if (a.row===b.row){
          const mx=(ax+bx)/2;
          parts.push(`M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}`);
        } else {
          const midX = a.rev ? (PAD-GAP_X/2) : (PAD+cols.value*(BOX_W+GAP_X)-GAP_X/2);
          const cr=14, d1=a.rev?-1:1, d2=b.rev?-1:1;
          parts.push(`M${ax},${ay} L${midX-d1*cr},${ay} Q${midX},${ay} ${midX},${ay+cr} L${midX},${by-cr} Q${midX},${by} ${midX+d2*cr},${by} L${bx},${by}`);
        }
      }
      return parts.join(' ');
    }
    const svgW = computed(() => PAD*2 + cols.value*(BOX_W+GAP_X) - GAP_X + GAP_X + 60);
    const svgH = computed(() => { const rows = Math.ceil(nodeCount()/cols.value)||1; return PAD*2 + rows*(BOX_H+GAP_Y) - GAP_Y + 40; });

    function statusClass(st){ return st==='Wait'?'st-wait':st==='Inprogress'?'st-inprogress':st==='Completed'?'st-completed':st==='Incomplete'?'st-incomplete':''; }
    function badgeClass(st){ return 'b-'+st.toLowerCase(); }
    function codeChipInfo(s){
      const cat = CATEGORIES[s.category] || CATEGORIES[DEFAULT_CATEGORY];
      if (!s.code && s.category==='PARAMETER') return null;
      return { cat, val: s.code || '-' };
    }
    function allDone(){ return steps.value.length>0 && steps.value.every(s=>s.status==='Completed'); }

    /* ---- parameter detail modal ---- */
    const paramModal = reactive({ show:false, step:null });
    function openStepParams(i){ paramModal.step = steps.value[i]; paramModal.show = true; }
    function closeStepParams(){ paramModal.show = false; }

    /* ---- funnel result modal — reads the REAL eligibility profile's conditions ---- */
    const funnelModal = reactive({ show:false, name:'', code:'', meta:'', rows:[], init:0, red:0, fin:0, pct:'0', note:'' });
    function sfFlatten(groups){
      const rows = [];
      groups.forEach(g => g.items.forEach(item => {
        if (item.type === 'group') item.conds.forEach(c => rows.push({ cond:c, enabled: c.enabled!==false && item.enabled!==false }));
        else rows.push({ cond:item, enabled: item.enabled!==false });
      }));
      return rows;
    }
    function sfPctOf(fieldId){
      const meta = MCRM.FIELD_META[fieldId];
      if (meta && meta.pct !== undefined) return meta.pct;
      let h=0; for (const ch of String(fieldId)) h=(h*31+ch.charCodeAt(0))%10000;
      return +((h%180)/10 + 1).toFixed(1);
    }
    function openStepFunnel(i){
      const s = steps.value[i];
      const rec = eligibleList.find(e => e.code === s.code);
      const flat = rec ? sfFlatten(rec.groups) : [];
      let running = SF_INITIAL, no=0, active=0, skipped=0;
      const out = flat.map(r => {
        no++;
        if (!r.enabled){ skipped++; return { no, name: r.cond.label || r.cond.fieldId, skipped:true }; }
        active++;
        const pct = sfPctOf(r.cond.fieldId);
        const before = running;
        const after = Math.max(0, Math.round(before*(1-pct/100)));
        running = after;
        return { no, name: r.cond.label || r.cond.fieldId, skipped:false, before, after, red: after-before, pct, bar: Math.min(100, Math.round(pct/30*100)) };
      });
      const totalRed = running - SF_INITIAL;
      Object.assign(funnelModal, {
        show:true, name:s.name, code:s.code||'-', meta:`Step #${i+1} · ${active} conditions${skipped?` · ${skipped} skipped`:''} · ${s.detail||'-'}`,
        rows: out, init:SF_INITIAL, red:totalRed, fin:running, pct:(totalRed/SF_INITIAL*100).toFixed(1),
        note:'Generated ' + new Date().toLocaleString(),
      });
    }
    function closeStepFunnel(){ funnelModal.show = false; }
    function exportStepFunnel(){
      if (!funnelModal.rows.length) return;
      const csv = ['#,Condition,Leads Before,Leads After,Reduction,Reduction %']
        .concat(funnelModal.rows.filter(r=>!r.skipped).map(r => `${r.no},"${r.name}",${r.before},${r.after},${r.red},${r.pct}%`))
        .join('\n');
      const url = URL.createObjectURL(new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' }));
      const a = document.createElement('a');
      a.href = url; a.download = `funnel_${funnelModal.code}.csv`; a.click();
      URL.revokeObjectURL(url);
    }

    /* ---- summary note bar ---- */
    const flowStatus = computed(() => {
      const list = steps.value;
      if (!list.length) return 'Wait';
      if (list.some(s=>s.status==='Incomplete')) return 'Incomplete';
      if (list.every(s=>s.status==='Completed')) return 'Completed';
      if (list.some(s=>s.status==='Inprogress'||s.status==='Completed')) return 'Inprogress';
      return 'Wait';
    });
    watch(flowStatus, (st) => {
      if (!currentTrans.value) return;
      if ((st==='Completed' || st==='Incomplete') && !currentTrans.value.end_date) currentTrans.value.end_date = MCRM.nowStr();
    });
    const currentStepLabel = computed(() => {
      const list = steps.value;
      let idx = list.findIndex(s=>s.status==='Inprogress');
      if (idx<0) idx = list.findIndex(s=>s.status==='Incomplete');
      if (idx<0 && flowStatus.value==='Completed') idx = list.length-1;
      return idx>=0 ? `#${idx+1} ${list[idx].name}` : '-';
    });

    /* ---- run flow ---- */
    const manualWarning = reactive({ show:false, stepNo:0, name:'' });
    async function processRunFlow(indexFlow){
      let index = 0;
      for (const step of steps.value){
        if (index < indexFlow){ index++; continue; }
        if (step.type==='MANUAL' && indexFlow !== index){ Object.assign(manualWarning, { show:true, stepNo:index+1, name:step.name }); return; }
        step.status = 'Inprogress';
        await delay(2000);
        step.status = 'Completed';
        index++;
      }
    }
    function runFlow(i){ processRunFlow(i); }

    const toast = reactive({ show:false, msg:'', ok:true });
    let toastTimer = null;
    function showToast(msg, ok=true){ toast.msg=msg; toast.ok=ok; toast.show=true; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.show=false,2600); }

    /* ---- entry from Workflow Config's "Run Flow" (?create_flow_id=...) ---- */
    onMounted(() => {
      const params = new URLSearchParams(window.location.search);
      const createFlowIdParam = params.get('create_flow_id');
      if (createFlowIdParam && flows.some(f=>f.flow_id===createFlowIdParam)){
        createFlowId.value = createFlowIdParam;
        createTransaction();
      }
    });

    return {
      flows, executionLogs, CATEGORIES, paramNameOf, STROKE, STROKE_W,
      pageView, currentTrans, openTransaction, backToList,
      showCreateTrans, createFlowId, openCreateTrans, createTransaction,
      confirmDeleteTrans, askDeleteTrans, confirmDeleteTransYes,
      confirmRegister, registerLead, confirmRegisterYes,
      canvasEl, cols, steps, nodeCount, isTerm, rectAt, makePath, svgW, svgH,
      statusClass, badgeClass, codeChipInfo, allDone,
      paramModal, openStepParams, closeStepParams,
      funnelModal, openStepFunnel, closeStepFunnel, exportStepFunnel,
      flowStatus, currentStepLabel,
      manualWarning, runFlow, numberWithCommas, randomMin,
      toast,
    };
  },

                    <svg v-if="steps[n-2].status==='Incomplete'" width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="none" stroke="#FCA5A5" stroke-width="1.5"/></svg>

        </svg>

    <!-- Parameter detail modal -->
    <div class="fmodal-bg" :class="{open: paramModal.show}" @click="$event.target===$event.currentTarget && closeStepParams()">
      <div class="fmodal" style="width:600px" v-if="paramModal.step">
        <div class="fmodal-head">
          <span class="fmodal-title">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M2 7h10M2 10h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            Parameter Detail — {{ paramModal.step.name }}

    <!-- Funnel result modal -->

      <div class="fmodal">
        <div class="fmodal-head">

          <table class="ftbl">

            <tbody>
              <tr v-if="!funnelModal.rows.length"><td colspan="6" style="text-align:center;color:#9AA2B1;padding:16px">No condition data available for this profile.</td></tr>
              <tr v-for="r in funnelModal.rows" :key="r.no" :class="{skipped: r.skipped}">

                <td>
                  <div class="bar-cell" v-if="!r.skipped && r.pct"><div class="mbar"><div class="mbar-fill" :style="{width:r.bar+'%'}"></div></div><span class="neg">-{{ r.pct }}%</span></div>
                  <span v-else>—</span>
                </td>
              </tr>
            </tbody>
          </table>
          <div class="sum-grid">
            <div class="sum-card"><div class="sum-lbl">Initial Leads</div><div class="sum-val">{{ funnelModal.init.toLocaleString() }}</div></div>
            <div class="sum-card"><div class="sum-lbl">Total Filtered</div><div class="sum-val neg">{{ funnelModal.red.toLocaleString() }}</div></div>
            <div class="sum-card"><div class="sum-lbl">Final Eligible</div><div class="sum-val" style="color:#10B981">{{ funnelModal.fin.toLocaleString() }}</div></div>
            <div class="sum-card"><div class="sum-lbl">% Reduction</div><div class="sum-val neg">{{ funnelModal.pct }}%</div></div>
          </div>
        </div>
        <div class="fmodal-foot">
          <span class="gen-note">{{ funnelModal.note }}</span>
          <div style="display:flex;gap:8px"><button class="btn-ghost" @click="exportStepFunnel">Export Results</button><button class="btn-run" @click="closeStepFunnel">Close</button></div>
        </div>
      </div>
    </div>

    <div class="toast" v-if="toast.show">{{ toast.msg }}</div>
  </div>
  `
}).mount('#app');
</script>
