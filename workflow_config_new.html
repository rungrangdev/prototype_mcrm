<script>
const { createApp, ref, reactive, computed, onMounted, onUpdated, nextTick } = Vue;

function toggleDropdown(event, button){
  event.stopPropagation();
  const currentMenu = button.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(menu => { if (menu !== currentMenu) menu.classList.remove('show'); });
  currentMenu.classList.toggle('show');
}
document.addEventListener('click', function(){
  document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
});

const TYPES = ['AUTO','MANUAL'];
const BOX_W=250, GAP_X=45, GAP_Y=20, PAD=5, MIN_BOX_H=120;
const STROKE='#CCCCCC', STROKE_W=2;
const DEFAULT_CRON='* * * * *';
const WD_TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
const WD_TH_SHORT=['อา','จ','อ','พ','พฤ','ศ','ส'];
const pad2 = n => String(n).padStart(2,'0');
const SCH_MODES=[
  {key:'minute', label:'ทุกนาที'},
  {key:'hourly', label:'รายชั่วโมง'},
  {key:'daily',  label:'รายวัน'},
  {key:'weekly', label:'รายสัปดาห์'},
  {key:'monthly',label:'รายเดือน'},
  {key:'custom', label:'กำหนดเอง'}
];

function parseCron(cron){
  const p=(cron||DEFAULT_CRON).trim().split(/\s+/);
  if(p.length!==5) return { mode:'custom', cron:cron||DEFAULT_CRON };
  const [mi,h,dom,mo,dw]=p;
  const isNum = x=>/^\d+$/.test(x);
  if(mo!=='*') return { mode:'custom', cron };
  if(mi==='*'&&h==='*'&&dom==='*'&&dw==='*') return { mode:'minute', every:1 };
  const st=mi.match(/^\*\/(\d+)$/);
  if(st&&h==='*'&&dom==='*'&&dw==='*') return { mode:'minute', every:+st[1] };
  if(isNum(mi)&&h==='*'&&dom==='*'&&dw==='*') return { mode:'hourly', minute:+mi };
  if(isNum(mi)&&isNum(h)&&dom==='*'&&dw==='*') return { mode:'daily', time:pad2(h)+':'+pad2(mi) };
  if(isNum(mi)&&isNum(h)&&dom==='*'&&dw!=='*'){
    const days=expandDW(dw);
    if(days) return { mode:'weekly', time:pad2(h)+':'+pad2(mi), days };
  }
  if(isNum(mi)&&isNum(h)&&isNum(dom)&&dw==='*') return { mode:'monthly', time:pad2(h)+':'+pad2(mi), day:+dom };
  return { mode:'custom', cron };
}
function expandDW(s){
  const out=new Set();
  for(const part of s.split(',')){
    if(/^\d$/.test(part)){ out.add(+part); continue; }
    const m=part.match(/^(\d)-(\d)$/);
    if(!m) return null;
    for(let i=+m[1]; i<=+m[2]; i++) out.add(i);
  }
  return [...out].sort((a,b)=>a-b);
}
function compressDays(days){
  const d=[...days].sort((a,b)=>a-b);
  if(!d.length) return '*';
  const ranges=[]; let s=d[0], e=d[0];
  for(let i=1;i<=d.length;i++){
    if(d[i]===e+1){ e=d[i]; continue; }
    ranges.push(s===e?`${s}`:e===s+1?`${s},${e}`:`${s}-${e}`);
    s=e=d[i];
  }
  return ranges.join(',');
}
function cronDescribe(cron){
  const s=parseCron(cron);
  switch(s.mode){
    case 'minute': return s.every>1 ? `รันทุก ${s.every} นาที` : 'รันทุกนาที';
    case 'hourly': return `รันทุกชั่วโมง ที่นาทีที่ ${s.minute}`;
    case 'daily':  return `รันทุกวัน เวลา ${s.time} น.`;
    case 'weekly': return `รันทุกวัน${s.days.map(d=>WD_TH[d]).join(', ')} เวลา ${s.time} น.`;
    case 'monthly':return `รันทุกวันที่ ${s.day} ของเดือน เวลา ${s.time} น.`;
    default: {
      const m=(cron||'').trim().match(/^(\d+)\s+(\d+)\s+([\d,]+)\s+\*\s+\*$/);
      if(m) return `รันทุกวันที่ ${m[3].split(',').join(', ')} ของเดือน เวลา ${pad2(m[2])}:${pad2(m[1])} น.`;
      return 'กำหนดเอง (custom cron)';
    }
  }
}
function numberWithCommas(x){ return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

createApp({
  setup(){
    /* ---- shared master data (Lead Type / Entity / Program / Parameter setup) ----
       Sourced from store.js so this builder always reflects what's configured in
       Master Data Manager and Parameter Master Setup. */
    const rows = MCRM.db.rows;
    const LEAD_TYPES = computed(() => rows.filter(r=>r.TYPE==='LEAD_TYPE' && r.ACTIVE==='Y').map(r=>({code:r.CODE,name:r.NAME})));
    const ENTITIES   = computed(() => rows.filter(r=>r.TYPE==='ENTITY' && r.ACTIVE==='Y').map(r=>({code:r.CODE,name:r.NAME})));
    const PROGRAMS   = computed(() => rows.filter(r=>r.TYPE==='PROGRAM' && r.ACTIVE==='Y').map(r=>({code:r.CODE,name:r.NAME})));
    const paramConfigs = MCRM.db.paramConfigs;
    function getParamList(program, entity){
      if(!program || !entity) return [];
      return paramConfigs.filter(c=>c.PROGRAM_CODE===program && c.ENTITY===entity && c.ACTIVE==='Y').map(c=>({code:c.PARAMETER_CODE, name:c.PARAMETER_NAME}));
    }
    function paramNameOf(program, entity, code){
      const f = getParamList(program, entity).find(p=>p.code===code);
      return f ? f.name : code;
    }

    /* ELIGIBLE steps pick a real Lead Eligible Config profile; PROFILE steps
       reference another saved workflow — both come straight from store.js. */
    const eligibleList = MCRM.db.eligibility;
    const flows = MCRM.db.workflows;
    const DEFAULT_CATEGORY = 'ELIGIBLE';
    const CATEGORIES = computed(() => ({
      ELIGIBLE:  { label:'Eligible',  css:'cat-eligible',  codeLabel:'Eligible Code', codes: eligibleList.map(e=>e.code), color:'#8B5E3C' },
      PARAMETER: { label:'Parameter', css:'cat-parameter', codeLabel:'Parameter ID',  codes: [], color:'#D9A404' },
      PROFILE:   { label:'Profile',   css:'cat-profile',   codeLabel:'Workflow ID',   codes: flows.filter(f=>f.flow_id!==currentFlow.flow_id).map(f=>f.flow_id), color:'#6B7280' },
    }));

    /* ---- list / editor navigation ---- */
    const pageView = ref('list');
    const currentFlow = reactive({ flow_id:'', flow_name:'', run_type:'MANUAL', schedule:'', steps: [] });
    let nextId = 1;

    function normalizeStep(s, i){
      let category = s.category || (s.eligible_code ? 'ELIGIBLE' : DEFAULT_CATEGORY);
      if (!CATEGORIES.value[category]) category = DEFAULT_CATEGORY;
      return {
        id: i + 1,
        name: s.name || `Step${i + 1}`,
        type: s.type || 'AUTO',
        status: s.status || 'Wait',
        detail: s.detail || '',
        category,
        code: s.code || s.eligible_code || '',
        leadType: s.leadType || (LEAD_TYPES.value[0] ? LEAD_TYPES.value[0].code : ''),
        entity: s.entity || '',
        program: s.program || '',
        params: Array.isArray(s.params) ? s.params.slice() : []
      };
    }

    function chooseFlow(flow_id){
      const flow = flows.find(f => f.flow_id === flow_id);
      if (flow){
        currentFlow.flow_id = flow.flow_id;
        currentFlow.flow_name = flow.flow_name;
        currentFlow.run_type = (flow.run_type || 'MANUAL').toUpperCase();
        currentFlow.schedule = flow.schedule || (currentFlow.run_type==='AUTO' ? DEFAULT_CRON : '');
        currentFlow.steps = flow.steps.map(normalizeStep);
      } else {
        currentFlow.flow_id = '';
        currentFlow.flow_name = '';
        currentFlow.run_type = 'MANUAL';
        currentFlow.schedule = '';
        currentFlow.steps = [];
      }
      nextId = currentFlow.steps.length + 1;
      boxHeights.length = 0;
    }
    function openFlow(flow_id){ chooseFlow(flow_id); pageView.value = 'editor'; }
    function backToList(){ pageView.value = 'list'; }

    function onRunTypeChange(){
      if (currentFlow.run_type === 'AUTO' && !currentFlow.schedule) currentFlow.schedule = DEFAULT_CRON;
    }
    const scheduleDesc = computed(() => cronDescribe(currentFlow.schedule || DEFAULT_CRON));
    function scheduleDescFor(f){ return cronDescribe(f.schedule || DEFAULT_CRON); }

    /* ---- add / remove step ---- */
    const showAddStep = ref(false);
    function openAddStepDialog(){ showAddStep.value = true; }
    function addStep(category){
      category = CATEGORIES.value[category] ? category : DEFAULT_CATEGORY;
      currentFlow.steps.push({
        id: nextId++, name:`Step${currentFlow.steps.length+1}`, type:'AUTO', status:'Wait', detail:'',
        category, code:'', leadType: LEAD_TYPES.value[0] ? LEAD_TYPES.value[0].code : '', entity:'', program:'', params:[]
      });
      showAddStep.value = false;
    }
    function removeStep(id){ currentFlow.steps = currentFlow.steps.filter(s => s.id !== id); }
    function changeCategory(s){
      s.code = ''; s.leadType = LEAD_TYPES.value[0] ? LEAD_TYPES.value[0].code : ''; s.entity=''; s.program=''; s.params=[];
      closeParamPicker();
    }
    function onEntityOrProgramChange(s){ s.params = []; closeParamPicker(); }

    /* ---- parameter multi-select picker ---- */
    /* Positioned as a viewport-fixed panel (not nested in the SVG box) because
       foreignObject clips overflowing content — a dropdown nested inside it
       would get cut off instead of floating above the canvas. */
    const paramPickerStepId = ref(null);
    const paramPickerPos = reactive({ left:0, top:0, minWidth:200 });
    const activeParamStep = computed(() => currentFlow.steps.find(x => x.id === paramPickerStepId.value) || null);
    function toggleParamPicker(s, event){
      if (paramPickerStepId.value === s.id){ closeParamPicker(); return; }
      paramPickerStepId.value = s.id;
      const rect = event.currentTarget.getBoundingClientRect();
      paramPickerPos.left = Math.max(8, rect.left);
      paramPickerPos.top = rect.bottom + 4;
      paramPickerPos.minWidth = Math.max(rect.width, 200);
    }
    function closeParamPicker(){ paramPickerStepId.value = null; }
    function toggleParamValue(s, code){
      const i = s.params.indexOf(code);
      if (i >= 0) s.params.splice(i,1); else s.params.push(code);
    }
    function removeParam(s, code){ s.params = s.params.filter(c => c !== code); }
    onMounted(() => document.addEventListener('click', closeParamPicker));

    /* ---- canvas layout (columns / row heights measured from the real DOM) ---- */
    const canvasEl = ref(null);
    const cols = ref(5);
    function computeCols(){
      let avail = canvasEl.value ? canvasEl.value.clientWidth : 0;
      if (avail <= 0) avail = window.innerWidth;
      avail -= PAD*2 + GAP_X;
      cols.value = Math.max(1, Math.floor((avail + GAP_X) / (BOX_W + GAP_X)));
    }
    const boxHeights = reactive([]);
    const boxRefs = [];
    function setBoxRef(el, i){ if (el) boxRefs[i] = el; }
    function measureHeights(){
      let changed = false;
      currentFlow.steps.forEach((s,i) => {
        const el = boxRefs[i];
        if (el){
          const h = Math.max(el.offsetHeight + 4, MIN_BOX_H);
          if (boxHeights[i] !== h){ boxHeights[i] = h; changed = true; }
        }
      });
      if (boxHeights.length > currentFlow.steps.length){ boxHeights.length = currentFlow.steps.length; changed = true; }
      return changed;
    }
    onUpdated(() => { if (pageView.value === 'editor') nextTick(measureHeights); });
    onMounted(() => {
      computeCols();
      nextTick(measureHeights);
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { computeCols(); nextTick(measureHeights); }, 150);
      });
    });

    const layout = computed(() => {
      const n = currentFlow.steps.length;
      const totalRows = Math.ceil((n+1)/cols.value) || 1;
      const rowH = [], rowY = [];
      for (let r=0; r<totalRows; r++){
        const hsInRow = [];
        for (let c=0; c<cols.value; c++){
          const idx = r*cols.value + c;
          if (idx < n) hsInRow.push(boxHeights[idx] || MIN_BOX_H);
        }
        rowH[r] = hsInRow.length ? Math.max(...hsInRow) : MIN_BOX_H;
      }
      let y = PAD;
      for (let r=0; r<totalRows; r++){ rowY[r]=y; y += rowH[r] + GAP_Y; }
      return { rowH, rowY, totalRows };
    });
    function getPos(idx){
      const row = Math.floor(idx/cols.value), col = idx % cols.value;
      const rev = row % 2 === 1;
      const c = rev ? (cols.value-1-col) : col;
      const y = layout.value.rowY[row] !== undefined ? layout.value.rowY[row] : PAD;
      return { x: PAD + c*(BOX_W+GAP_X), y, row, rev };
    }
    function boxCY(i){ const p=getPos(i); const h=boxHeights[i]||MIN_BOX_H; return p.y + h/2; }
    function makePath(){
      if (currentFlow.steps.length < 2) return '';
      const parts=[];
      for (let i=0; i<currentFlow.steps.length-1; i++){
        const a=getPos(i), b=getPos(i+1);
        const ax = a.rev ? a.x : (a.x+BOX_W), ay=boxCY(i);
        const bx = b.rev ? (b.x+BOX_W) : b.x, by=boxCY(i+1);
        if (a.row===b.row){
          const mx=(ax+bx)/2;
          parts.push(`M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}`);
        } else {
          const midX = a.rev ? (PAD-GAP_X/2) : (PAD+cols.value*(BOX_W+GAP_X)-GAP_X/2);
          const cr=12, d1=a.rev?-1:1, d2=b.rev?-1:1;
          parts.push(`M${ax},${ay} L${midX-d1*cr},${ay} Q${midX},${ay} ${midX},${ay+cr} L${midX},${by-cr} Q${midX},${by} ${midX+d2*cr},${by} L${bx},${by}`);
        }
      }
      return parts.join(' ');
    }
    const svgW = computed(() => PAD*2 + cols.value*(BOX_W+GAP_X) - GAP_X + GAP_X + 80);
    const svgH = computed(() => {
      const totalRows = layout.value.totalRows, lastRow = totalRows-1;
      const y = layout.value.rowY[lastRow] !== undefined ? layout.value.rowY[lastRow] : PAD;
      const h = layout.value.rowH[lastRow] !== undefined ? layout.value.rowH[lastRow] : MIN_BOX_H;
      return y + h + PAD + 80;
    });
    function addBtnPos(){
      const { x, y, row } = getPos(currentFlow.steps.length);
      const rowH = layout.value.rowH[row] || MIN_BOX_H;
      return { x, y: y + rowH/2 - 18 };
    }

    /* ---- drag & drop reorder ---- */
    let dragSrcId = null;
    const draggingId = ref(null);
    const dragOverId = ref(null);
    function onDragStart(s){ dragSrcId = s.id; draggingId.value = s.id; }
    function onDragEnd(){ draggingId.value = null; dragOverId.value = null; }
    function onDragOver(s){ if (s.id !== dragSrcId) dragOverId.value = s.id; }
    function onDragLeave(){ dragOverId.value = null; }
    function onDrop(s){
      dragOverId.value = null; draggingId.value = null;
      if (dragSrcId === null || dragSrcId === s.id) return;
      const fi = currentFlow.steps.findIndex(x=>x.id===dragSrcId), ti = currentFlow.steps.findIndex(x=>x.id===s.id);
      const [m] = currentFlow.steps.splice(fi,1);
      currentFlow.steps.splice(ti,0,m);
      dragSrcId = null;
    }

    function statusClass(st){ return st==='Wait'?'st-wait':st==='Inprogress'?'st-inprogress':st==='Completed'?'st-completed':st==='Incomplete'?'st-incomplete':''; }
    function badgeClass(st){ return 'b-'+st.toLowerCase(); }

    /* ---- schedule (cron) builder ---- */
    const showSchedule = ref(false);
    const schedForm = reactive({ mode:'daily', every:1, minute:0, time:'09:00', day:1, days:[1], custom:DEFAULT_CRON });
    function openScheduleDialog(){
      const s = parseCron(currentFlow.schedule || DEFAULT_CRON);
      schedForm.mode = s.mode;
      schedForm.every = s.every || 1;
      schedForm.minute = s.minute || 0;
      schedForm.time = s.time || '09:00';
      schedForm.day = s.day || 1;
      schedForm.days = (s.days && s.days.length) ? s.days.slice() : [1];
      schedForm.custom = s.mode==='custom' ? (s.cron||DEFAULT_CRON) : (currentFlow.schedule||DEFAULT_CRON);
      showSchedule.value = true;
    }
    function toggleSchDay(i){ const idx=schedForm.days.indexOf(i); if (idx>=0) schedForm.days.splice(idx,1); else schedForm.days.push(i); }
    function buildCronFromSch(f){
      switch (f.mode){
        case 'minute': return f.every>1 ? `*/${f.every} * * * *` : '* * * * *';
        case 'hourly': return `${f.minute} * * * *`;
        case 'daily': { const [h,m]=(f.time||'09:00').split(':'); return `${+m} ${+h} * * *`; }
        case 'weekly': { const [h,m]=(f.time||'09:00').split(':'); return `${+m} ${+h} * * ${compressDays(f.days)}`; }
        case 'monthly': { const [h,m]=(f.time||'09:00').split(':'); return `${+m} ${+h} ${f.day} * *`; }
        default: return (f.custom||'').trim();
      }
    }
    const cronPreview = computed(() => buildCronFromSch(schedForm));
    const cronPreviewDesc = computed(() => cronDescribe(cronPreview.value));
    function saveSchedule(){
      if (schedForm.mode==='weekly' && !schedForm.days.length){ showToast('เลือกวันอย่างน้อย 1 วัน', false); return; }
      const cron = cronPreview.value;
      if (schedForm.mode==='custom' && cron.split(/\s+/).length!==5){ showToast('Cron ต้องมี 5 ช่อง เช่น 0 1 * * *', false); return; }
      currentFlow.schedule = cron;
      showSchedule.value = false;
    }

    /* ---- payload / save ---- */
    const outputText = ref('');
    const showOutput = ref(false);
    const copyLabel = ref('Copy');
    function buildPayload(){
      return {
        flow_id: currentFlow.flow_id,
        flow_name: currentFlow.flow_name,
        run_type: currentFlow.run_type,
        schedule: currentFlow.run_type==='AUTO' ? (currentFlow.schedule||DEFAULT_CRON) : null,
        steps: currentFlow.steps.map((s,i) => {
          const base = { order:i+1, type:s.type, name:s.name, detail:s.detail, category:s.category, status:s.status };
          if (s.category==='PARAMETER'){ base.leadType=s.leadType; base.entity=s.entity; base.program=s.program; base.params=s.params||[]; }
          else { base.code = s.code; }
          return base;
        })
      };
    }
    function submitFlow(){
      const payload = buildPayload();
      outputText.value = JSON.stringify(payload, null, 4);
      showOutput.value = true;
      if (!currentFlow.flow_id.trim()){ showToast('กรุณากรอก Flow ID เพื่อบันทึกเข้ารายการ', false); return; }
      const idx = flows.findIndex(f => f.flow_id === currentFlow.flow_id);
      const record = { flow_id: payload.flow_id, flow_name: payload.flow_name, run_type: payload.run_type, schedule: payload.schedule, steps: payload.steps };
      if (idx >= 0) flows[idx] = record; else flows.push(record);
      showToast('บันทึก Flow เรียบร้อย');
    }
    function copyPayload(){
      navigator.clipboard.writeText(outputText.value).then(() => {
        copyLabel.value = 'Copied!';
        setTimeout(() => copyLabel.value = 'Copy', 1500);
      });
    }

    /* ---- run flow ---- */
    const manualWarning = reactive({ show:false, stepNo:0, name:'' });
    async function processRunFlow(indexFlow){
      let index = 0;
      for (const step of currentFlow.steps){
        if (index < indexFlow){ index++; continue; }
        if (step.type === 'MANUAL' && indexFlow !== index){
          Object.assign(manualWarning, { show:true, stepNo:index+1, name:step.name });
          return;
        }
        step.status = 'Inprogress';
        await delay(2000);
        step.status = 'Completed';
        index++;
      }
    }
    function runFlow(i){ submitFlow(); processRunFlow(i); }

    const resultModal = reactive({ show:false, name:'', rows:[{channel:'TELE',qty:1000},{channel:'DTU',qty:500},{channel:'CSP',qty:200}] });
    function showResultModal(name){ resultModal.show = true; resultModal.name = name; }

    /* ---- list page: run / delete a saved flow ---- */
    const confirmRunFlow = ref(null);
    function askRunFlow(flow){ confirmRunFlow.value = flow; }
    function confirmRunFlowYes(){
      const flow = confirmRunFlow.value;
      confirmRunFlow.value = null;
      showToast(`The flow "${flow.flow_name}" is now running.`);
      setTimeout(() => { window.location.href = `workflow_management.html?create_flow_id=${flow.flow_id}`; }, 600);
    }
    const confirmDeleteFlow = ref(null);
    function askDeleteFlow(flow){ confirmDeleteFlow.value = flow; }
    function confirmDeleteFlowYes(){
      const flow = confirmDeleteFlow.value;
      flows.splice(flows.findIndex(f => f === flow), 1);
      confirmDeleteFlow.value = null;
      showToast(`ลบ Flow "${flow.flow_id}" แล้ว`);
    }

    const toast = reactive({ show:false, msg:'', ok:true });
    let toastTimer = null;
    function showToast(msg, ok=true){ toast.msg=msg; toast.ok=ok; toast.show=true; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.show=false,2600); }

    return {
      TYPES, SCH_MODES, WD_TH_SHORT, MIN_BOX_H, BOX_W, STROKE, STROKE_W,
      LEAD_TYPES, ENTITIES, PROGRAMS, getParamList, paramNameOf,
      flows, CATEGORIES, DEFAULT_CATEGORY,
      pageView, currentFlow, openFlow, backToList, onRunTypeChange, scheduleDesc, scheduleDescFor,
      showAddStep, openAddStepDialog, addStep, removeStep, changeCategory, onEntityOrProgramChange,
      paramPickerStepId, paramPickerPos, activeParamStep, toggleParamPicker, toggleParamValue, removeParam,
      canvasEl, setBoxRef, cols, boxHeights, layout, getPos, makePath, svgW, svgH, addBtnPos,
      draggingId, dragOverId, onDragStart, onDragEnd, onDragOver, onDragLeave, onDrop,
      statusClass, badgeClass,
      showSchedule, schedForm, openScheduleDialog, toggleSchDay, cronPreview, cronPreviewDesc, saveSchedule,
      outputText, showOutput, copyLabel, submitFlow, copyPayload,
      manualWarning, runFlow, resultModal, showResultModal, numberWithCommas, pad2,
      confirmRunFlow, askRunFlow, confirmRunFlowYes, confirmDeleteFlow, askDeleteFlow, confirmDeleteFlowYes,
      toast,
    };
  },
  template: `

                 draggable="true"

                  <span v-if="s.status==='Inprogress'" class="spinner"></span>
                  <svg v-if="s.status==='Completed'" width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="5.5" fill="#10B981"/><polyline points="2.8,5.5 4.5,7.5 8.2,3.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <svg v-if="s.status==='Incomplete'" width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="none" stroke="#FCA5A5" stroke-width="1.5"/></svg>
                  {{ s.status }}

                <button class="btn-del" @click="removeStep(s.id)">&times;</button>

                  <option value="">-- Select Entity --</option>
                  <option v-for="e in ENTITIES" :key="e.code" :value="e.code">{{ e.name }}</option>
                </select>
                <div class="field-lbl">Program</div>

                  <option value="">-- Select Program --</option>

              <button class="add-btn" @click="openAddStepDialog">+</button>
            </div>
          </foreignObject>
        </svg>
      </div>

      <!-- floating panel, kept outside the SVG so it isn't clipped by foreignObject -->

    <div class="modal-overlay" v-if="confirmRunFlow" @click.self="confirmRunFlow=null">

      </div>
    </div>

    <!-- Delete flow confirm (list page) -->
    <div class="modal-overlay" v-if="confirmDeleteFlow" @click.self="confirmDeleteFlow=null">
      <div class="modal-box">
        <h3>Delete this flow?</h3>
        <p>You are about to delete <strong>{{ confirmDeleteFlow.flow_id }}</strong> ({{ confirmDeleteFlow.flow_name }}). This cannot be undone.</p>
        <div class="modal-actions"><button class="btn-ghost" @click="confirmDeleteFlow=null">Cancel</button><button class="btn-danger" @click="confirmDeleteFlowYes">Delete</button></div>
      </div>
    </div>

    <div class="toast" v-if="toast.show">{{ toast.msg }}</div>
  </div>
  `
}).mount('#app');
</script>
