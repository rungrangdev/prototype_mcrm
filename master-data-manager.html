<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Data Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.31/vue.global.prod.min.js"></script>
<script src="store.js"></script>

<style>

@font-face {
    font-family: "Krungsri-med";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

  :root{
    --brown: #6f5f5e;
    --brown-dark: #594c4b;
    --brown-darker: #473b3a;
    --brown-light: #f2ecea;
    --brown-lighter: #f9f6f5;
    --white: #ffffff;
    --border: #e7e0de;
    --text: #3c3332;
    --text-muted: #8f8180;
    --success: #22a559;
    --danger: #d1544b;
    --shadow-md: 0 8px 24px rgba(60,50,45,.14);
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: #fff;
    font-family: 'Krungsri-med', 'Inter', sans-serif;
    color: var(--text);
  }

  button { border:none; font-family: inherit; }

  .app-shell{
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 65px);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .sidebar-title{
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: .02em;
    padding: 0 4px;
  }

  .category-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .category-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
    transition: background .15s ease, border-color .15s ease;
    background: var(--white);
  }
  .category-item:hover{
    background: var(--brown-lighter);
  }
  .category-item.active{
    background: var(--brown-light);
    border-left-color: var(--brown);
  }

  .category-checkbox{
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid #cfc4c2;
    background: var(--white);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .category-item.active .category-checkbox{
    background: var(--brown);
    border-color: var(--brown);
    color: #fff;
  }
  .category-checkbox svg{ width: 11px; height: 11px; display: none; }
  .category-item.active .category-checkbox svg{ display: block; }

  .category-text{ flex: 1; min-width: 0; }
  .category-label{
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }
  .category-code{
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .03em;
  }

  .category-count{
    font-size: 12px;
    font-weight: 700;
    color: var(--brown);
    background: var(--brown-light);
    border-radius: 999px;
    padding: 2px 9px;
    min-width: 24px;
    text-align: center;
    flex-shrink: 0;
  }
  .category-item.active .category-count{
    background: var(--brown);
    color: #fff;
  }

  .add-category-btn{
    margin-top: 4px;
    border: 1.5px dashed #d9cecc;
    background: transparent;
    color: var(--brown);
    font-weight: 600;
    font-size: 13.5px;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    transition: background .15s ease, border-color .15s ease;
    width: 100%;
    cursor: pointer;
  }
  .add-category-btn:hover{
    background: var(--brown-lighter);
    border-color: var(--brown);
  }

  /* ---------- Main content ---------- */
  .main{
    padding: 28px 32px;
  }

  .main-header{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .main-title{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
  }

  .main-title .badge-code{
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .03em;
    color: var(--brown);
    background: var(--brown-light);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .main-subtitle{
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .btn-brown{
    background: var(--brown);
    border-color: var(--brown);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 10px;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn-brown:hover{
    background: var(--brown-dark);
    border-color: var(--brown-dark);
    color: #fff;
  }

  .search-wrap{
    position: relative;
    margin-bottom: 18px;
  }
  .search-wrap svg{
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 16px; height: 16px;
  }
  .search-input{
    width: 100%;
    padding: 11px 14px 11px 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--white);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-input:focus{
    border-color: var(--brown);
    box-shadow: 0 0 0 3px rgba(111,95,94,.12);
  }
  .search-input::placeholder{ color: #b8adab; }

  table.data-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin-bottom: 0;
  }
  table.data-table thead th{
    text-align: left;
    font-size: 14.5px;
    font-weight: 700;
    color: #FFF;
    letter-spacing: .02em;
    background: #6f5f5e;
    padding: 13px 18px;
    border : 1px solid #dedede;
  }
  table.data-table tbody td{
    padding: 14px 18px;
    border : 1px solid #dedede;
    vertical-align: middle;
    color: var(--text);
  }
  table.data-table tbody tr:hover{ background: var(--brown-lighter); }

  .code-pill{
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--brown);
    background: var(--brown-light);
    border-radius: 7px;
    padding: 4px 9px;
    letter-spacing: .01em;
  }

  .item-name{ font-weight: 600; color: var(--text); }
  .item-desc{ font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

  .depend-empty{ color: #c2b8b6; }

  .empty-state{
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
  }

  /* ---------- Side panel (Add / Edit item) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;justify-content:flex-start;z-index:50;}
  .side-panel{width:420px;max-width:92vw;background:var(--white);box-shadow:var(--shadow-md);display:flex;flex-direction:column;
    animation:slideIn .18s ease; top:20px; margin-bottom:70px; left:33%; position:relative;}
  @keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .side-panel-head{ border-bottom: 1px solid var(--border); padding: 18px 22px; display:flex; justify-content:space-between; align-items:center; }
  .side-panel-title{ font-size: 16.5px; font-weight: 700; color: var(--text); }
  .close-x{background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;line-height:1;}
  .side-panel-body{ padding: 22px; overflow-y:auto; flex:1; }

  .field-group{ margin-bottom: 18px; }
  .field-label{
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
  }
  .form-control, .form-select{
    width: 100%;
    border-radius: 9px;
    border: 1px solid var(--border);
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--white);
    outline: none;
  }
  .form-control:focus, .form-select:focus{
    border-color: var(--brown);
    box-shadow: 0 0 0 3px rgba(111,95,94,.12);
  }
  textarea.form-control{ resize: vertical; min-height: 64px; }

  .toggle-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--brown-lighter);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .toggle-row .t-title{ font-size: 13.5px; font-weight: 600; color: var(--text); }
  .toggle-row .t-sub{ font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .switch{position:relative;display:inline-block;width:38px;height:22px;cursor:pointer;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#D8DCE4;border-radius:22px;transition:.15s;}
  .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(20,30,50,.2);}
  .switch input:checked + .slider{background:var(--success);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .panel-head{padding:20px 24px;display:flex;border-bottom:1px solid #e7e0de;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .panel-title-row{display:flex;align-items:center;gap:10px;}
  .panel-head h2{margin:0;font-size:19px;font-weight:700;color:#000}

  .panel-footer{
    border-top: 1px solid var(--border);
    padding: 16px 22px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-ghost:hover{ background: var(--brown-lighter); }

  .btn-danger{ background: var(--danger); color:#fff; font-weight:600; font-size:14px; padding:9px 18px; border-radius:10px; cursor:pointer; }
  .btn-danger:hover{ background:#b8443c; }

  ::selection{ background: var(--brown-light); }

  .status_active{
    display:inline-block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--success);
    background: rgba(34,165,89,.1);
    border-radius: 999px;
    padding: 4px 10px;
    text-align: center;
  }

  .status_inactive{
    display:inline-block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: rgba(209,84,75,.1);
    border-radius: 999px;
    padding: 4px 10px;
    text-align: center;
  }

  /* ---------- 3-dot row menu ---------- */
  .dropdown-container { position: relative; display: inline-block; }
  .btn-dots {
    background: none; border: none; font-size: 20px; cursor: pointer;
    padding: 0 8px; color: #6b7280; transition: color 0.2s;
  }
  .btn-dots:hover { color: #000000; }
  .dropdown-menu {
    display: none; position: absolute; top: 100%; right: 0;
    width: max-content; min-width: 100px; padding: 6px;
    background-color: #ffffff; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
    border: 1px solid #e5e7eb; border-radius: 6px; z-index: 10;
  }
  .dropdown-menu button {
    display: block; width: 100%; font-size: 14px; padding: 6px 12px;
    border: none; background-color: transparent; cursor: pointer;
    text-align: left; color: #1f2937; white-space: nowrap;
  }
  .dropdown-menu button:hover { background-color: #F3F4F6; border-radius: 4px; color: #000000; }
  .dropdown-menu.show { display: block; }

  /* ---------- confirm modal + toast ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,40,.42);display:flex;align-items:center;justify-content:center;z-index:99999;}
  .modal-box{background:#fff;border-radius:12px;padding:24px;width:400px;max-width:92vw;box-shadow:var(--shadow-md);animation:pop .15s ease;}
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-box h3{margin:0 0 8px;font-size:16px;}
  .modal-box p{margin:0 0 20px;color:var(--text-muted);font-size:13.5px;line-height:1.6;}
  .modal-box .warn-box{background:rgba(209,84,75,.1);color:#9A3131;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brown-darker);color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow-md);z-index:99999;display:flex;align-items:center;gap:10px;}
  .toast .tick{color:#6FE3A6;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed } = Vue;

function toggleDropdown(event, button) {
  event.stopPropagation();
  const currentMenu = button.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(menu => {
    if (menu !== currentMenu) menu.classList.remove('show');
  });
  currentMenu.classList.toggle('show');
}
document.addEventListener('click', function() {
  document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
});

createApp({
  setup(){
    const now = MCRM.nowStr;

    /* ---- shared master data catalog ----
       Same store.js records used by Program Setup and Parameter Master Setup,
       so a category/item added or edited here shows up there too. */
    const rows = MCRM.db.rows;

    const categories = computed(() => rows.filter(r => r.TYPE === 'SYS_TYPE').sort((a,b) => Number(a.ORDER) - Number(b.ORDER)));
    const activeKey = ref('LEAD_TYPE');
    const activeCategory = computed(() => categories.value.find(c => c.CODE === activeKey.value) || categories.value[0]);
    const itemCount = (typeCode) => rows.filter(r => r.TYPE === typeCode).length;
    const activeItemCount = (typeCode) => rows.filter(r => r.TYPE === typeCode && r.ACTIVE === 'Y').length;

    function selectCategory(code){ activeKey.value = code; search.value = ''; }

    const search = ref('');
    const items = computed(() => {
      let list = rows.filter(r => r.TYPE === activeKey.value);
      if (search.value.trim()){
        const q = search.value.trim().toLowerCase();
        list = list.filter(r => r.CODE.toLowerCase().includes(q) || r.NAME.toLowerCase().includes(q) || (r.DESCRIPTION||'').toLowerCase().includes(q));
      }
      return list.sort((a,b) => Number(a.ORDER) - Number(b.ORDER));
    });

    /* ---- add / edit item panel ---- */
    const showPanel = ref(false);
    const isEditing = ref(false);
    const formModel = reactive({ CODE:'', NAME:'', DESCRIPTION:'', ORDER:'1', DEPEND_ON:'', ACTIVE:'Y' });
    const dependOptions = computed(() => rows.filter(r => r.TYPE === activeKey.value && r.CODE !== formModel.CODE));

    function openAddPanel(){
      isEditing.value = false;
      Object.assign(formModel, { CODE:'', NAME:'', DESCRIPTION:'', ORDER:String(items.value.length+1), DEPEND_ON:'', ACTIVE:'Y' });
      showPanel.value = true;
    }
    function openEditPanel(item){
      isEditing.value = true;
      Object.assign(formModel, { CODE:item.CODE, NAME:item.NAME, DESCRIPTION:item.DESCRIPTION, ORDER:item.ORDER, DEPEND_ON:item.DEPEND_ON, ACTIVE:item.ACTIVE });
      showPanel.value = true;
    }
    function closePanel(){ showPanel.value = false; }
    function saveItem(){
      const code = formModel.CODE.trim();
      const name = formModel.NAME.trim();
      if (!code){ showToast('กรุณากรอกรหัส (Code)', false); return; }
      if (!name){ showToast('กรุณากรอกชื่อ (Name)', false); return; }
      if (isEditing.value){
        const idx = rows.findIndex(r => r.TYPE === activeKey.value && r.CODE === code);
        rows[idx] = { ...rows[idx], NAME:name, DESCRIPTION:formModel.DESCRIPTION.trim(), DEPEND_ON:formModel.DEPEND_ON, ACTIVE:formModel.ACTIVE, UPDATE_BY:'ADMIN', UPDATE_DATE:now() };
        showToast(`บันทึกการแก้ไข "${name}" เรียบร้อย`);
      } else {
        if (rows.some(r => r.TYPE === activeKey.value && r.CODE.toLowerCase() === code.toLowerCase())){ showToast('รหัสนี้มีอยู่แล้วในหมวดหมู่นี้', false); return; }
        rows.push({ TYPE:activeKey.value, CODE:code, NAME:name, DESCRIPTION:formModel.DESCRIPTION.trim(), ORDER:formModel.ORDER, ACTIVE:formModel.ACTIVE, DEPEND_ON:formModel.DEPEND_ON, CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
        showToast(`เพิ่ม "${name}" เรียบร้อย`);
      }
      showPanel.value = false;
    }
    function toggleActive(item){ item.ACTIVE = item.ACTIVE === 'Y' ? 'N' : 'Y'; item.UPDATE_BY='ADMIN'; item.UPDATE_DATE=now(); }

    /* ---- delete (blocked when other rows depend on this one) ---- */
    const confirmDeleteItem = ref(null);
    function askDelete(item){ confirmDeleteItem.value = item; }
    function cancelDelete(){ confirmDeleteItem.value = null; }
    const blockingDependents = computed(() => !confirmDeleteItem.value ? [] : rows.filter(r => r.TYPE === activeKey.value && r.DEPEND_ON === confirmDeleteItem.value.CODE));
    function confirmDelete(){
      const item = confirmDeleteItem.value;
      if (blockingDependents.value.length){
        showToast('ไม่สามารถลบได้ เนื่องจากมีรายการอื่นอ้างอิงอยู่ กรุณาปิดใช้งานแทนการลบ', false);
        confirmDeleteItem.value = null;
        return;
      }
      rows.splice(rows.findIndex(r => r === item), 1);
      showToast(`ลบ "${item.NAME}" ออกจากระบบแล้ว`);
      confirmDeleteItem.value = null;
    }

    /* ---- add a brand-new category (SYS_TYPE) ---- */
    const showAddCategory = ref(false);
    const categoryForm = reactive({ CODE:'', NAME:'', DESCRIPTION:'' });
    function openAddCategory(){ Object.assign(categoryForm, { CODE:'', NAME:'', DESCRIPTION:'' }); showAddCategory.value = true; }
    function saveCategory(){
      const code = categoryForm.CODE.trim().toUpperCase().replace(/\s+/g,'_');
      if (!code || !categoryForm.NAME.trim()){ showToast('กรุณากรอกรหัสและชื่อหมวดหมู่', false); return; }
      if (rows.some(r => r.TYPE === 'SYS_TYPE' && r.CODE === code)){ showToast('มีหมวดหมู่นี้อยู่แล้ว', false); return; }
      rows.push({ TYPE:'SYS_TYPE', CODE:code, NAME:categoryForm.NAME.trim(), DESCRIPTION:categoryForm.DESCRIPTION.trim(), ORDER:String(categories.value.length+1), ACTIVE:'Y', DEPEND_ON:'', CREATE_BY:'ADMIN', CREATE_DATE:now(), UPDATE_BY:'ADMIN', UPDATE_DATE:now() });
      activeKey.value = code;
      showAddCategory.value = false;
      showToast(`สร้างหมวดหมู่ "${categoryForm.NAME}" เรียบร้อย`);
    }

    const toast = reactive({ show:false, msg:'', ok:true });
    let toastTimer = null;
    function showToast(msg, ok=true){ toast.msg=msg; toast.ok=ok; toast.show=true; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.show=false,2600); }

    return {
      categories, activeKey, activeCategory, itemCount, activeItemCount, selectCategory,
      search, items,
      showPanel, isEditing, formModel, dependOptions, openAddPanel, openEditPanel, closePanel, saveItem, toggleActive,
      confirmDeleteItem, askDelete, cancelDelete, blockingDependents, confirmDelete,
      showAddCategory, categoryForm, openAddCategory, saveCategory,
      toast
    };
  },
  template: `
  <div id="app">
    <div class="panel-head">
      <div><div class="panel-title-row"><h2>Master Data Manager</h2></div></div>
      <button type="button" class="btn-brown" @click="openAddPanel">+ Add</button>
    </div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-title">Master Category</div>
        <div class="category-list">
          <div class="category-item" v-for="cat in categories" :key="cat.CODE" :class="{active: cat.CODE===activeKey}" @click="selectCategory(cat.CODE)">
            <span class="category-checkbox">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span class="category-text">
              <div class="category-label">{{ cat.NAME }}</div>
              <div class="category-code">{{ cat.CODE }}</div>
            </span>
            <span class="category-count">{{ itemCount(cat.CODE) }}</span>
          </div>
        </div>
        <button type="button" class="add-category-btn" @click="openAddCategory">+ Add New Category</button>
      </aside>

      <main class="main">
        <div class="main-header">
          <div>
            <div class="main-title">
              <span>{{ activeCategory?.NAME }}</span>
              <span class="badge-code">{{ activeCategory?.CODE }}</span>
            </div>
            <div class="main-subtitle">Total {{ itemCount(activeKey) }} items · Active : {{ activeItemCount(activeKey) }}</div>
          </div>
        </div>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" v-model="search" placeholder="Search by code, name, or description...">
        </div>

        <div class="data-card">
          <table class="data-table" v-if="items.length">
            <thead>
              <tr>
                <th style="width:70px;">Sequence</th>
                <th style="width:170px;">Code</th>
                <th>Name / Description</th>
                <th style="width:130px;">Depend on</th>
                <th style="width:90px;">Status</th>
                <th style="width:20px;"></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(item, idx) in items" :key="item.CODE">
                <td>{{ idx + 1 }}</td>
                <td><span class="code-pill">{{ item.CODE }}</span></td>
                <td>
                  <div class="item-name">{{ item.NAME }}</div>
                  <div class="item-desc" v-if="item.DESCRIPTION">{{ item.DESCRIPTION }}</div>
                </td>
                <td>
                  <span v-if="item.DEPEND_ON">{{ item.DEPEND_ON }}</span>
                  <span v-else class="depend-empty">—</span>
                </td>
                <td>
                  <label class="switch">
                    <input type="checkbox" :checked="item.ACTIVE==='Y'" @change="toggleActive(item)">
                    <span class="slider"></span>
                  </label>
                </td>
                <td>
                  <div class="dropdown-container">
                    <button class="btn-dots" onclick="toggleDropdown(event, this)">⋮</button>
                    <div class="dropdown-menu">
                      <button type="button" @click="openEditPanel(item)">Edit</button>
                      <button type="button" @click="askDelete(item)">Delete</button>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div class="empty-state" v-else>No results found</div>
        </div>
      </main>
    </div>

    <!-- Add / Edit item panel -->
    <div class="overlay" v-if="showPanel" @click.self="closePanel">
      <div class="side-panel">
        <div class="side-panel-head">
          <div class="side-panel-title">{{ isEditing ? 'Edit' : 'New' }} · {{ activeCategory?.NAME }}</div>
          <button type="button" class="close-x" @click="closePanel">✕</button>
        </div>
        <div class="side-panel-body">
          <div class="field-group">
            <label class="field-label">Code <span style="color:red">*</span></label>
            <input type="text" class="form-control" v-model="formModel.CODE" :readonly="isEditing">
          </div>
          <div class="field-group">
            <label class="field-label">Name <span style="color:red">*</span></label>
            <input type="text" class="form-control" v-model="formModel.NAME">
          </div>
          <div class="field-group">
            <label class="field-label">Description</label>
            <textarea class="form-control" rows="3" v-model="formModel.DESCRIPTION"></textarea>
          </div>
          <div class="field-group">
            <label class="field-label">Order</label>
            <input type="number" class="form-control" v-model="formModel.ORDER" readonly>
          </div>
          <div class="field-group">
            <label class="field-label">Depend on (Optional)</label>
            <select class="form-select" v-model="formModel.DEPEND_ON">
              <option value="">— Select —</option>
              <option v-for="opt in dependOptions" :key="opt.CODE" :value="opt.CODE">{{ opt.CODE }}</option>
            </select>
          </div>
          <div class="toggle-row">
            <div>
              <div class="t-title">Active</div>
              <div class="t-sub">Inactive items will not be available for selection across all other pages.</div>
            </div>
            <label class="switch"><input type="checkbox" v-model="formModel.ACTIVE" true-value="Y" false-value="N"><span class="slider"></span></label>
          </div>
        </div>
        <div class="panel-footer">
          <button type="button" class="btn-ghost" @click="closePanel">Cancel</button>
          <button type="button" class="btn-brown" @click="saveItem">Save</button>
        </div>
      </div>
    </div>

    <!-- Add category modal -->
    <div class="modal-overlay" v-if="showAddCategory" @click.self="showAddCategory=false">
      <div class="modal-box">
        <h3>Add New Category</h3>
        <p>หมวดหมู่ใหม่จะกลายเป็นเมนูใหม่ในแถบซ้าย และสามารถเพิ่มรายการย่อยภายในได้ทันที</p>
        <div class="field-group"><label class="field-label">Code</label><input type="text" class="form-control" v-model="categoryForm.CODE" placeholder="เช่น LEAD_TYPE"></div>
        <div class="field-group"><label class="field-label">Name</label><input type="text" class="form-control" v-model="categoryForm.NAME"></div>
        <div class="field-group"><label class="field-label">Description</label><textarea class="form-control" v-model="categoryForm.DESCRIPTION"></textarea></div>
        <div class="modal-actions"><button class="btn-ghost" @click="showAddCategory=false">Cancel</button><button class="btn-brown" @click="saveCategory">Create</button></div>
      </div>
    </div>

    <!-- Delete confirm -->
    <div class="modal-overlay" v-if="confirmDeleteItem" @click.self="cancelDelete">
      <div class="modal-box">
        <h3>Delete this record?</h3>
        <p>You are about to delete <strong>{{ confirmDeleteItem.NAME }}</strong> ({{ confirmDeleteItem.CODE }}). This cannot be undone.</p>
        <div class="warn-box" v-if="blockingDependents.length">⚠ {{ blockingDependents.length }} record(s) depend on this item ({{ blockingDependents.map(r=>r.NAME).join(', ') }}) — disable it instead of deleting.</div>
        <div class="modal-actions"><button class="btn-ghost" @click="cancelDelete">Cancel</button><button class="btn-danger" @click="confirmDelete">Confirm</button></div>
      </div>
    </div>

    <div class="toast" v-if="toast.show"><span class="tick">{{ toast.ok ? '✓' : '!' }}</span> {{ toast.msg }}</div>
  </div>
  `
}).mount('#app');
</script>
</body>
</html>
