<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
@font-face {
    font-family: "Krungsri-med";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con_med-webfont.ttf") format("truetype");
}
@font-face {
    font-family: "Krungsri";
    font-style: normal;
    font-weight: normal;
    src: url("./font/krungsri_con-webfont.ttf") format("truetype");
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Krungsri-med';}
html,body{height:100%;}
body{background:#FFF;color:#1a1a1a;}
input,textarea,select{border:none !important;outline:none;font-family:inherit;}

/* ============ Layout ============ */
.chat-app{display:flex;height:100vh;overflow:hidden;}

/* ============ Sidebar (โทนเดียวกับ sidebar หลัก) ============ */
.chat-sidebar{
  width:250px;flex-shrink:0;display:flex;flex-direction:column;
  background:#f2f0f0;border-right:1px solid #e0e0e0;color:#4a4a4a;
}
.sb-brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 15px 14px 15px;border-bottom:2px solid #e0e0e0;
}
.sb-logo{
  width:32px;height:32px;border-radius:6px;
  background:#7b615c;color:#f1c40f;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.sb-title{font-size:15px;font-weight:600;color:#333;}
.sb-sub{font-size:10px;color:#999;letter-spacing:.8px;text-transform:uppercase;}

.btn-newchat{
  margin:14px 14px 6px 14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:#5B4F4B;color:#FFFFFF;border:none;border-radius:7px;
  padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 1px 3px rgba(60,50,45,.18);
  transition:background .15s;
}
.btn-newchat:hover{background:#6F5F5E;}
.btn-newchat svg{flex-shrink:0;}

.sb-history{flex:1;overflow-y:auto;padding:0 0 14px 0;}
.hist-group-lbl{
  padding:16px 20px 8px 20px;
  font-size:12px;font-weight:bold;color:#666;
}
.hist-item{
  position:relative;display:flex;align-items:center;
  padding:9px 10px 9px 20px;cursor:pointer;
  font-size:13px;color:#555;
  transition:background .12s;
}
.hist-item:hover{background:#eceaea;}
.hist-item.active{background:#eceaea;}
.hist-item.active .hist-name{font-weight:bold;color:#222;}
.hist-dot{margin-right:10px;font-size:10px;color:#a0a0a0;flex-shrink:0;}
.hist-item.active .hist-dot{color:#ffcc00;}
.hist-name{
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btn-dots{
  background:none;border:none;cursor:pointer;color:#6b7280;
  font-size:16px;line-height:1;padding:0 8px;
  visibility:hidden;flex-shrink:0;transition:color .2s;
}
.hist-item:hover .btn-dots{visibility:visible;}
.btn-dots:hover{color:#000;}
.dropdown-container{position:relative;display:inline-block;}
.dropdown-menu{
  display:none;position:absolute;right:0;top:100%;z-index:30;
  background:#fff;border:1px solid #e5e7eb;border-radius:6px;
  box-shadow:0 4px 6px rgba(0,0,0,.1);padding:8px;white-space:nowrap;min-width:100px;
}
.dropdown-menu.show{display:block;}
.dropdown-menu button{
  display:block;width:100%;min-width:70px;border:none;background:#fff;cursor:pointer;
  font-size:13px;color:#333;text-align:left;padding:6px 8px;
}
.dropdown-menu button:hover{background:#F3F4F6;border-radius:4px;}
.dropdown-menu button.danger{color:#DC2626;}

.sb-foot{
  border-top:1px solid #e0e0e0;padding:12px 14px;
}
.btn-back{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:#FFF;color:#5B4F4B;
  border:1.5px solid #d8d4d2;border-radius:7px;
  padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;
  transition:all .15s;
}
.btn-back:hover{background:#5B4F4B;border-color:#5B4F4B;color:#FFF;}

/* ============ Main ============ */
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;}

.chat-topbar{
  display:flex;align-items:center;gap:12px;
  background:#fff;border-bottom:2px solid #EEE;
  padding:14px 22px;min-height:56px;
}
.chat-title{
  font-size:14px;font-weight:600;color:#333;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.note-pill{
  display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0;
  font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px;
}
.note-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.np-completed{background:#ECFDF5;color:#10B981;}
.np-incomplete{background:#FEF2F2;color:#EF4444;}

/* ---- messages area (dotted canvas เหมือนหน้า workflow) ---- */
.chat-canvas{
  flex:1;overflow-y:auto;
  background-image:radial-gradient(circle,#DCDFE9 1px,transparent 1px);
  background-size:11px 11px;background-color:#fff;
  padding:26px 0;
}
.chat-inner{max-width:780px;margin:0 auto;padding:0 24px;
  display:flex;flex-direction:column;gap:18px;}

/* ---- empty state ---- */
.empty-state{
  margin:auto;max-width:640px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;
}
.empty-logo{
  width:54px;height:54px;border-radius:10px;
  background:#7b615c;color:#f1c40f;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
  box-shadow:0 3px 10px rgba(60,50,45,.25);
}
.empty-title{font-size:21px;font-weight:600;color:#333;}
.empty-sub{font-family:'Krungsri';font-size:14px;color:#888;line-height:1.6;}
.suggest-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:6px;}
.suggest-chip{
  border:1px solid #E0E0E0;background:#FFF;border-radius:999px;cursor:pointer;
  font-size:12px;color:#555;padding:8px 16px;
  transition:all .15s;
}
.suggest-chip:hover{border-color:#5B4F4B;color:#5B4F4B;background:#FAF9F8;}

/* ---- message rows ---- */
.msg-row{display:flex;gap:11px;}
.msg-row.user{justify-content:flex-end;}

.ai-avatar{
  width:30px;height:30px;border-radius:6px;
  background:#7b615c;color:#f1c40f;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;
}

.bubble{
  max-width:78%;padding:11px 15px;
  font-family:'Krungsri';font-size:14px;line-height:1.7;
  word-break:break-word;white-space:pre-wrap;
}
.bubble-user{
  background:#5B4F4B;color:#FFFFFF;
  border-radius:12px 12px 4px 12px;
  box-shadow:0 1px 3px rgba(60,50,45,.18);
}
.bubble-ai{
  background:#FFFFFF;border:1.5px solid #E0E0E0;color:#1a1a1a;
  border-radius:4px 12px 12px 12px;
  position:relative;transition:box-shadow .15s;
}
.bubble-ai:hover{box-shadow:0 3px 12px rgba(0,0,0,.09);}
.bubble-ai.error{border-color:#FCA5A5;background:#FEF2F2;}
.msg-time{font-size:10px;color:#BBBBBB;margin-top:5px;}
.msg-row.user .msg-time{text-align:right;}

/* ---- typing indicator ---- */
.typing{display:inline-flex;align-items:center;gap:5px;padding:4px 2px;}
.typing i{
  width:6px;height:6px;border-radius:50%;background:#C8BEB9;
  animation:bounce 1.2s infinite;
}
.typing i:nth-child(2){animation-delay:.15s;}
.typing i:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* ---- input area ---- */
.chat-inputbar{padding:0 24px 20px 24px;background:transparent;}
.input-card{
  max-width:780px;margin:0 auto;
  background:#FFF;border:1.5px solid #E0E0E0;border-radius:12px;
  padding:12px 14px 10px 16px;
  transition:border-color .15s, box-shadow .15s;
}
.input-card:focus-within{
  border-color:#5B4F4B;
  box-shadow:0 0 0 3px rgba(91,79,75,.10);
}
.input-card textarea{
  width:100%;resize:none;
  font-family:'Krungsri';font-size:14px;line-height:1.6;color:#1a1a1a;
  max-height:160px;overflow-y:auto;background:transparent;
}
.input-card textarea::placeholder{color:#BBBBBB;}
.input-foot{display:flex;align-items:center;gap:10px;margin-top:6px;}
.input-hint{font-size:10.5px;color:#BBBBBB;}
.btn-send{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  background:#5B4F4B;color:#FFF;border:none;border-radius:7px;
  padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:0 1px 3px rgba(60,50,45,.18);
  transition:background .15s,opacity .15s;
}
.btn-send:hover{background:#6F5F5E;}
.btn-send[disabled]{background:#cccccc;cursor:not-allowed;}

/* scrollbar */
.sb-history::-webkit-scrollbar,.chat-canvas::-webkit-scrollbar{width:8px;}
.sb-history::-webkit-scrollbar-thumb{background:#d8d4d2;border-radius:4px;}
.chat-canvas::-webkit-scrollbar-thumb{background:#DDD;border-radius:4px;}
.sb-history::-webkit-scrollbar-track,.chat-canvas::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div class="chat-app">

  <!-- ============ Sidebar ============ -->
  <aside class="chat-sidebar">
    <div class="sb-brand">
      <div class="sb-logo">AI</div>
      <div>
        <div class="sb-title">MCRM Chat</div>
        <div class="sb-sub">AI Assistant</div>
      </div>
    </div>

    <button class="btn-newchat" onclick="newChat()">
      <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New chat
    </button>

    <div class="sb-history" id="historyList"></div>

    <div class="sb-foot">
      <button class="btn-back" onclick="goBack()">
        <svg width="13" height="13" viewBox="0 0 13 13"><path d="M8.5 1.5L3.5 6.5l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="chat-main">
    <div class="chat-topbar">
      <div class="chat-title" id="chatTitle">New chat</div>
      <span class="note-pill np-completed" id="connPill">Connected</span>
    </div>

    <div class="chat-canvas" id="chatCanvas">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="chat-inputbar">
      <div class="input-card">
        <textarea id="chatInput" rows="1" placeholder="พิมพ์คำถามที่นี่..."
          oninput="autoGrow(this)" onkeydown="onInputKey(event)"></textarea>
        <div class="input-foot">
          <span class="input-hint">Enter เพื่อส่ง &nbsp;•&nbsp; Shift + Enter ขึ้นบรรทัดใหม่</span>
          <button class="btn-send" id="btnSend" onclick="sendMessage()">
            ส่ง
            <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h9M7 2.5L10.5 6 7 9.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>

<script>
/* =========================================================
   State
========================================================= */
let chats = [
  {
    id:'C0003', title:'สรุปเงื่อนไข X_SELL_POOL', group:'วันนี้',
    messages:[
      {role:'user', text:'ช่วยสรุปเงื่อนไขการคัด lead เข้า X_SELL_POOL ให้หน่อย', time:'09:41'},
      {role:'ai', text:'เงื่อนไขหลักในการคัด lead เข้า X_SELL_POOL มีดังนี้ครับ\n\n1. Suppress ตามเงื่อนไขพื้นฐาน เช่น AGE, REMAINING_TERM, DELINQUENCY, TOTAL_INCOME และ BLACKLIST\n2. ตรวจสอบ Consent ระดับ Customer\n3. คัดกรองตาม Bill Code และ Write-off Type\n\nต้องการให้ลงรายละเอียด step ไหนเพิ่มเติมไหมครับ', time:'09:41'}
    ]
  },
  { id:'C0002', title:'วิธีเช็คสถานะ Flow F00005', group:'7 วันที่ผ่านมา', messages:[] },
  { id:'C0001', title:'อธิบาย parameter Flat rate', group:'7 วันที่ผ่านมา', messages:[] },
];
let activeChatId = null;
let waitingReply = false;
let chatSeq = chats.length + 1;

/* =========================================================
   WebSocket (จุดต่อระบบจริง)
   ---------------------------------------------------------
   const ws = new WebSocket('wss://<api-gateway-endpoint>');
   ws.onopen    = () => setConn(true);
   ws.onclose   = () => setConn(false);
   ws.onmessage = (e) => {
     const data = JSON.parse(e.data);        // { chatId, result }
     receiveAIMessage(data.result);
   };
   ส่งข้อความ: ws.send(JSON.stringify({ action:'sendMessage', chatId:activeChatId, message:text }));
========================================================= */

/* =========================================================
   Sidebar / History
========================================================= */
function renderHistory(){
  const el = document.getElementById('historyList');
  el.innerHTML = '';
  const groups = [...new Set(chats.map(c=>c.group))];
  groups.forEach(g=>{
    el.innerHTML += `<div class="hist-group-lbl">${g}</div>`;
    chats.filter(c=>c.group===g).forEach(c=>{
      el.innerHTML += `
        <div class="hist-item ${c.id===activeChatId?'active':''}" onclick="openChat('${c.id}')">
          <span class="hist-dot">●</span>
          <span class="hist-name" title="${c.title}">${c.title}</span>
          <div class="dropdown-container" onclick="event.stopPropagation()">
            <button class="btn-dots" onclick="toggleDropdown(event,this)">⋮</button>
            <div class="dropdown-menu">
              <button onclick="renameChat('${c.id}')">Rename</button>
              <button class="danger" onclick="deleteChat('${c.id}')">Delete</button>
            </div>
          </div>
        </div>`;
    });
  });
}

function newChat(){
  activeChatId = null;
  document.getElementById('chatTitle').textContent = 'New chat';
  renderHistory();
  renderMessages();
  document.getElementById('chatInput').focus();
}

function openChat(id){
  activeChatId = id;
  const c = chats.find(x=>x.id===id);
  document.getElementById('chatTitle').textContent = c.title;
  renderHistory();
  renderMessages();
}

function renameChat(id){
  const c = chats.find(x=>x.id===id);
  Swal.fire({
    title:'Rename chat', input:'text', inputValue:c.title,
    showCancelButton:true, confirmButtonText:'Save',
    confirmButtonColor:'#5B4F4B'
  }).then(r=>{
    if(r.isConfirmed && r.value.trim()){
      c.title = r.value.trim();
      if(id===activeChatId) document.getElementById('chatTitle').textContent = c.title;
      renderHistory();
    }
  });
}

function deleteChat(id){
  Swal.fire({
    title:'Delete chat?', text:'บทสนทนานี้จะถูกลบถาวร', icon:'warning',
    showCancelButton:true, confirmButtonText:'Delete', confirmButtonColor:'#DC2626'
  }).then(r=>{
    if(r.isConfirmed){
      chats = chats.filter(x=>x.id!==id);
      if(activeChatId===id) newChat(); else renderHistory();
    }
  });
}

/* =========================================================
   Messages
========================================================= */
function nowTime(){
  return new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}

function renderMessages(){
  const inner = document.getElementById('chatInner');
  const c = chats.find(x=>x.id===activeChatId);

  if(!c || c.messages.length===0){
    inner.innerHTML = `
      <div class="empty-state" style="margin-top:25vh">
        <div class="empty-logo">AI</div>
        <div class="empty-title">สวัสดีครับ วันนี้ให้ช่วยอะไรดี</div>
       
      </div>`;
    return;
  }

  inner.innerHTML = c.messages.map(m=>{
    if(m.role==='user'){
      return `<div class="msg-row user">
        <div>
          <div class="bubble bubble-user">${escapeHTML(m.text)}</div>
          <div class="msg-time">${m.time}</div>
        </div>
      </div>`;
    }
    return `<div class="msg-row">
      <div class="ai-avatar">AI</div>
      <div>
        <div class="bubble bubble-ai ${m.error?'error':''}">${escapeHTML(m.text)}</div>
        <div class="msg-time">${m.time}</div>
      </div>
    </div>`;
  }).join('');

  if(waitingReply){
    inner.innerHTML += `
      <div class="msg-row" id="typingRow">
        <div class="ai-avatar">AI</div>
        <div class="bubble bubble-ai"><span class="typing"><i></i><i></i><i></i></span></div>
      </div>`;
  }
  scrollBottom();
}

function scrollBottom(){
  const cv = document.getElementById('chatCanvas');
  cv.scrollTop = cv.scrollHeight;
}

function escapeHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =========================================================
   Send / Receive
========================================================= */
function useSuggest(btn){
  document.getElementById('chatInput').value = btn.textContent;
  sendMessage();
}

function autoGrow(ta){
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,160)+'px';
}

function onInputKey(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage(){
  if(waitingReply) return;
  const ta = document.getElementById('chatInput');
  const text = ta.value.trim();
  if(!text) return;

  // ยังไม่มี chat -> สร้างใหม่
  if(!activeChatId){
    const id = 'C'+String(chatSeq++).padStart(4,'0');
    chats.unshift({
      id, title: text.length>32 ? text.slice(0,32)+'…' : text,
      group:'วันนี้', messages:[]
    });
    activeChatId = id;
    document.getElementById('chatTitle').textContent = chats[0].title;
  }

  const c = chats.find(x=>x.id===activeChatId);
  c.messages.push({role:'user', text, time:nowTime()});
  ta.value=''; autoGrow(ta);

  waitingReply = true;
  document.getElementById('btnSend').disabled = true;
  renderHistory();
  renderMessages();

  /* ---- จุดยิงจริง: ws.send({action:'sendMessage', ...}) ----
     ตอนนี้ mock delay แทนการรอ result จาก LLM Lambda */
  const delayMs = 1200 + Math.random()*1500;
  setTimeout(()=> receiveAIMessage(mockReply(text)), delayMs);
}

function receiveAIMessage(text, isError=false){
  const c = chats.find(x=>x.id===activeChatId);
  if(!c) return;
  waitingReply = false;
  document.getElementById('btnSend').disabled = false;
  c.messages.push({role:'ai', text, time:nowTime(), error:isError});
  renderMessages();
  document.getElementById('chatInput').focus();
}

function mockReply(q){
  const replies = [
    'รับทราบครับ กำลังตรวจสอบข้อมูลจากระบบ MCRM ให้\n\nจากคำถาม "'+q.slice(0,40)+(q.length>40?'…':'')+'" สรุปได้ดังนี้\n\n1. ข้อมูลส่วนแรกดึงจาก X_SELL_POOL ตามเงื่อนไขที่ active อยู่\n2. ระบบจะ suppress ตาม parameter ล่าสุดที่ตั้งค่าไว้\n\nต้องการดูรายละเอียดเชิงลึกส่วนไหนเพิ่มไหมครับ',
    'จากที่ตรวจสอบ Flow ล่าสุด สถานะโดยรวมยังอยู่ระหว่างดำเนินการครับ มี step ที่ Completed แล้วบางส่วน และมี Manual step ที่รอการกดยืนยัน\n\nแนะนำให้เข้าไปดูที่หน้า Workflow Management เพื่อกด Run step ถัดไปครับ',
    'Parameter ชุดนี้ใช้สำหรับกำหนดเงื่อนไข Loan offer ครับ โดยหลัก ๆ ประกอบด้วย Max LTV, Receipt Term, FOIR และ Flat rate หลาย option ซึ่งแต่ละ option จะ apply กับ program ต่างกัน\n\nอยากให้อธิบาย option ไหนเป็นพิเศษไหมครับ'
  ];
  return replies[Math.floor(Math.random()*replies.length)];
}

/* ตัวอย่างตอน WebSocket หลุด: setConn(false) */
function setConn(ok){
  const p = document.getElementById('connPill');
  p.className = 'note-pill ' + (ok ? 'np-completed' : 'np-incomplete');
  p.textContent = ok ? 'Connected' : 'Disconnected';
}

/* =========================================================
   Dropdown (แบบเดียวกับหน้า workflow)
========================================================= */
function toggleDropdown(event, button){
  event.stopPropagation();
  const currentMenu = button.nextElementSibling;
  document.querySelectorAll('.dropdown-menu').forEach(menu=>{
    if(menu!==currentMenu) menu.classList.remove('show');
  });
  currentMenu.classList.toggle('show');
}
document.addEventListener('click', ()=>{
  document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.remove('show'));
});
